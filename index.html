<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tree Survey Locator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
  --forest:#07130e;
  --forest-2:#10281d;
  --panel:#ffffff;
  --panel-soft:#f5f8f5;
  --leaf:#1f8a55;
  --leaf-dark:#135f3b;
  --mint:#dff4e6;
  --amber:#d49a20;
  --cream:#fbfdfb;
  --ink:#101b15;
  --muted:#5f6e65;
  --line:rgba(16,27,21,.12);
  --danger:#c64e40;
  --shadow:0 18px 52px rgba(7,19,14,.13);
  --shadow-soft:0 7px 22px rgba(7,19,14,.08);
}
*{box-sizing:border-box}
.sr-only{
  position:absolute;
  width:1px;
  height:1px;
  padding:0;
  margin:-1px;
  overflow:hidden;
  clip:rect(0,0,0,0);
  white-space:nowrap;
  border:0;
}
body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(circle at top left, rgba(31,138,85,.14), transparent 34rem),
    radial-gradient(circle at top right, rgba(212,154,32,.10), transparent 26rem),
    linear-gradient(180deg,#f6f8f5 0%,#e9eee9 100%);
  color:var(--ink);
  font-family:Inter,Arial,sans-serif;
}
header{
  position:sticky;
  top:0;
  z-index:700;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  padding:14px 116px 14px 18px;
  border-bottom:1px solid rgba(255,255,255,.10);
  background:
    linear-gradient(135deg,rgba(31,138,85,.20),transparent 42%),
    linear-gradient(135deg,var(--forest-2),var(--forest));
  color:var(--cream);
  box-shadow:0 14px 34px rgba(7,19,14,.20);
}
body.map-mode{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  overflow:hidden;
}
body.map-mode header{
  display:none;
}
body.map-mode main{
  position:fixed;
  inset:0;
  width:100vw;
  height:100dvh;
  margin:0;
  padding:0;
  display:block;
  max-width:none;
}
h1,h2,p{margin:0}
.brand-copy{
  min-width:0;
}
.brand-kicker{
  display:block;
  margin-bottom:2px;
  color:rgba(251,253,251,.58);
  font-size:11px;
  font-weight:800;
  letter-spacing:1.6px;
  text-transform:uppercase;
}
h1{
  font-size:21px;
  line-height:1.05;
  letter-spacing:-.01em;
}
header p{
  display:none;
}
.brand-mark{
  width:52px;
  height:52px;
  flex:0 0 auto;
  display:grid;
  place-items:center;
  border:1px solid rgba(255,255,255,.18);
  border-radius:16px;
  background:rgba(255,255,255,.08);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 10px 24px rgba(0,0,0,.18);
}
.brand-mark svg{
  width:35px;
  height:35px;
  stroke:#fff;
  fill:none;
  stroke-width:2.4;
  stroke-linecap:round;
  stroke-linejoin:round;
}
main{
  width:min(100%,980px);
  margin:auto;
  padding:16px 12px 34px;
}
.view-switch-fab{
  position:fixed;
  top:14px;
  right:10px;
  z-index:930;
  min-height:44px;
  min-width:82px;
  border:1px solid rgba(255,255,255,.20);
  border-radius:999px;
  background:rgba(31,138,85,.96);
  color:#fff;
  font:800 13px Inter,Arial,sans-serif;
  box-shadow:0 10px 26px rgba(7,19,14,.22);
  cursor:pointer;
  backdrop-filter:blur(8px);
}
body.map-mode .view-switch-fab{
  top:10px;
  right:10px;
}
.tabs{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:6px;
  max-width:360px;
  margin:0 auto 14px;
  padding:4px;
  border:1px solid var(--line);
  border-radius:999px;
  background:rgba(255,255,255,.72);
  box-shadow:var(--shadow-soft);
}
.tab-btn{
  min-height:38px;
  border:0;
  border-radius:999px;
  background:transparent;
  color:var(--ink);
  font:700 14px Inter,Arial,sans-serif;
  cursor:pointer;
}
.tab-btn.active{
  background:var(--forest-2);
  color:#fff;
  box-shadow:0 7px 16px rgba(7,19,14,.18);
}
.view{
  display:block;
}
body.map-mode #mapView{
  position:absolute;
  inset:0;
  min-height:0;
  display:block;
}
body.map-mode #locatorView{
  display:none;
}
body.map-mode .tabs{
  display:none;
}
body.map-mode .map-controls{
  position:absolute;
  z-index:840;
  left:10px;
  right:10px;
  bottom:max(12px,env(safe-area-inset-bottom));
  margin:0;
  padding:10px;
  background:rgba(255,255,255,.92);
  box-shadow:var(--shadow);
  backdrop-filter:blur(7px);
}
body.map-mode .map-top-right,
body.map-mode .map-search{
  position:absolute;
  z-index:850;
  margin:0;
  padding:8px;
  background:rgba(255,255,255,.92);
  box-shadow:var(--shadow);
  backdrop-filter:blur(7px);
}
body.map-mode .map-top-right{
  top:58px;
  right:10px;
  width:min(160px,36vw);
}
body.map-mode .map-search{
  top:10px;
  left:50%;
  width:min(420px,48vw);
  transform:translateX(-50%);
}
body.map-mode .map-title{
  display:none;
}
body.screenshot-mode .map-controls,
body.screenshot-mode .map-top-right,
body.screenshot-mode .map-search,
body.screenshot-mode .leaflet-control{
  display:none !important;
}
body.map-mode .map-canvas-card{
  position:absolute;
  inset:0;
  min-height:0;
  padding:0;
  border:0;
  border-radius:0;
  overflow:hidden;
}
.hero{
  position:relative;
  display:grid;
  grid-template-columns:auto minmax(0,1fr);
  gap:16px;
  align-items:center;
  margin-bottom:14px;
  padding:16px;
  border:1px solid rgba(255,255,255,.12);
  border-radius:22px;
  background:
    linear-gradient(135deg,rgba(31,138,85,.88),rgba(16,40,29,.96)),
    var(--forest-2);
  color:#fff;
  box-shadow:var(--shadow);
  overflow:hidden;
}
#locateBtn{
  width:112px;
  height:112px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.34);
  background:linear-gradient(145deg,#2fa566,var(--leaf-dark));
  color:#fff;
  font-size:22px;
  font-weight:800;
  cursor:pointer;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 18px 40px rgba(7,19,14,.24);
}
#locateBtn:disabled{opacity:.75;cursor:wait}
#status{
  min-height:24px;
  color:rgba(251,253,251,.78);
  font-family:Inter,Arial,sans-serif;
  font-size:13px;
  font-weight:800;
  letter-spacing:1.2px;
  text-transform:uppercase;
  text-align:left;
}
#status::before{
  content:"Field position";
  display:block;
  margin-bottom:5px;
  color:#fff;
  font-size:24px;
  line-height:1.05;
  letter-spacing:-.02em;
  text-transform:none;
}
.grid{
  display:grid;
  gap:10px;
}
.card{
  border:1px solid var(--line);
  border-radius:14px;
  background:rgba(255,255,255,.91);
  padding:14px;
  box-shadow:var(--shadow-soft);
}
.card h2{
  margin-bottom:8px;
  color:#466053;
  font-family:Inter,Arial,sans-serif;
  font-size:12px;
  letter-spacing:1.1px;
  text-transform:uppercase;
}
.card.feature-card{
  border-color:rgba(31,138,85,.20);
  background:linear-gradient(180deg,#fff,#f8fbf8);
}
.paperwork-strip{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
  margin-bottom:10px;
}
.paperwork-strip .card{
  min-height:128px;
}
.span-match-card{
  cursor:pointer;
}
.span-match-card:active{
  transform:translateY(1px);
}
.span-match-card:focus-visible{
  outline:3px solid rgba(24,118,74,.35);
  outline-offset:2px;
}
.value{
  font-size:21px;
  line-height:1.28;
  overflow-wrap:anywhere;
  font-weight:800;
  letter-spacing:-.01em;
}
.detail{
  margin-top:6px;
  color:var(--muted);
  font-family:Inter,Arial,sans-serif;
  font-size:13px;
  line-height:1.35;
}
.actions{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:7px;
  margin-top:12px;
}
button.small,a.small{
  min-height:42px;
  border:1px solid var(--line);
  border-radius:10px;
  background:#fff;
  color:var(--ink);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:8px 10px;
  text-decoration:none;
  font:700 14px Inter,Arial,sans-serif;
  cursor:pointer;
  box-shadow:0 3px 10px rgba(7,19,14,.06);
}
button:focus-visible,
a:focus-visible,
input:focus-visible,
textarea:focus-visible,
.span-match-card:focus-visible{
  outline:3px solid rgba(216,154,28,.75);
  outline-offset:3px;
}
button:disabled{
  opacity:.58;
  cursor:not-allowed;
}
.status-line{
  min-height:20px;
}
.status-line[data-tone="error"]{
  color:#9d3328;
  font-weight:800;
}
.status-line[data-tone="success"]{
  color:var(--leaf-dark);
  font-weight:800;
}
.state-pill{
  display:inline-flex;
  align-items:center;
  gap:6px;
  min-height:28px;
  margin-top:10px;
  padding:5px 9px;
  border:1px solid rgba(24,118,74,.18);
  border-radius:999px;
  background:var(--mint);
  color:var(--leaf-dark);
  font:800 12px Inter,Arial,sans-serif;
}
.empty-state{
  border-style:dashed;
  background:rgba(255,255,255,.68);
}
input.text-field,textarea.text-field{
  width:100%;
  border:1px solid var(--line);
  border-radius:12px;
  background:#fff;
  color:var(--ink);
  padding:11px 12px;
  font:16px Inter,Arial,sans-serif;
}
input.file-field{
  width:100%;
  color:var(--ink);
  font:14px Inter,Arial,sans-serif;
  padding:10px;
  border:1px dashed rgba(31,138,85,.28);
  border-radius:12px;
  background:#fbfdfb;
}
textarea.text-field{
  min-height:118px;
  resize:vertical;
  line-height:1.35;
}
.field-row{
  display:grid;
  gap:8px;
  margin-top:12px;
}
.search-panel{
  margin-bottom:10px;
}
.search-form{
  display:grid;
  grid-template-columns:1fr auto;
  gap:8px;
  align-items:center;
}
.map-search-form{
  grid-template-columns:minmax(0,1fr) auto auto auto;
}
.search-form .small{
  min-width:96px;
}
.match-list{
  display:grid;
  gap:10px;
  margin-top:12px;
}
.field-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:10px;
}
.map-panel{
  display:grid;
  gap:10px;
  margin-top:12px;
}
#w3wMap{
  width:100%;
  height:300px;
  border:1px solid var(--line);
  border-radius:8px;
  overflow:hidden;
  background:#d8dfcf;
}
#surveyMap{
  width:100%;
  height:min(72vh,680px);
  min-height:430px;
  border:1px solid var(--line);
  border-radius:8px;
  overflow:hidden;
  background:#d8dfcf;
  touch-action:none;
}
body.map-mode #surveyMap{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  min-height:0;
  border:0;
  border-radius:0;
}
.leaflet-container{
  font-family:Inter,Arial,sans-serif;
  touch-action:none;
}
.leaflet-control,
.leaflet-control *{
  touch-action:manipulation;
}
.survey-line-canvas{
  position:absolute;
  inset:0;
  z-index:430;
  pointer-events:none;
  display:none;
}
.survey-drawing-canvas{
  position:absolute;
  inset:0;
  z-index:620;
  pointer-events:none;
  display:none;
}
.text-prompt-backdrop{
  position:fixed;
  inset:0;
  z-index:5000;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px;
  background:rgba(15,23,18,.42);
  backdrop-filter:blur(5px);
}
.text-prompt-dialog{
  width:min(420px, 100%);
  border:1px solid rgba(255,255,255,.18);
  border-radius:18px;
  background:#f7faf6;
  color:#111827;
  box-shadow:0 24px 70px rgba(0,0,0,.28);
  padding:18px;
}
.text-prompt-dialog h2{
  margin:0 0 12px;
  font-size:18px;
}
.text-prompt-dialog label{
  display:block;
  font-size:13px;
  font-weight:700;
  color:#46624c;
  margin-bottom:6px;
}
.text-prompt-dialog input{
  width:100%;
  min-height:48px;
  border:1px solid #b9c8bb;
  border-radius:12px;
  padding:10px 12px;
  font:700 20px/1.2 Inter, Arial, sans-serif;
  text-transform:uppercase;
}
.text-prompt-actions{
  display:flex;
  justify-content:flex-end;
  gap:10px;
  margin-top:16px;
}
.text-prompt-actions button{
  min-height:44px;
  border:0;
  border-radius:12px;
  padding:10px 14px;
  font-weight:800;
  cursor:pointer;
}
.text-prompt-actions .secondary{
  background:#e7ede8;
  color:#1f3527;
}
.text-prompt-actions .primary{
  background:#28633d;
  color:white;
}
.choice-prompt-options{
  display:grid;
  gap:10px;
  margin-top:12px;
}
.choice-prompt-option{
  min-height:58px;
  border:1px solid #b9c8bb;
  border-radius:14px;
  background:#fff;
  color:#102518;
  padding:12px;
  text-align:left;
  cursor:pointer;
}
.choice-prompt-option strong{
  display:block;
  font-size:18px;
  line-height:1.1;
}
.choice-prompt-option span{
  display:block;
  margin-top:4px;
  color:#46624c;
  font-size:13px;
  font-weight:700;
}
.choice-prompt-option:focus-visible{
  outline:3px solid #d4910a;
  outline-offset:2px;
}
.map-toolbar,
.map-actions,
.frame-actions,
.map-compact-actions,
.map-rotation-actions{
  display:grid;
  gap:8px;
}
.map-toolbar{grid-template-columns:repeat(11,minmax(0,1fr));margin-top:10px}
.map-actions{
  grid-template-columns:repeat(4,minmax(0,1fr));
  margin-top:10px;
}
.frame-actions{
  grid-template-columns:1fr;
}
.map-compact-actions{
  grid-template-columns:1fr;
}
.map-rotation-actions{
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:6px;
  margin-top:6px;
}
.map-toolbar .small,
.map-actions .small,
.frame-actions .small,
.map-compact-actions .small,
.map-rotation-actions .small{
  min-height:48px;
  padding:10px 8px;
  touch-action:manipulation;
  user-select:none;
}
.map-toolbar.compact-labels .small{
  min-width:44px;
  padding:8px 4px;
  background:var(--leaf-dark);
  border-color:rgba(255,255,255,.16);
  color:#fff;
  font-size:19px;
  line-height:1;
  box-shadow:0 4px 14px rgba(10,31,22,.14);
}
.map-toolbar.compact-labels .small.primary{
  background:var(--leaf);
  border-color:var(--leaf);
}
.map-toolbar.compact-labels .small.danger{
  background:#9d3328;
  border-color:#9d3328;
  color:#fff;
}
.map-toolbar.compact-labels .small:disabled{
  background:#7f8b84;
  border-color:#7f8b84;
  color:rgba(255,255,255,.72);
}
.map-tool-icon{
  width:24px;
  height:24px;
  display:block;
  pointer-events:none;
}
.map-tool-icon *{
  vector-effect:non-scaling-stroke;
}
.map-rotation-actions .small{
  min-height:44px;
  padding:9px 4px;
  font-size:12px;
}
.map-toolbar .small.active{
  border-color:var(--leaf);
  background:var(--leaf);
  color:#fff;
}
.edit-action{
  border-color:rgba(24,118,74,.48);
}
.draw-tools{display:none}
#mapView.map-locked .frame-tools{display:none}
#mapView.map-locked .draw-tools{display:grid}
#mapView:not(.map-locked) .map-toolbar{
  display:none;
}
#mapView.map-locked .map-toolbar{
  display:grid;
}
.map-hint{
  color:var(--muted);
  font:700 12px Arial,sans-serif;
  letter-spacing:.6px;
  text-transform:uppercase;
}
.draw-shape-label{
  display:grid;
  width:54px;
  height:34px;
  place-items:center;
  color:#111;
  font:800 24px Inter,Arial,sans-serif;
  text-shadow:0 1px 2px #fff, 0 -1px 2px #fff, 1px 0 2px #fff, -1px 0 2px #fff;
  transform:scale(var(--draw-label-scale, 1));
  transform-origin:center;
  will-change:transform;
}
.pole-label{
  color:#101010;
  font:700 13px Arial,sans-serif;
  text-shadow:0 1px 2px #fff, 0 -1px 2px #fff, 1px 0 2px #fff, -1px 0 2px #fff;
  white-space:nowrap;
}
.survey-pole-dot{
  width:22px;
  height:22px;
  border:0;
  border-radius:50%;
  background:transparent;
}
.pole-popup{
  min-width:150px;
  font-family:Inter,Arial,sans-serif;
  line-height:1.35;
}
.pole-popup-line{
  margin:0 0 4px;
}
.pole-popup-title{
  font-weight:700;
}
.pole-popup-actions{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:6px;
  margin-top:8px;
}
.pole-popup-actions button{
  min-height:36px;
  border:1px solid rgba(16,34,25,.25);
  border-radius:6px;
  background:#fff;
  color:#102219;
  font:700 13px Arial,sans-serif;
}
.pole-popup-actions button.danger{
  border-color:rgba(176,48,32,.45);
  color:#8f2418;
}
.text-label{
  color:#111;
  font:700 17px Inter,Arial,sans-serif;
  text-shadow:0 1px 2px #fff, 0 -1px 2px #fff, 1px 0 2px #fff, -1px 0 2px #fff;
  white-space:nowrap;
}
.marker-row{
  display:grid;
  grid-template-columns:1fr auto;
  gap:8px;
  align-items:center;
}
.marker-row .small{
  min-width:110px;
}
a.primary,button.primary{
  border-color:var(--leaf);
  background:var(--leaf);
  color:#fff;
}
.danger{border-color:rgba(198,78,64,.58);color:#9d3328}
.hidden{display:none}
.asset-line{
  margin-top:5px;
  font-family:Inter,Arial,sans-serif;
  font-size:14px;
  line-height:1.38;
}
.asset-line strong{color:var(--ink)}
@media(max-width:820px){
  main{
    padding-inline:10px;
  }
  .field-grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }
  .paperwork-strip{
    grid-template-columns:1fr;
  }
}
@media(max-width:520px){
  header{
    padding:12px 100px 12px 14px;
  }
  h1{
    font-size:19px;
  }
  .brand-kicker{
    font-size:10px;
  }
  .brand-mark{
    width:46px;
    height:46px;
    border-radius:14px;
  }
  .view-switch-fab{
    min-width:76px;
    min-height:40px;
    top:12px;
  }
  .tabs{
    max-width:none;
  }
  .hero{
    grid-template-columns:1fr;
    justify-items:center;
    text-align:center;
    padding:18px 14px;
  }
  #locateBtn{
    width:118px;
    height:118px;
  }
  #status{
    text-align:center;
  }
  #status::before{
    font-size:23px;
  }
  .actions{grid-template-columns:1fr}
  .search-form{grid-template-columns:1fr}
  body.map-mode .tabs{
    width:168px;
  }
  body.map-mode .map-controls{
    left:8px;
    right:8px;
    bottom:8px;
  }
  body.map-mode .map-search{
    top:64px;
    left:8px;
    right:8px;
    width:auto;
    transform:none;
  }
  body.map-mode .map-top-right{
    top:58px;
  }
  .map-search-form{grid-template-columns:1fr 1fr}
  .map-search-form input{grid-column:1 / -1}

<body>
<header>

    <span class="brand-kicker">Tree survey</span>
    <h1>Field Locator</h1>
    <p>Field mapping, span lookup and survey copy helper</p>

    <svg viewBox="0 0 48 48" role="img">

      <div id="status" class="status-line" role="status" aria-live="polite">Tap to locate</div>

    <section class="card search-panel">

      </div>
      <div class="detail status-line" id="spanDataStatus" role="status" aria-live="polite">No span spreadsheet imported on this device.</div>
      <div class="actions">
        <button class="small primary" type="button" onclick="importSpanFiles()">Import spreadsheet</button>
        <button class="small danger" type="button" onclick="clearSpanData()">Clear data</button>
      </div>
    </section>

    <section class="card search-panel">
      <h2>Find span</h2>
      <form class="search-form" onsubmit="searchSpan(event)">
        <label class="sr-only" for="spanSearchInput">Search span data</label>
        <input class="text-field" id="spanSearchInput" type="search" placeholder="Span, pole, feeder, circuit, primary, grid ref" autocomplete="off">
        <button class="small primary" type="submit">Search</button>
      </form>
      <div class="detail status-line" id="spanSearchStatus" role="status" aria-live="polite">Search your uploaded LV/HV span data.</div>
      <div class="match-list" id="spanSearchResults"></div>
    </section>

    <section id="results" class="grid"></section>
  </section>

  <section id="mapView" class="view hidden" role="tabpanel" aria-labelledby="mapTab">
    <section class="card map-top-right">
      <div class="map-compact-actions">
        <button class="small" id="baseMapToggleBtn" type="button" onclick="toggleSurveyBaseMap()">Satellite</button>
      </div>
      <div class="map-rotation-actions">
        <button class="small" id="mapRotateLeftBtn" type="button" onclick="rotateSurveyMap(-15)">Left</button>
        <button class="small" id="mapNorthBtn" type="button" onclick="resetSurveyMapRotation()">North</button>
        <button class="small" id="mapRotateRightBtn" type="button" onclick="rotateSurveyMap(15)">Right</button>
      </div>
    </section>

    <section class="card map-search">
      <form class="search-form map-search-form" onsubmit="searchMapSpan(event)">
        <label class="sr-only" for="mapSpanSearchInput">Search map span or pole</label>
        <input class="text-field" id="mapSpanSearchInput" type="search" placeholder="Search span or pole" autocomplete="off">
        <button class="small primary" type="submit">Find</button>
        <button class="small primary" id="mapLockToggleBtn" type="button" onclick="toggleSurveyLock()" aria-label="Lock this view and open drawing tools" title="Lock this view and open drawing tools">Draw</button>
        <button class="small" type="button" onclick="undoMapDrawing()" aria-label="Undo last map action" title="Undo last map action" data-full-label="Undo" data-icon-key="undo">Undo</button>
      </form>
    </section>

    <section class="card search-panel map-controls">
      <h2 class="map-title">Map drawing</h2>
      <div class="map-hint" id="surveyMapStage">Frame the span</div>
      <div class="detail status-line" id="surveyMapStatus" role="status" aria-live="polite">Open the map tab to plot all imported spans.</div>
      <div class="map-toolbar">
        <button class="small" id="tool-tree" type="button" onclick="setMapTool('tree')" aria-label="Place one tree" data-full-label="Tree" data-icon-key="tree">Tree</button>
        <button class="small" id="tool-group" type="button" onclick="setMapTool('group')" aria-label="Draw a tree group" data-full-label="Group" data-icon-key="group">Group</button>
        <button class="small" id="tool-pole" type="button" onclick="setMapTool('pole')" aria-label="Add missing pole" data-full-label="Add pole" data-icon-key="pole">Add pole</button>
        <button class="small" id="tool-link" type="button" onclick="setMapTool('link')" aria-label="Link two poles" data-full-label="Link" data-icon-key="link">Link</button>
        <button class="small" id="tool-unlink" type="button" onclick="setMapTool('unlink')" aria-label="Unlink two poles" data-full-label="Unlink" data-icon-key="unlink">Unlink</button>
        <button class="small" id="tool-route" type="button" onclick="setMapTool('route')" aria-label="Draw access route" data-full-label="Access" data-icon-key="route">Access</button>
        <button class="small" id="tool-label" type="button" onclick="setMapTool('label')" aria-label="Add text label" data-full-label="Label" data-icon-key="label">Label</button>
        <button class="small edit-action" id="renameDrawingBtn" type="button" onclick="renameSelectedDrawing()" aria-label="Rename selected tree or group" data-full-label="Rename" data-icon-key="rename" disabled>Rename</button>
        <button class="small danger" id="tool-delete" type="button" onclick="setMapTool('delete')" aria-label="Delete selected map item" data-full-label="Delete" data-icon-key="delete">Delete</button>
        <button class="small" type="button" onclick="undoMapDrawing()" aria-label="Undo last map mark" data-full-label="Undo" data-icon-key="undo">Undo</button>
        <button class="small primary" type="button" onclick="captureSurveyMapScreenshot()" aria-label="Save or share map screenshot" data-full-label="Screenshot" data-icon-key="screenshot">Screenshot</button>
      </div>
    </section>
    <section class="card map-canvas-card">
      <div id="surveyMap" aria-label="Survey map drawing area"></div>
    </section>
  </section>
</main>

<script>
const locateBtn = document.getElementById("locateBtn");
const statusEl = document.getElementById("status");
const resultsEl = document.getElementById("results");
const spanFileInput = document.getElementById("spanFileInput");
const spanDataStatus = document.getElementById("spanDataStatus");

const viewSwitchBtn = document.getElementById("viewSwitchBtn");
const surveyMapStatus = document.getElementById("surveyMapStatus");
const surveyMapStage = document.getElementById("surveyMapStage");
const mapSpanSearchInput = document.getElementById("mapSpanSearchInput");
const USE_COMPACT_MAP_TOOL_LABELS = true;
const MAP_TOOL_ICONS = {
  tree:`<svg class="map-tool-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5l-5 6h2.5L6 14h4v5.5h4V14h4l-3.5-4.5H17l-5-6z"/><path d="M8.5 20h7"/></svg>`,

  pole:`<svg class="map-tool-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="14" r="4"/><path d="M17 5v7"/><path d="M13.5 8.5h7"/></svg>`,
  link:`<svg class="map-tool-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="12" r="3"/><circle cx="17" cy="12" r="3"/><path d="M10 12h4"/></svg>`,
  unlink:`<svg class="map-tool-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="12" r="3"/><circle cx="17" cy="12" r="3"/><path d="M10 12h1.5"/><path d="M14 12h.5"/><path d="M12 7l-1 3"/><path d="M13 14l-1 3"/></svg>`,
  route:`<svg class="map-tool-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18c4-9 8 2 12-7 1.4-3.1 2.7-4.3 4-5"/><path d="M4 18l3-1"/><path d="M4 18l1 3"/></svg>`,
  label:`<svg class="map-tool-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7h14v10H5z"/><path d="M8 15V9"/><path d="M8 9h5"/><path d="M8 12h4"/></svg>`,
  rename:`<svg class="map-tool-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M5 18.5l4.2-1 9-9a2 2 0 0 0-2.8-2.8l-9 9L5 18.5z"/><path d="M13.5 7.5l3 3"/></svg>`,
  delete:`<svg class="map-tool-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7h14"/><path d="M9 7V5h6v2"/><path d="M7 7l1 13h8l1-13"/><path d="M10 11v5"/><path d="M14 11v5"/></svg>`,
  undo:`<svg class="map-tool-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 7l-4 4 4 4"/><path d="M5 11h9a5 5 0 1 1-3.5 8.5"/></svg>`,
  screenshot:`<svg class="map-tool-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h3l1.5-2h3L15 8h3v10H6z"/><circle cx="12" cy="13" r="3"/><path d="M18 6h2v2"/><path d="M4 8V6h2"/><path d="M6 20H4v-2"/><path d="M20 18v2h-2"/></svg>`
};
let currentReport = null;
let currentSpanMatches = [];
let currentLocateMatches = [];
let w3wMap = null;
let w3wMarker = null;
let w3wMarkerPosition = null;
let surveyMap = null;
let surveyStreetLayer = null;
let surveySatelliteLayer = null;
let surveyIsSatellite = false;
let surveyNetworkRenderer = null;
let surveyPoleLayer = null;
let surveyLineLayer = null;
let surveyLineCanvas = null;
let surveyLineCanvasCtx = null;
let surveyLineShapes = [];
let surveyLineCanvasSize = { width:0, height:0, ratio:0 };
let surveyLineRedrawFrame = null;
let surveyOverlayPositionFrame = null;
let surveyDrawingCanvas = null;
let surveyDrawingCanvasCtx = null;
let surveyDrawingCanvasSize = { width:0, height:0, ratio:0 };
let surveyDrawingRedrawFrame = null;
let surveyDrawingScaleFrame = null;
let surveyDrawingLayer = null;
let surveyPoleBounds = null;
let mapTool = "pan";
let mapLocked = false;
let lockedMapBounds = null;
let lockedMapMinZoom = null;
let surveyMapRendered = false;
let surveyPolePoints = [];
let forcedMapPoleId = null;
let manualMapLinks = [];
let blockedAutoMapLinks = [];
let pendingLinkPoleId = null;
let rotateRedrawTimer = null;
let activeStrokePreview = null;
let mapDrawingStack = [];
let mapUndoStack = [];
let selectedDrawing = null;
let drawCounters = { tree:0, group:0 };
let activeRoute = null;
let activeRoutePoints = [];
let restoringMapDrawings = false;
let activeMapDrawingKey = "";
window.SPAN_DATA = [];
window.AE_DATA = [];

locateBtn.addEventListener("click", locate);
loadStoredSpanData();
loadStoredManualMapLinks();
loadStoredBlockedAutoMapLinks();
loadBundledAEData();
loadBundledSpanData();
applyMapToolbarLabelMode();

function setBusy(isBusy, text){
  locateBtn.disabled = isBusy;
  locateBtn.textContent = isBusy ? "..." : "LOCATE";
  setElementStatus(statusEl, text, isBusy ? "" : "");
}

function applyMapToolbarLabelMode(){
  const toolbar = document.querySelector(".map-toolbar");
  if(!toolbar) return;
  toolbar.classList.toggle("compact-labels", USE_COMPACT_MAP_TOOL_LABELS);
  toolbar.querySelectorAll("button[data-full-label]").forEach((button) => {
    if(USE_COMPACT_MAP_TOOL_LABELS){
      button.innerHTML = MAP_TOOL_ICONS[button.dataset.iconKey] || escapeHtml(button.dataset.fullLabel || "");
    }else{
      button.textContent = button.dataset.fullLabel || button.textContent;
    }
    button.title = button.getAttribute("aria-label") || button.dataset.fullLabel || "";
  });
  updateRouteControls();
}

function escapeHtml(value){
  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function setElementStatus(element, message, tone=""){
  if(!element) return;
  element.textContent = message;
  if(tone) element.dataset.tone = tone;
  else delete element.dataset.tone;
}

function card(id, title, value, detail="", actions=""){
  return `
    <article class="card" id="${id}">
      <h2>${escapeHtml(title)}</h2>
      <div class="value">${escapeHtml(value)}</div>
      ${detail ? `<div class="detail">${escapeHtml(detail)}</div>` : ""}
      ${actions}
    </article>
  `;
}

function actions(items){
  return `<div class="actions">${items.join("")}</div>`;
}

function linkButton(label, href, primary=false){
  return `<a class="small ${primary ? "primary" : ""}" href="${href}" target="_blank" rel="noopener">${escapeHtml(label)}</a>`;
}

function buttonHtml(label, onclick, primary=false){
  return `<button class="small ${primary ? "primary" : ""}" type="button" onclick="event.stopPropagation(); ${onclick}">${escapeHtml(label)}</button>`;
}

function copyButton(label, value){
  const encodedValue = encodeURIComponent(value).replaceAll("'","%27");
  return `<button class="small" type="button" onclick="event.stopPropagation(); copyText('${encodedValue}')">${escapeHtml(label)}</button>`;
}

async function copyText(encoded){
  const text = decodeURIComponent(encoded);
  try{
    await navigator.clipboard.writeText(text);
    setElementStatus(statusEl, "Copied", "success");
  }catch{
    setElementStatus(statusEl, "Could not copy", "error");
  }
}

function switchView(view){
  const showMap = view === "map";
  document.body.classList.toggle("map-mode", showMap);
  locatorView.classList.toggle("hidden", showMap);
  mapView.classList.toggle("hidden", !showMap);
  locatorTab.classList.toggle("active", !showMap);
  mapTab.classList.toggle("active", showMap);
  locatorTab.setAttribute("aria-selected", String(!showMap));
  mapTab.setAttribute("aria-selected", String(showMap));
  updateViewSwitchButton(showMap);

  if(showMap){
    initSurveyMap();
    setTimeout(() => {
      if(surveyMap){
        surveyMap.invalidateSize();
        const selectedSpan = currentReport?.nearestSpan;
        if(selectedSpan && getSpanMapPosition(selectedSpan)){
          focusMapOnSpan(selectedSpan);
        }else{
          renderSurveyMap(true);
        }
      }
    }, 100);
  }
}

function toggleAppView(){
  switchView(document.body.classList.contains("map-mode") ? "locator" : "map");
}

function updateViewSwitchButton(showMap=document.body.classList.contains("map-mode")){
  if(!viewSwitchBtn) return;
  viewSwitchBtn.textContent = showMap ? "Locator" : "Map";
  viewSwitchBtn.title = showMap ? "Return to locator view" : "Open map view";
  viewSwitchBtn.setAttribute("aria-label", showMap ? "Switch to locator view" : "Switch to map view");
}

function initSurveyMap(attempts=0){
  if(surveyMap) return;

  if(!window.L){
    if(attempts > 12){
      setSurveyMapStatus("Map library could not load. Check signal, then refresh.");
      return;
    }
    setSurveyMapStatus("Map is loading...");
    setTimeout(() => initSurveyMap(attempts + 1), 500);
    return;
  }

  const mapEl = document.getElementById("surveyMap");
  if(!mapEl) return;

  surveyMap = L.map(mapEl, {
    rotate:true,
    rotateControl:false,
    touchRotate:true,
    bearing:0,
    zoomControl:false,
    attributionControl:true,
    tap:true,
    touchZoom:true,
    dragging:true,
    scrollWheelZoom:true,
    doubleClickZoom:false,
    inertia:false,
    zoomAnimation:false,
    fadeAnimation:false,
    markerZoomAnimation:false,
    bounceAtZoomLimits:false,
    preferCanvas:false,
    zoomSnap:0.25,
    zoomDelta:0.25,
    wheelDebounceTime:36,
    wheelPxPerZoomLevel:95,
    maxZoom:22,
    maxBoundsViscosity:1.0
  }).setView([52.68, -1.82], 13);
  surveyNetworkRenderer = L.svg({ padding:0.7 });
  surveyMap.createPane("drawingLabelPane");
  surveyMap.getPane("drawingLabelPane").style.zIndex = 720;
  surveyMap.createPane("drawingHitPane");
  surveyMap.getPane("drawingHitPane").style.zIndex = 625;

  surveyStreetLayer = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxNativeZoom:19,
    maxZoom:22,
    attribution:"&copy; OpenStreetMap",
    keepBuffer:6,
    updateWhenIdle:false,
    updateWhenZooming:true
  }).addTo(surveyMap);

  surveySatelliteLayer = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {
    maxNativeZoom:19,
    maxZoom:22,
    attribution:"Sources: Esri, Maxar, Earthstar Geographics, and the GIS User Community",
    keepBuffer:6,
    updateWhenIdle:false,
    updateWhenZooming:true
  });

  updateBaseMapButtons();

  surveyLineLayer = L.layerGroup().addTo(surveyMap);
  surveyPoleLayer = L.layerGroup().addTo(surveyMap);
  surveyDrawingLayer = L.layerGroup().addTo(surveyMap);
  installSurveyLineCanvas(mapEl);
  installSurveyDrawingCanvas(mapEl);
  surveyMap.on("zoom move rotate", () => {
    scheduleSurveyOverlayPositionRefresh();
    scheduleSurveyDrawingScaleRefresh();
  });
  surveyMap.on("zoomend", () => {
    drawSurveyLineCanvas();
    drawSurveyDrawingCanvas();
    refreshSurveyPoleMarkers();
  });
  surveyMap.on("moveend", () => {
    drawSurveyLineCanvas();
    drawSurveyDrawingCanvas();
    refreshSurveyPoleMarkers();
  });
  surveyMap.on("rotate", () => {
    updateSurveyMapRotationButton();
    scheduleSurveyOverlayPositionRefresh();
  });
  surveyMap.on("rotateend", () => {
    drawSurveyLineCanvas();
    drawSurveyDrawingCanvas();
    refreshSurveyPoleMarkers();
  });
  surveyMap.on("resize", () => {
    drawSurveyLineCanvas();
    drawSurveyDrawingCanvas();
    refreshSurveyPoleMarkers();
  });
  installSurveyTouchHandlers(mapEl);
  unlockSurveyFrame(false);
  renderSurveyMap(true);
  restoreMapDrawings();
}

function setSurveyMapStatus(message){
  if(surveyMapStatus) surveyMapStatus.textContent = message;
}

function setSurveyMapStage(message){
  if(surveyMapStage) surveyMapStage.textContent = message;
}

function toggleSurveyBaseMap(){
  if(!surveyMap || !surveyStreetLayer || !surveySatelliteLayer) return;
  if(surveyIsSatellite){
    surveyMap.removeLayer(surveySatelliteLayer);
    surveyStreetLayer.addTo(surveyMap);
    surveyIsSatellite = false;
  }else{
    surveyMap.removeLayer(surveyStreetLayer);
    surveySatelliteLayer.addTo(surveyMap);
    surveyIsSatellite = true;
  }
  updateBaseMapButtons();
}

function updateBaseMapButtons(){
  const label = surveyIsSatellite ? "Street" : "Satellite";
  for(const id of ["baseMapToggleBtn"]){
    const button = document.getElementById(id);
    if(button) button.textContent = label;
  }
}

function rotateSurveyMap(delta){
  if(!surveyMap) initSurveyMap();
  if(!surveyMap) return;
  if(mapLocked){
    setSurveyMapStatus("Rotation is locked. Unlock the map to turn the frame.");
    return;
  }
  const current = getSurveyMapBearing();
  setSurveyMapBearing(current + delta);
}

function resetSurveyMapRotation(){
  if(mapLocked){
    setSurveyMapStatus("Rotation is locked. Unlock the map to turn the frame.");
    return;
  }
  setSurveyMapBearing(0);
}

function getSurveyMapBearing(){
  if(!surveyMap) return 0;
  if(typeof surveyMap.getBearing === "function"){
    const bearing = Number(surveyMap.getBearing());
    return Number.isFinite(bearing) ? bearing : 0;
  }
  return Number(surveyMap._bearing || 0) || 0;
}

function setSurveyMapBearing(bearing){
  if(!surveyMap) return;
  const next = ((bearing % 360) + 360) % 360;
  if(typeof surveyMap.setBearing !== "function"){
    setSurveyMapStatus("Map rotation could not load. Check signal, then refresh.");
    return;
  }
  surveyMap.setBearing(next);
  updateSurveyMapRotationButton();
  scheduleSurveyLineRedrawAfterRotate();
}

function updateSurveyMapRotationButton(){
  const bearing = Math.round(getSurveyMapBearing());
  const northButton = document.getElementById("mapNorthBtn");
  if(northButton) northButton.textContent = bearing ? `${bearing} deg` : "North";
  for(const id of ["mapRotateLeftBtn","mapNorthBtn","mapRotateRightBtn"]){
    const button = document.getElementById(id);
    if(!button) continue;
    button.disabled = mapLocked;
    button.title = mapLocked ? "Unlock the map to rotate it" : "";
  }
}

function scheduleSurveyLineRedrawAfterRotate(){
  window.clearTimeout(rotateRedrawTimer);
  rotateRedrawTimer = window.setTimeout(() => {
    if(!surveyMapRendered) return;
    refreshSurveyPoleMarkers();
  }, 180);
}

function searchMapSpan(event){
  event.preventDefault();
  const query = mapSpanSearchInput?.value.trim() || "";
  if(!Array.isArray(window.SPAN_DATA) || !window.SPAN_DATA.length){
    setSurveyMapStatus("Import span data before searching the map.");
    return;
  }
  if(!query){
    setSurveyMapStatus("Type a span or pole name to zoom the map to it.");
    return;
  }

  const matches = findSpanMatches(query, 1);
  const span = matches[0];
  focusMapOnSpan(span, { query });
}

function focusMapOnSpan(span, options={}){
  if(!surveyMap) initSurveyMap();
  if(!surveyMapRendered) renderSurveyMap(false);

  const query = options.query || poleDisplayName(span || {}) || "that span";
  const position = getSpanMapPosition(span);
  if(!span || !position){
    setSurveyMapStatus(`No plottable map result found for "${query}".`);
    return;
  }

  switchMapDrawingSpan(span);
  if(mapLocked) unlockSurveyFrame(false);
  forcedMapPoleId = span.mapPoleId || null;
  if(mapSpanSearchInput) mapSpanSearchInput.value = poleDisplayName(span);
  const zoom = Math.max(surveyMap.getZoom() || 0, 18);
  surveyMap.setView([position.lat, position.lon], zoom, { animate:false });
  drawSurveyLineCanvas();
  refreshSurveyPoleMarkers(forcedMapPoleId);

  const point = surveyPolePoints.find((item) => item.span === span || item.span?.mapPoleId === span.mapPoleId);
  if(point?.marker){
    point.marker.openPopup();
  }

  setSurveyMapStage("Frame the span");
  setSurveyMapStatus(`Showing ${poleDisplayName(span)}. Pan/zoom the patch, then lock the map.`);
}

async function captureSurveyMapScreenshot(){
  const mapEl = document.getElementById("surveyMap");
  if(!mapEl) return;

  try{
    if(typeof html2canvas !== "function") throw new Error("Screenshot tool still loading");
    setSurveyMapStatus("Preparing a map-only screenshot...");
    await new Promise((resolve) => setTimeout(resolve, 120));
    const canvas = await html2canvas(mapEl, {
      backgroundColor:null,
      scale:Math.min(2, window.devicePixelRatio || 1),
      useCORS:true,
      allowTaint:false,
      ignoreElements:(el) => Boolean(el.closest?.(".leaflet-control"))
    });
    const blob = await new Promise((resolve) => canvas.toBlob(resolve, "image/png"));
    const file = blob ? new File([blob], `survey-map-${new Date().toISOString().slice(0, 10)}.png`, { type:"image/png" }) : null;
    if(file && navigator.canShare?.({ files:[file] }) && navigator.share){
      await navigator.share({
        files:[file],
        title:"Survey map screenshot",
        text:"Save this map image to Photos or Files."
      });
      setSurveyMapStatus("Share sheet opened. Choose Save Image to put it in Photos.");
      return;
    }
    const link = document.createElement("a");
    link.href = canvas.toDataURL("image/png");
    link.download = `survey-map-${new Date().toISOString().slice(0, 10)}.png`;
    document.body.appendChild(link);
    link.click();
    link.remove();
    setSurveyMapStatus("Screenshot downloaded. On iPad, use Share or Files to save it to Photos.");
  }catch{
    enterMapScreenshotMode();
  }
}

function enterMapScreenshotMode(){
  document.body.classList.add("screenshot-mode");
  setSurveyMapStatus("Controls hidden for 5 seconds. Take your iPad screenshot now.");
  setTimeout(() => {
    document.body.classList.remove("screenshot-mode");
    setSurveyMapStatus("Screenshot mode finished.");
  }, 5000);
}

function installSurveyTouchHandlers(mapEl){
  let strokePoints = [];
  let strokeStarted = false;
  let strokeMoved = false;
  let suppressClick = false;
  let pointTap = null;
  const editPointers = new Map();
  let editGesture = null;
  let selectedDrawingLastTap = null;

  mapEl.addEventListener("pointerdown", (event) => {
    const drawingTarget = mapLocked && mapTool === "pan"
      ? (findDrawingFromEventTarget(event.target) || findDrawingAtPointer(event))
      : null;
    if(drawingTarget){
      event.preventDefault();
      event.stopPropagation();
      event.stopImmediatePropagation?.();
      selectDrawing(drawingTarget);
      mapEl.setPointerCapture?.(event.pointerId);
      editPointers.set(event.pointerId, pointerEventPoint(event));
      editGesture = {
        last:gestureInfo([...editPointers.values()]),
        lastLatLng:latLngFromClientPoint(gestureInfo([...editPointers.values()]).center),
        totalMove:0,
        moved:false,
        startedOnDrawing:true,
        drawing:drawingTarget
      };
      disableSurveyMapMovement();
      return;
    }

    if(selectedDrawing && mapLocked && mapTool === "pan" && !editGesture && !isDrawingDomTarget(event.target)){
      event.preventDefault();
      event.stopPropagation();
      event.stopImmediatePropagation?.();
      selectDrawing(null);
      setSurveyMapStatus("Mark deselected.");
      return;
    }

    if(editGesture && selectedDrawing && mapLocked && mapTool === "pan"){
      event.preventDefault();
      event.stopPropagation();
      event.stopImmediatePropagation?.();
      mapEl.setPointerCapture?.(event.pointerId);
      editPointers.set(event.pointerId, pointerEventPoint(event));
      editGesture.last = gestureInfo([...editPointers.values()]);
      editGesture.lastLatLng = editGesture.last ? latLngFromClientPoint(editGesture.last.center) : null;
      disableSurveyMapMovement();
      return;
    }

    if(surveyMap && mapLocked && isPointMapTool() && !isLeafletControlTarget(event.target)){
      event.preventDefault();
      event.stopPropagation();
      event.stopImmediatePropagation?.();
      mapEl.setPointerCapture?.(event.pointerId);
      pointTap = {
        id:event.pointerId,
        x:event.clientX,
        y:event.clientY,
        latlng:latLngFromPointerEvent(event)
      };
      return;
    }

    if(!surveyMap || !mapLocked || !["group","route"].includes(mapTool)) return;
    event.preventDefault();
    event.stopPropagation();
    event.stopImmediatePropagation?.();
    mapEl.setPointerCapture?.(event.pointerId);
    strokeStarted = true;
    strokeMoved = false;
    strokePoints = [latLngFromPointerEvent(event)];
    activeStrokePreview = L.polyline(strokePoints, {
      color:mapTool === "route" ? "#f4c430" : "#5fbd65",
      weight:5,
      opacity:0.95,
      dashArray:mapTool === "route" ? null : "8 6",
      interactive:false
    }).addTo(surveyDrawingLayer);
  }, { passive:false, capture:true });

  mapEl.addEventListener("pointermove", (event) => {
    if(pointTap && pointTap.id === event.pointerId){
      const moved = Math.hypot(event.clientX - pointTap.x, event.clientY - pointTap.y);
      if(moved > 10) pointTap = null;
    }

    if(editPointers.has(event.pointerId) && editGesture){
      event.preventDefault();
      event.stopPropagation();
      event.stopImmediatePropagation?.();
      editPointers.set(event.pointerId, pointerEventPoint(event));
      const current = gestureInfo([...editPointers.values()]);
      if(!current || !editGesture.last) return;

      const dx = current.center.x - editGesture.last.center.x;
      const dy = current.center.y - editGesture.last.center.y;
      editGesture.totalMove += Math.hypot(dx, dy);
      if(editGesture.totalMove > 6){
        editGesture.moved = true;
      }
      if(Math.hypot(dx, dy) > 1 && editGesture.moved){
        const currentLatLng = latLngFromClientPoint(current.center);
        if(editGesture.lastLatLng && currentLatLng){
          moveSelectedDrawingByLatLngDelta(
            currentLatLng.lat - editGesture.lastLatLng.lat,
            currentLatLng.lng - editGesture.lastLatLng.lng
          );
        }else{
          moveSelectedDrawingByPixels(dx, dy);
        }
      }

      if(current.count >= 2 && editGesture.last.count >= 2){
        const scale = current.distance / Math.max(1, editGesture.last.distance);
        const rotation = current.angle - editGesture.last.angle;
        if(Math.abs(scale - 1) > 0.01){
          resizeDrawing(selectedDrawing, scale);
          editGesture.moved = true;
        }
        if(Math.abs(rotation) > 0.015){
          rotateDrawing(selectedDrawing, rotation * 180 / Math.PI);
          editGesture.moved = true;
        }
      }

      editGesture.last = current;
      editGesture.lastLatLng = latLngFromClientPoint(current.center);
      return;
    }

    if(!strokeStarted || !surveyMap) return;
    event.preventDefault();
    event.stopPropagation();
    event.stopImmediatePropagation?.();
    strokePoints.push(latLngFromPointerEvent(event));
    strokeMoved = strokeMoved || strokePoints.length > 3;
    if(activeStrokePreview) activeStrokePreview.setLatLngs(strokePoints);
  }, { passive:false, capture:true });

  for(const eventName of ["pointerup","pointercancel"]){
    mapEl.addEventListener(eventName, (event) => {
      if(pointTap && pointTap.id === event.pointerId){
        event.preventDefault();
        event.stopPropagation();
        event.stopImmediatePropagation?.();
        suppressClick = true;
        applySurveyMapTool(pointTap.latlng);
        pointTap = null;
        setTimeout(() => {
          suppressClick = false;
        }, 500);
        return;
      }

      if(editPointers.has(event.pointerId)){
        event.preventDefault();
        event.stopPropagation();
        event.stopImmediatePropagation?.();
        mapEl.releasePointerCapture?.(event.pointerId);
        editPointers.delete(event.pointerId);
        const wasCancelled = event.type === "pointercancel";
        if(!wasCancelled && editGesture && !editGesture.moved && !editGesture.startedOnDrawing){
          selectDrawing(null);
          setSurveyMapStatus("Mark deselected.");
        }else if(!wasCancelled && editGesture && !editGesture.moved && editGesture.startedOnDrawing && selectedDrawing){
          const now = Date.now();
          const tapPoint = pointerEventPoint(event);
          const lastTapDistance = selectedDrawingLastTap
            ? Math.hypot(tapPoint.x - selectedDrawingLastTap.x, tapPoint.y - selectedDrawingLastTap.y)
            : Infinity;
          const tappedDrawing = editGesture.drawing || selectedDrawing;
          if(selectedDrawingLastTap?.drawing === tappedDrawing && now - selectedDrawingLastTap.time < 460 && lastTapDistance < 28){
            renameDrawingItem(tappedDrawing);
            selectedDrawingLastTap = null;
          }else{
            selectedDrawingLastTap = {
              time:now,
              x:tapPoint.x,
              y:tapPoint.y,
              drawing:tappedDrawing
            };
            setSurveyMapStatus(`${selectedDrawing.text} selected. Double tap to rename, drag to move, pinch to resize.`);
          }
        }
        if(editGesture?.moved) saveMapDrawings();
        if(!editPointers.size){
          editGesture = null;
          syncMapMovementState();
        }else{
          editGesture.last = gestureInfo([...editPointers.values()]);
          editGesture.lastLatLng = editGesture.last ? latLngFromClientPoint(editGesture.last.center) : null;
        }
        return;
      }

      if(!strokeStarted) return;
      event.preventDefault();
      event.stopPropagation();
      event.stopImmediatePropagation?.();
      mapEl.releasePointerCapture?.(event.pointerId);
      strokeStarted = false;
      suppressClick = true;
      if(activeStrokePreview){
        surveyDrawingLayer.removeLayer(activeStrokePreview);
        activeStrokePreview = null;
      }
      const completedTool = mapTool;
      if(completedTool === "route") addAccessRouteFromStroke(strokePoints, strokeMoved);
      else addSurveyShapeFromStroke(completedTool, strokePoints, strokeMoved);
      setMapTool("pan");
      if(completedTool === "route" && strokeMoved){
        setSurveyMapStatus("Access route drawn and saved.");
      }
      strokePoints = [];
      setTimeout(() => {
        suppressClick = false;
      }, 650);
    }, { passive:false, capture:true });
  }

  for(const eventName of ["touchstart","touchmove","touchend","touchcancel"]){
    mapEl.addEventListener(eventName, (event) => {
      if(!selectedDrawing || !mapLocked || mapTool !== "pan") return;
      if(eventName === "touchstart" && !isDrawingDomTarget(event.target) && !editGesture){
        event.preventDefault();
        event.stopPropagation();
        event.stopImmediatePropagation?.();
        selectDrawing(null);
        setSurveyMapStatus("Mark deselected.");
        return;
      }
      event.preventDefault();
      event.stopPropagation();
      event.stopImmediatePropagation?.();
      disableSurveyMapMovement();
    }, { passive:false, capture:true });
  }

  surveyMap.on("click", (event) => {
    if(suppressClick) return;
    handleSurveyMapClick(event);
  });
}

function renderSurveyMap(fitAfterRender=true){
  initSurveyMap();
  if(!surveyMap || !surveyPoleLayer || !surveyLineLayer) return;

  const points = getSurveyPolePoints();
  surveyPolePoints = points;
  surveyPoleLayer.clearLayers();
  surveyLineLayer.clearLayers();
  surveyLineShapes = [];
  clearSurveyLineCanvas();
  surveyPoleBounds = null;
  surveyMapRendered = false;

  if(!points.length){
    setSurveyMapStage("No map data");
    setSurveyMapStatus("No plottable poles found. Import a spreadsheet with Grid Ref or Grid Reference.");
    return;
  }

  const bounds = [];
  for(const point of points){
    bounds.push([point.lat, point.lon]);
  }

  renderSurveyLineRuns(points);
  renderManualMapLinks();
  surveyPoleBounds = L.latLngBounds(bounds);
  surveyMapRendered = true;
  if(fitAfterRender) fitSurveyMap();
  drawSurveyLineCanvas();
  refreshSurveyPoleMarkers();
  setSurveyMapStage(mapLocked ? "Drawing tools" : "Frame the span");
  setSurveyMapStatus(`${points.length} poles plotted. Links are inferred from pole names or nearest distance; use Link and Unlink to correct the map.`);
}

function fitSurveyMap(){
  if(!surveyMap) initSurveyMap();
  if(surveyMap && surveyPoleBounds && surveyPoleBounds.isValid()){
    surveyMap.fitBounds(surveyPoleBounds.pad(0.18), { maxZoom:18 });
  }
}

function getSurveyPolePoints(){
  const spans = Array.isArray(window.SPAN_DATA) ? window.SPAN_DATA : [];
  return spans
    .map((span) => {
      const position = getSpanMapPosition(span);
      if(!position) return null;
      if(!span.mapPoleId) span.mapPoleId = createId("pole");
      const label = poleDisplayName(span);
      const parsed = parsePoleLabel(label);
      return {
        span,
        label,
        lat:position.lat,
        lon:position.lon,
        prefix:parsed.prefix,
        number:parsed.number,
        suffix:parsed.suffix,
        network:lineNetworkKey(span)
      };
    })
    .filter(Boolean);
}

function lineNetworkKey(span){
  const voltage = normaliseSearchText(span?.voltage || "");
  if(voltage.startsWith("lv")){
    return [
      span.primaryNo || "primary",
      span.distNo || "dist",
      normaliseSearchText(span.circuitName || "circuit")
    ].join("|");
  }
  return span?.networkNumber || span?.primaryNo || "network";
}

function refreshSurveyPoleMarkers(forceMapPoleId=null){
  if(!surveyMap || !surveyPoleLayer || !surveyPolePoints.length) return;
  const forceId = forceMapPoleId || forcedMapPoleId;
  const zoom = surveyMap.getZoom();
  const density = poleDisplayDensity(zoom);
  const bounds = surveyMap.getBounds().pad(0.08);
  const shown = [];
  const usedCells = new Set();

  surveyPoleLayer.clearLayers();
  for(const point of surveyPolePoints){
    point.marker = null;
  }

  for(const point of surveyPolePoints){
    const isForced = forceId && point.span.mapPoleId === forceId;
    if(!isForced && !bounds.contains([point.lat, point.lon])) continue;

    let showLabel = isForced || density.showLabels;
    if(density.cellSize > 0 && !isForced){
      const pixel = surveyMap.latLngToContainerPoint([point.lat, point.lon]);
      const key = `${Math.floor(pixel.x / density.cellSize)}:${Math.floor(pixel.y / density.cellSize)}`;
      showLabel = !usedCells.has(key);
      if(showLabel) usedCells.add(key);
    }

    shown.push({ point, showLabel });
  }

  if(!shown.length){
    const fallback = surveyPolePoints.find((point) => bounds.contains([point.lat, point.lon])) || surveyPolePoints[0];
    if(fallback) shown.push({ point:fallback, showLabel:false });
  }

  for(const item of shown){
    renderSurveyPole(item.point, item.showLabel);
  }
}

function poleDisplayDensity(zoom){
  if(zoom >= 18) return { cellSize:0, showLabels:true };
  if(zoom >= 17) return { cellSize:100, showLabels:true };
  if(zoom >= 16) return { cellSize:155, showLabels:true };
  if(zoom >= 14.5) return { cellSize:210, showLabels:false };
  return { cellSize:280, showLabels:false };
}

function renderSurveyPole(point, showLabel=false){
  let dragStartPosition = null;
  const marker = L.marker([point.lat, point.lon], {
    draggable:true,
    title:point.label,
    icon:L.divIcon({
      className:"",
      html:`<div class="survey-pole-dot"></div>`,
      iconSize:[22,22],
      iconAnchor:[11,11]
    })
  }).addTo(surveyPoleLayer);

  marker.bindTooltip(point.label, {
    permanent:showLabel,
    direction:"top",
    offset:[0,-8],
    className:"pole-label"
  });

  marker.bindPopup(buildPolePopup(point));
  point.marker = marker;

  marker.on("popupopen", () => {
    if(["link","unlink","delete","pole"].includes(mapTool)){
      marker.closePopup();
    }
  });

  marker.on("click", (event) => {
    if(mapTool === "link"){
      L.DomEvent.stop(event.originalEvent || event);
      surveyMap.closePopup();
      marker.closePopup();
      handleManualPoleLink(point);
      return;
    }
    if(mapTool === "unlink"){
      L.DomEvent.stop(event.originalEvent || event);
      surveyMap.closePopup();
      marker.closePopup();
      handleManualPoleUnlink(point);
      return;
    }
    if(mapTool === "delete"){
      L.DomEvent.stop(event.originalEvent || event);
      surveyMap.closePopup();
      marker.closePopup();
      removeMapPole(point.span.mapPoleId);
    }
  });

  marker.on("dragstart", () => {
    dragStartPosition = {
      mapPoleId:point.span.mapPoleId,
      label:point.label,
      lat:point.lat,
      lon:point.lon,
      spanLat:point.span.latitude,
      spanLon:point.span.longitude,
      coordinateSource:point.span.coordinateSource
    };
    setMapTool("pan");
  });

  marker.on("dragend", () => {
    const position = marker.getLatLng();
    const moved = dragStartPosition
      ? haversineKm(dragStartPosition.lat, dragStartPosition.lon, position.lat, position.lng) * 1000
      : 0;
    point.lat = position.lat;
    point.lon = position.lng;
    point.span.latitude = position.lat;
    point.span.longitude = position.lng;
    point.span.coordinateSource = "manual-map";
    if(dragStartPosition && moved > 0.15){
      recordMapUndoAction({
        type:"pole-move",
        ...dragStartPosition,
        nextLat:position.lat,
        nextLon:position.lng
      });
    }
    dragStartPosition = null;
    persistSpanData();
    redrawSurveyLinesOnly();
    setSurveyMapStatus(`${point.label} moved. Press Undo to put it back.`);
  });
}

function buildPolePopup(point){
  const wrap = document.createElement("div");
  wrap.className = "pole-popup";

  const lines = [
    ["Drag this pole to reposition it.", ""],
    [point.label, "pole-popup-title"],
    [point.span.gridRef || "", ""],
    [point.span.networkNumber || point.span.primaryNo || "", ""],
    [point.span.circuitName || "", ""]
  ];

  for(const [text, className] of lines){
    if(!text) continue;
    const line = document.createElement("div");
    line.className = `pole-popup-line ${className}`.trim();
    line.textContent = text;
    wrap.appendChild(line);
  }

  const actions = document.createElement("div");
  actions.className = "pole-popup-actions";

  const maps = document.createElement("button");
  maps.type = "button";
  maps.textContent = "Maps";
  maps.addEventListener("click", (event) => {
    event.preventDefault();
    event.stopPropagation();
    window.open(googleMapsUrl(point.lat, point.lon, point.label), "_blank", "noopener");
  });

  const rename = document.createElement("button");
  rename.type = "button";
  rename.textContent = "Rename";
  rename.addEventListener("click", (event) => {
    event.preventDefault();
    event.stopPropagation();
    renameMapPole(point.span.mapPoleId);
  });

  const remove = document.createElement("button");
  remove.type = "button";
  remove.className = "danger";
  remove.textContent = "Remove";
  remove.addEventListener("click", (event) => {
    event.preventDefault();
    event.stopPropagation();
    removeMapPole(point.span.mapPoleId);
  });

  actions.append(maps, rename, remove);
  wrap.appendChild(actions);
  return wrap;
}

function renderSurveyLineRuns(points){
  const groups = new Map();

  for(const point of points){
    const key = `${point.network}|${point.prefix || "unknown"}`;
    if(!groups.has(key)) groups.set(key, []);
    groups.get(key).push(point);
  }

  for(const group of groups.values()){
    const numbered = group
      .filter((point) => Number.isFinite(point.number));
    if(shouldUseDistanceNetwork(group, numbered)){
      drawDistanceNetworkLinks(group);
      continue;
    }

    const mainPoles = numbered
      .filter((point) => !point.suffix)
      .sort((a, b) => a.number - b.number);
    const mainByNumber = new Map(mainPoles.map((point) => [point.number, point]));

    for(let i = 0; i < mainPoles.length - 1; i++){
      const a = mainPoles[i];
      const b = mainPoles[i + 1];
      const distanceM = haversineKm(a.lat, a.lon, b.lat, b.lon) * 1000;
      const hasMissingPole = Number.isFinite(a.number) && Number.isFinite(b.number) && Math.abs(b.number - a.number) > 1;
      drawSurveyAutoNetworkLine(a, b, hasMissingPole || distanceM > 250);
    }

    const spurGroups = new Map();
    for(const point of numbered.filter((item) => item.suffix)){
      if(!spurGroups.has(point.number)) spurGroups.set(point.number, []);
      spurGroups.get(point.number).push(point);
    }

    for(const [number, spurs] of spurGroups.entries()){
      const orderedSpurs = spurs.sort((a, b) => suffixSortValue(a.suffix) - suffixSortValue(b.suffix));
      const base = mainByNumber.get(number);
      if(base && orderedSpurs[0]){
        drawSurveyAutoNetworkLine(base, orderedSpurs[0], false);
      }

      for(let i = 0; i < orderedSpurs.length - 1; i++){
        const a = orderedSpurs[i];
        const b = orderedSpurs[i + 1];
        const hasMissingSuffix = suffixSortValue(b.suffix) - suffixSortValue(a.suffix) > 1;
        drawSurveyAutoNetworkLine(a, b, hasMissingSuffix);
      }
    }
  }

  renderPrefixBranchJoins(groups);
}

function renderPrefixBranchJoins(groups){
  for(const group of groups.values()){
    const childStart = firstMainPoleInGroup(group);
    if(!childStart?.prefix || childStart.prefix === "UNKNOWN") continue;

    const parentPrefix = childStart.prefix.slice(0, -1);
    if(parentPrefix.length < 4) continue;

    const parentGroup = groups.get(`${childStart.network}|${parentPrefix}`);
    if(!parentGroup) continue;

    const parent = nearestMainPole(childStart, parentGroup);
    if(!parent) continue;

    const distanceM = haversineKm(childStart.lat, childStart.lon, parent.lat, parent.lon) * 1000;
    if(distanceM > 350) continue;

    drawSurveyAutoNetworkLine(parent, childStart, distanceM > 250);
  }
}

function firstMainPoleInGroup(group){
  return group
    .filter((point) => Number.isFinite(point.number) && !point.suffix)
    .sort((a, b) => a.number - b.number)[0] || null;
}

function nearestMainPole(target, group){
  let best = null;
  for(const point of group){
    if(!Number.isFinite(point.number) || point.suffix) continue;
    const distanceM = haversineKm(target.lat, target.lon, point.lat, point.lon) * 1000;
    if(!best || distanceM < best.distanceM){
      best = { point, distanceM };
    }
  }
  return best?.point || null;
}

function shouldUseDistanceNetwork(group, numbered){
  if(group.length < 2) return false;
  const alphaCount = numbered.filter((point) => point.prefix && point.prefix !== "UNKNOWN").length;
  return alphaCount < 2;
}

function drawDistanceNetworkLinks(points){
  const candidates = points
    .filter((point) => Number.isFinite(point.lat) && Number.isFinite(point.lon));
  if(candidates.length < 2) return;

  const connected = new Set([candidates[0].span.mapPoleId]);
  const remaining = new Set(candidates.slice(1).map((point) => point.span.mapPoleId));
  const byId = new Map(candidates.map((point) => [point.span.mapPoleId, point]));

  while(remaining.size){
    let best = null;
    for(const fromId of connected){
      const from = byId.get(fromId);
      for(const toId of remaining){
        const to = byId.get(toId);
        const distanceM = haversineKm(from.lat, from.lon, to.lat, to.lon) * 1000;
        if(!best || distanceM < best.distanceM){
          best = { from, to, distanceM };
        }
      }
    }

    if(!best) break;
    drawSurveyAutoNetworkLine(best.from, best.to, best.distanceM > 180);
    connected.add(best.to.span.mapPoleId);
    remaining.delete(best.to.span.mapPoleId);
  }
}

function suffixSortValue(suffix){
  const text = String(suffix || "").toUpperCase();
  let value = 0;
  for(const char of text){
    const code = char.charCodeAt(0);
    if(code < 65 || code > 90) continue;
    value = value * 26 + (code - 64);
  }
  return value;
}

function drawSurveyAutoNetworkLine(a, b, isGap=false){
  const autoLinkId = mapLinkKey(a.span.mapPoleId, b.span.mapPoleId);
  if(blockedAutoMapLinks.includes(autoLinkId)) return;
  drawSurveyNetworkLine([[a.lat, a.lon], [b.lat, b.lon]], isGap, null, autoLinkId, lineColorForPoints(a, b));
}

function renderManualMapLinks(){
  if(!surveyLineLayer || !manualMapLinks.length) return;
  const pointsById = new Map(surveyPolePoints.map((point) => [point.span.mapPoleId, point]));
  const before = manualMapLinks.length;
  manualMapLinks = manualMapLinks.filter((link) => pointsById.has(link.a) && pointsById.has(link.b));
  if(manualMapLinks.length !== before) persistManualMapLinks();

  for(const link of manualMapLinks){
    const a = pointsById.get(link.a);
    const b = pointsById.get(link.b);
    drawSurveyNetworkLine([[a.lat, a.lon], [b.lat, b.lon]], false, link.id, null, lineColorForPoints(a, b));
  }
}

function drawSurveyNetworkLine(latlngs, isGap=false, manualLinkId=null, autoLinkId=null, lineColor="#2648d8"){
  surveyLineShapes.push({
    latlngs:latlngs.map((point) => L.latLng(point[0], point[1])),
    isGap,
    manualLinkId,
    autoLinkId,
    lineColor
  });
}

function lineColorForPoints(...points){
  const hasHv = points.some((point) => normaliseSearchText(point?.span?.voltage || "").startsWith("hv"));
  return hasHv ? "#d33a2c" : "#2648d8";
}

function installSurveyLineCanvas(mapEl){

}

function resizeSurveyLineCanvas(){
  if(!surveyLineCanvas || !surveyMap) return;
  const size = surveyMap.getSize();
  const ratio = window.devicePixelRatio || 1;
  const width = Math.max(1, Math.round(size.x * ratio));
  const height = Math.max(1, Math.round(size.y * ratio));
  surveyLineCanvas.style.width = `${size.x}px`;
  surveyLineCanvas.style.height = `${size.y}px`;
  if(surveyLineCanvas.width !== width || surveyLineCanvas.height !== height || surveyLineCanvasSize.ratio !== ratio){
    surveyLineCanvas.width = width;
    surveyLineCanvas.height = height;
    surveyLineCanvasSize = { width, height, ratio };
  }
  if(surveyLineCanvasCtx){
    surveyLineCanvasCtx.setTransform(ratio, 0, 0, ratio, 0, 0);
  }
}

function clearSurveyLineCanvas(){
  if(!surveyLineCanvasCtx || !surveyLineCanvas || !surveyMap) return;
  const size = surveyMap.getSize();
  surveyLineCanvasCtx.clearRect(0, 0, size.x, size.y);
}

function surveyNetworkStyleForZoom(){
  const zoom = surveyMap?.getZoom?.() || 13;
  if(zoom < 13.5){
    return { lineWeight:1.55, lineOpacity:0.88, poleRadius:1.9, poleOpacity:0.78, dashGap:"4 9", showGapLines:false };
  }
  if(zoom < 15){
    return { lineWeight:1.85, lineOpacity:0.9, poleRadius:2.25, poleOpacity:0.84, dashGap:"4 10", showGapLines:false };
  }
  if(zoom < 16.5){
    return { lineWeight:2.05, lineOpacity:0.9, poleRadius:2.8, poleOpacity:0.88, dashGap:"4 11", showGapLines:true };
  }
  if(zoom < 18){
    return { lineWeight:2.55, lineOpacity:0.94, poleRadius:3.55, poleOpacity:0.93, dashGap:"4 12", showGapLines:true };
  }
  return { lineWeight:3.15, lineOpacity:0.98, poleRadius:4.55, poleOpacity:0.96, dashGap:"4 13", showGapLines:true };
}

function drawSurveyLineCanvas(){
  if(!surveyMap || !surveyLineLayer) return;
  surveyLineLayer.clearLayers();
  resizeSurveyLineCanvas();
  clearSurveyLineCanvas();

  const visual = surveyNetworkStyleForZoom();
  const renderer = surveyNetworkRenderer || undefined;
  for(const line of surveyLineShapes){
    if(!line.latlngs || line.latlngs.length < 2) continue;
    if(line.isGap && !visual.showGapLines) continue;
    L.polyline(line.latlngs, {
      color:line.lineColor || "#2648d8",
      weight:visual.lineWeight,
      opacity:visual.lineOpacity,
      lineCap:"round",
      lineJoin:"round",
      dashArray:line.isGap ? visual.dashGap : null,
      smoothFactor:1.2,
      renderer,
      interactive:false
    }).addTo(surveyLineLayer);
  }

  const bounds = surveyMap.getBounds().pad(0.18);
  for(const point of surveyPolePoints){
    if(!bounds.contains([point.lat, point.lon])) continue;
    L.circleMarker([point.lat, point.lon], {
      radius:visual.poleRadius,
      stroke:false,
      fill:true,
      fillColor:lineColorForPoints(point),
      fillOpacity:visual.poleOpacity,
      renderer,
      interactive:false
    }).addTo(surveyLineLayer);
  }
}

function drawSurveyDrawingCanvas(){
  if(!surveyDrawingCanvasCtx || !surveyMap) return;
  clearSurveyDrawingCanvas();
  if(getComputedStyle(surveyDrawingCanvas).display === "none") return;
  resizeSurveyDrawingCanvas();
  if(!mapDrawingStack.length) return;

  const ctx = surveyDrawingCanvasCtx;
  ctx.save();
  ctx.lineCap = "round";
  ctx.lineJoin = "round";

  for(const item of mapDrawingStack){
    if(!item?.group || !item.shape) continue;
    const selected = item === selectedDrawing;
    const stroke = selected ? "#d99a18" : "#5fbd65";
    const fill = selected ? "rgba(217,154,24,.08)" : "rgba(95,189,101,.01)";
    const width = selected ? 6 : 5;

    if(item.type === "circle" && item.shape.getLatLng && item.shape.getRadius){
      const center = surveyMap.latLngToContainerPoint(item.shape.getLatLng());
      const edge = surveyMap.latLngToContainerPoint(offsetLatLngEast(item.shape.getLatLng(), item.shape.getRadius()));
      const radiusPx = item.radiusUnits === "px" ? item.shape.getRadius() : Math.max(1, center.distanceTo(edge));
      ctx.beginPath();
      ctx.arc(center.x, center.y, radiusPx, 0, Math.PI * 2);
      ctx.fillStyle = fill;
      ctx.strokeStyle = stroke;
      ctx.lineWidth = width;
      ctx.fill();
      ctx.stroke();
    }else if(item.shape.getLatLngs){
      const points = getPolygonCorners(item).map((latlng) => surveyMap.latLngToContainerPoint(latlng));
      if(points.length < 2) continue;
      ctx.beginPath();
      ctx.moveTo(points[0].x, points[0].y);
      for(const point of points.slice(1)){
        ctx.lineTo(point.x, point.y);
      }
      ctx.closePath();
      ctx.fillStyle = fill;
      ctx.strokeStyle = stroke;
      ctx.lineWidth = width;
      ctx.fill();
      ctx.stroke();
    }
  }

  ctx.restore();
}

function handleCanvasLineClick(containerPoint){
  if(!["unlink","delete"].includes(mapTool) || !surveyLineShapes.length) return false;
  const point = { x:containerPoint.x, y:containerPoint.y };
  for(let i = surveyLineShapes.length - 1; i >= 0; i--){
    const line = surveyLineShapes[i];
    const points = line.latlngs.map((latlng) => surveyMap.latLngToContainerPoint(latlng));
    if(points.length < 2) continue;
    for(let p = 0; p < points.length - 1; p++){
      if(pointToSegmentDistance(point, points[p], points[p + 1]) <= 14){
        if(line.manualLinkId){
          removeManualMapLink(line.manualLinkId);
          return true;
        }
        if(line.autoLinkId && mapTool === "unlink"){
          blockAutoMapLink(line.autoLinkId);
          return true;
        }
      }
    }
  }
  return false;
}

function pointToSegmentDistance(point, a, b){
  const dx = b.x - a.x;
  const dy = b.y - a.y;
  if(dx === 0 && dy === 0) return Math.hypot(point.x - a.x, point.y - a.y);
  const t = Math.max(0, Math.min(1, ((point.x - a.x) * dx + (point.y - a.y) * dy) / (dx * dx + dy * dy)));
  const x = a.x + t * dx;
  const y = a.y + t * dy;
  return Math.hypot(point.x - x, point.y - y);
}

function persistSpanData(){
  try{
    localStorage.setItem("treeSurveySpanData", JSON.stringify(window.SPAN_DATA || []));
  }catch{
    setSurveyMapStatus("Pole moved, but this browser could not save it locally.");
  }
}

function poleDisplayName(span){
  return String(span.toPole || span.span || span.externalReference || "Pole").trim();
}

function parsePoleLabel(label){
  const match = String(label || "").trim().match(/^([A-Za-z]+)\s*0*(\d+)([A-Za-z]*)/);
  return {
    prefix:match ? match[1].toUpperCase() : "UNKNOWN",
    number:match ? Number(match[2]) : NaN,
    suffix:match ? match[3].toUpperCase() : ""
  };
}

function addMapPole(latlng){
  const suggestion = suggestMissingPole(latlng);
  requestAddedPoleName(latlng, suggestion);
}

function createMapPoleFromChoice(latlng, suggestion, naming){
  const label = naming.label;

  const template = naming.template?.span || suggestion?.template?.span || {};
  const gridRef = latLonToOSGrid(latlng.lat, latlng.lng);
  const span = {
    ...template,
    mapPoleId:createId("pole"),
    span:label,
    toPole:label,
    externalReference:label,
    gridRef,
    latitude:latlng.lat,
    longitude:latlng.lng,
    coordinateSource:"manual-map",
    manuallyAdded:true
  };

  window.SPAN_DATA.push(span);
  applyAddedPoleGapLinks(span, naming.gap || suggestion);
  persistSpanData();
  renderSurveyMap(false);
  setMapTool("pan");
  setSurveyMapStatus(`${label} added. Drag it to fine tune, or tap the pole popup to rename.`);
}

function applyAddedPoleGapLinks(span, gap){
  if(!span?.mapPoleId || !gap?.a?.span?.mapPoleId || !gap?.b?.span?.mapPoleId) return;
  const oldAutoKey = mapLinkKey(gap.a.span.mapPoleId, gap.b.span.mapPoleId);
  if(!blockedAutoMapLinks.includes(oldAutoKey)) blockedAutoMapLinks.push(oldAutoKey);
  persistBlockedAutoMapLinks();
  addManualMapLink(gap.a.span.mapPoleId, span.mapPoleId);
  addManualMapLink(span.mapPoleId, gap.b.span.mapPoleId);
}

function addManualMapLink(a, b){
  if(!a || !b || a === b) return;
  const key = mapLinkKey(a, b);
  const exists = manualMapLinks.some((link) => mapLinkKey(link.a, link.b) === key);
  if(exists) return;
  manualMapLinks.push({ id:createId("link"), a, b });
  persistManualMapLinks();
}

function addPoleAtMapCenter(){
  if(!surveyMap) return;
  if(!mapLocked){
    setSurveyMapStatus("Lock the map first, then add a pole.");
    return;
  }
  addMapPole(surveyMap.getCenter());
}

function nextManualPoleName(){
  const count = (window.SPAN_DATA || []).filter((span) => span.manuallyAdded).length + 1;
  return `NEW POLE ${count}`;
}

function requestAddedPoleName(latlng, gapSuggestion=null){
  const gap = nearestNumberGapForPoint(latlng) || gapSuggestion;
  const choices = poleGapNamingChoices(gap);

  if(!choices.length){
    setSurveyMapStatus("Tap near a dotted missing-pole line to add a pole there.");
    return;
  }

  requestChoiceValue({
    title:"Add missing pole",
    message:"Choose the pole name that fits this gap.",
    choices:choices.map((choice) => ({
      label:choice.label,
      detail:choice.detail,
      value:choice
    })),
    onCancel:() => setSurveyMapStatus("Pole not added."),
    onChoose:(choice) => createMapPoleFromChoice(latlng, gapSuggestion, choice)
  });
  setSurveyMapStatus("Choose the missing pole name.");
}

function poleGapNamingChoices(gap){
  if(!gap?.a || !gap?.b) return [];
  const a = gap.a.number <= gap.b.number ? gap.a : gap.b;
  const b = gap.a.number <= gap.b.number ? gap.b : gap.a;
  const prefix = (a.prefix && a.prefix !== "UNKNOWN" ? a.prefix : b.prefix && b.prefix !== "UNKNOWN" ? b.prefix : "POLE").toUpperCase();
  const suffix = a.suffix || b.suffix || "";
  const afterBefore = a.number + 1;
  const beforeAfter = b.number - 1;
  const template = gap.template || a;

  const choices = [
    {
      label:`${prefix}${afterBefore}${suffix}`,
      detail:`one after ${a.label}`,
      template,
      gap
    },
    {
      label:`${prefix}${beforeAfter}${suffix}`,
      detail:`one before ${b.label}`,
      template,
      gap
    }
  ];
  return choices;
}

function nearestNumberGapForPoint(latlng){
  if(!surveyMap || !surveyPolePoints.length) return null;
  const tapPoint = surveyMap.latLngToContainerPoint(latlng);
  let best = null;

  for(const run of groupedSurveyPoleRuns()){
    for(let i = 0; i < run.length - 1; i++){
      const gap = Math.abs(run[i + 1].number - run[i].number);
      if(gap <= 1) continue;
      const a = surveyMap.latLngToContainerPoint([run[i].lat, run[i].lon]);
      const b = surveyMap.latLngToContainerPoint([run[i + 1].lat, run[i + 1].lon]);
      const distance = pointToSegmentDistance(tapPoint, a, b);
      if(!best || distance < best.distance){
        best = { a:run[i], b:run[i + 1], distance, template:run[i] };
      }
    }
  }

  return best && best.distance <= 120 ? best : null;
}

function suggestMissingPole(latlng){
  if(!surveyMap || !surveyPolePoints.length) return null;
  const tapPoint = surveyMap.latLngToContainerPoint(latlng);
  let best = null;

  for(const run of groupedSurveyPoleRuns()){
    for(let i = 0; i < run.length - 1; i++){
      const a = run[i];
      const b = run[i + 1];
      if(!Number.isFinite(a.number) || !Number.isFinite(b.number)) continue;
      const gap = b.number - a.number;
      if(Math.abs(gap) <= 1) continue;

      const aPoint = surveyMap.latLngToContainerPoint([a.lat, a.lon]);
      const bPoint = surveyMap.latLngToContainerPoint([b.lat, b.lon]);
      const distance = pointToSegmentDistance(tapPoint, aPoint, bPoint);
      if(best && distance >= best.distance) continue;

      const missingNumber = a.number + Math.sign(gap);
      best = {
        distance,
        label:`${a.prefix}${missingNumber}${a.suffix || ""}`,
        template:a,
        a,
        b
      };
    }
  }

  return best && best.distance <= 90 ? best : null;
}

function groupedSurveyPoleRuns(){
  const groups = new Map();
  for(const point of surveyPolePoints){
    const key = `${point.network}|${point.prefix || "unknown"}`;
    if(!groups.has(key)) groups.set(key, []);
    groups.get(key).push(point);
  }
  return [...groups.values()].map((group) => group
    .filter((point) => Number.isFinite(point.number))
    .sort((a, b) => a.number - b.number || String(a.suffix).localeCompare(String(b.suffix))));
}

function renameMapPole(mapPoleId){
  const span = (window.SPAN_DATA || []).find((item) => item.mapPoleId === mapPoleId);
  if(!span) return;
  const current = poleDisplayName(span);
  requestTextValue({
    title:"Rename pole",
    label:"Pole name",
    value:current,
    transform:(text) => text.toUpperCase(),
    onSave:(next) => {
      if(!next || next === current) return;
      span.span = next;
      span.toPole = next;
      span.externalReference = next;
      persistSpanData();
      renderSurveyMap(false);
      setSurveyMapStatus(`${next} renamed.`);
    }
  });
}

function removeMapPole(mapPoleId){
  const spans = Array.isArray(window.SPAN_DATA) ? window.SPAN_DATA : [];
  const index = spans.findIndex((item) => item.mapPoleId === mapPoleId);
  if(index < 0) return;

  const name = poleDisplayName(spans[index]);
  const ok = window.confirm(`Remove ${name} from this device's map data?`);
  if(!ok) return;

  spans.splice(index, 1);
  if(forcedMapPoleId === mapPoleId) forcedMapPoleId = null;
  manualMapLinks = manualMapLinks.filter((link) => link.a !== mapPoleId && link.b !== mapPoleId);
  blockedAutoMapLinks = blockedAutoMapLinks.filter((key) => !String(key).split("|").includes(mapPoleId));
  persistManualMapLinks();
  persistBlockedAutoMapLinks();
  persistSpanData();
  renderSurveyMap(false);
  setMapTool("pan", true);
  setSurveyMapStatus(`${name} removed.`);
}

function handleManualPoleLink(point){
  const poleId = point.span.mapPoleId;
  if(!pendingLinkPoleId){
    pendingLinkPoleId = poleId;
    setSurveyMapStatus(`Link started at ${point.label}. Tap the next pole.`);
    return;
  }

  if(pendingLinkPoleId === poleId){
    pendingLinkPoleId = null;
    setMapTool("pan", true);
    setSurveyMapStatus("Link cancelled.");
    return;
  }

  const existing = manualMapLinks.some((link) =>
    (link.a === pendingLinkPoleId && link.b === poleId) ||
    (link.a === poleId && link.b === pendingLinkPoleId)
  );

  if(existing){
    pendingLinkPoleId = null;
    setMapTool("pan", true);
    setSurveyMapStatus("Those poles are already linked.");
    return;
  }

  manualMapLinks.push({
    id:createId("link"),
    a:pendingLinkPoleId,
    b:poleId
  });
  pendingLinkPoleId = null;
  persistManualMapLinks();
  redrawSurveyLinesOnly();
  setMapTool("pan", true);
  setSurveyMapStatus("Poles linked.");
}

function handleManualPoleUnlink(point){
  const poleId = point.span.mapPoleId;
  if(!pendingLinkPoleId){
    pendingLinkPoleId = poleId;
    setSurveyMapStatus(`Unlink started at ${point.label}. Tap the connected pole.`);
    return;
  }

  if(pendingLinkPoleId === poleId){
    pendingLinkPoleId = null;
    setMapTool("pan", true);
    setSurveyMapStatus("Unlink cancelled.");
    return;
  }

  const linkKey = mapLinkKey(pendingLinkPoleId, poleId);
  const manualBefore = manualMapLinks.length;
  manualMapLinks = manualMapLinks.filter((link) => mapLinkKey(link.a, link.b) !== linkKey);

  if(manualMapLinks.length !== manualBefore){
    persistManualMapLinks();
    pendingLinkPoleId = null;
    redrawSurveyLinesOnly();
    setMapTool("pan", true);
    setSurveyMapStatus("Manual pole link removed.");
    return;
  }

  if(!blockedAutoMapLinks.includes(linkKey)){
    blockedAutoMapLinks.push(linkKey);
    persistBlockedAutoMapLinks();
    pendingLinkPoleId = null;
    redrawSurveyLinesOnly();
    setMapTool("pan", true);
    setSurveyMapStatus("Automatic pole link hidden.");
    return;
  }

  pendingLinkPoleId = null;
  setMapTool("pan", true);
  setSurveyMapStatus("Those poles were already unlinked.");
}

function removeManualMapLink(linkId){
  const before = manualMapLinks.length;
  manualMapLinks = manualMapLinks.filter((link) => link.id !== linkId);
