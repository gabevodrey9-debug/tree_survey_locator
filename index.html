<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tree Survey Locator</title>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--forest:#0f2318;--leaf:#3d7a4f;--amber:#d4910a;--cream:#f0ebe0;--muted:#9bb7a5;--line:rgba(255,255,255,.13);--red:#c84b3a}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at top left,rgba(61,122,79,.35),transparent 35rem),var(--forest);color:var(--cream);font-family:Spectral,serif}
header{padding:18px 20px;border-bottom:1px solid var(--line)}
h1,h2,h3,p{margin:0}
header h3{font-size:20px}
main{width:min(100%,680px);margin:auto;padding:24px 18px 36px;text-align:center}
.locator{padding:28px 0 18px}
#locateBtn{width:132px;height:132px;border-radius:50%;border:2px solid var(--amber);background:var(--leaf);color:var(--cream);font-size:40px;cursor:pointer;box-shadow:0 18px 48px rgba(0,0,0,.28)}
#locateBtn:active{transform:scale(.97)}
#locateBtn:disabled{cursor:wait;opacity:.82}
.locate-label{margin-top:12px;font-family:"JetBrains Mono",monospace;font-size:12px;letter-spacing:2px;color:var(--amber);text-transform:uppercase}
.settings{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end;margin:0 auto 18px;text-align:left}
.settings label{display:block;margin-bottom:6px;color:var(--muted);font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:1px;text-transform:uppercase}
.settings input{width:100%;min-height:42px;border:1px solid var(--line);border-radius:8px;background:rgba(255,255,255,.06);color:var(--cream);font:14px "JetBrains Mono",monospace;padding:9px 11px}
.btn{min-height:42px;padding:9px 13px;border:1px solid var(--line);border-radius:8px;background:rgba(255,255,255,.06);color:var(--cream);cursor:pointer;font-weight:700}
#keyStatus{grid-column:1/-1;min-height:20px;color:var(--muted);font-size:14px}
.results{display:grid;gap:12px;margin-top:18px}
.card{padding:15px;border:1px solid var(--line);border-radius:8px;background:rgba(255,255,255,.045);text-align:left}
.card h2{margin-bottom:5px;color:var(--amber);font:700 12px "JetBrains Mono",monospace;letter-spacing:1px;text-transform:uppercase}
.value{overflow-wrap:anywhere;font-size:18px;line-height:1.35}
.mono{font-family:"JetBrains Mono",monospace;font-size:15px}
.small{margin-top:5px;color:var(--muted);font-size:14px}
.error{border-color:rgba(200,75,58,.65);color:#ffd9d4}
@media(max-width:520px){.settings{grid-template-columns:1fr}.btn{width:100%}}
</style>
</head>
<body>
<header><h3>Tree Survey Locator</h3></header>

<main>
  <section class="locator">
    <button id="locateBtn" type="button" onclick="locate()" aria-label="Find my location">LOC</button>
    <div class="locate-label" id="label">Tap to locate</div>
  </section>

  <section class="settings">
    <div>
      <label for="w3wKey">what3words API key</label>
      <input id="w3wKey" type="password" autocomplete="off" placeholder="Paste key for ///words">
    </div>
    <button class="btn" type="button" onclick="saveW3WKey()">Save</button>
    <div id="keyStatus"></div>
  </section>

  <div class="results" id="out" aria-live="polite"></div>
</main>

<script>
const w3wInput=document.getElementById("w3wKey");
const savedW3WKey=localStorage.getItem("w3w_key")||"";
if(savedW3WKey){
  w3wInput.value=savedW3WKey;
  document.getElementById("keyStatus").textContent="what3words key saved on this device.";
}

function saveW3WKey(){
  const key=w3wInput.value.trim();
  const status=document.getElementById("keyStatus");
  if(!key){
    localStorage.removeItem("w3w_key");
    status.textContent="what3words key removed.";
    return;
  }
  localStorage.setItem("w3w_key",key);
  status.textContent="what3words key saved on this device.";
}

function latLonToOSGrid(lat,lon){
  const deg=Math.PI/180;
  const a=6377563.396,b=6356256.909,f0=.9996012717,lat0=49*deg,lon0=-2*deg,n0=-100000,e0=400000;
  const e2=1-(b*b)/(a*a),n=(a-b)/(a+b);
  const wgs84={a:6378137,b:6356752.3141};
  const phi=lat*deg,lambda=lon*deg,sinPhi=Math.sin(phi),cosPhi=Math.cos(phi);
  const e2w=1-(wgs84.b*wgs84.b)/(wgs84.a*wgs84.a);
  const nu=wgs84.a/Math.sqrt(1-e2w*sinPhi*sinPhi);
  const x1=nu*cosPhi*Math.cos(lambda),y1=nu*cosPhi*Math.sin(lambda),z1=(1-e2w)*nu*sinPhi;
  const tx=-446.448,ty=125.157,tz=-542.06,s=20.4894e-6;
  const rx=(-.1502/3600)*deg,ry=(-.2470/3600)*deg,rz=(-.8421/3600)*deg;
  const x2=tx+(1+s)*x1-rz*y1+ry*z1;
  const y2=ty+rz*x1+(1+s)*y1-rx*z1;
  const z2=tz-ry*x1+rx*y1+(1+s)*z1;
  const p=Math.sqrt(x2*x2+y2*y2);
  let phi2=Math.atan2(z2,p*(1-e2)),prev;
  do{
    prev=phi2;
    const nu2=a/Math.sqrt(1-e2*Math.sin(phi2)*Math.sin(phi2));
    phi2=Math.atan2(z2+e2*nu2*Math.sin(phi2),p);
  }while(Math.abs(phi2-prev)>1e-10);

  const lambda2=Math.atan2(y2,x2),sinPhi2=Math.sin(phi2),cosPhi2=Math.cos(phi2),tanPhi2=Math.tan(phi2);
  const nu2=a*f0/Math.sqrt(1-e2*sinPhi2*sinPhi2);
  const rho=a*f0*(1-e2)/Math.pow(1-e2*sinPhi2*sinPhi2,1.5);
  const eta2=nu2/rho-1;
  const ma=(1+n+5*n*n/4+5*n*n*n/4)*(phi2-lat0);
  const mb=(3*n+3*n*n+21*n*n*n/8)*Math.sin(phi2-lat0)*Math.cos(phi2+lat0);
  const mc=(15*n*n/8+15*n*n*n/8)*Math.sin(2*(phi2-lat0))*Math.cos(2*(phi2+lat0));
  const md=35*n*n*n/24*Math.sin(3*(phi2-lat0))*Math.cos(3*(phi2+lat0));
  const m=b*f0*(ma-mb+mc-md),dLon=lambda2-lon0;
  const northing=m+n0+(nu2/2*sinPhi2*cosPhi2)*dLon**2+(nu2/24*sinPhi2*cosPhi2**3*(5-tanPhi2**2+9*eta2))*dLon**4;
  const easting=e0+nu2*cosPhi2*dLon+(nu2/6*cosPhi2**3*(nu2/rho-tanPhi2**2))*dLon**3;
  return formatGridRef(easting,northing);
}

function formatGridRef(easting,northing){
  if(!Number.isFinite(easting)||!Number.isFinite(northing))return"Unavailable";
  const e100k=Math.floor(easting/100000),n100k=Math.floor(northing/100000);
  if(e100k<0||e100k>6||n100k<0||n100k>12)return"Outside OS Grid";
  let l1=(19-n100k)-(19-n100k)%5+Math.floor((e100k+10)/5);
  let l2=(19-n100k)*5%25+e100k%5;
  if(l1>7)l1++;
  if(l2>7)l2++;
  const letters=String.fromCharCode(l1+65)+String.fromCharCode(l2+65);
  const e=Math.floor((easting%100000)/100).toString().padStart(3,"0");
  const n=Math.floor((northing%100000)/100).toString().padStart(3,"0");
  return `${letters} ${e} ${n}`;
}

function haversineKm(lat1,lon1,lat2,lon2){
  const r=6371,dLat=(lat2-lat1)*Math.PI/180,dLon=(lon2-lon1)*Math.PI/180;
  const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return 2*r*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

async function getW3W(lat,lon){
  const key=localStorage.getItem("w3w_key");
  if(!key)return{words:"No key saved",note:"Paste your what3words API key above and press Save."};
  try{
    const url=`https://api.what3words.com/v3/convert-to-3wa?coordinates=${lat},${lon}&key=${encodeURIComponent(key)}`;
    const r=await fetch(url),d=await r.json();
    if(!r.ok||!d.words)return{words:"Unavailable",note:d.error?.message||"what3words did not return a result."};
    return{words:`///${d.words}`,note:""};
  }catch{
    return{words:"Unavailable",note:"Could not contact what3words."};
  }
}

async function getAE(lat,lon){
  const radiuses=[25000,50000,100000];
  for(const radius of radiuses){
    const query=`
      [out:json][timeout:25];
      (
        nwr["emergency"="emergency_ward"](around:${radius},${lat},${lon});
        nwr["healthcare:speciality"~"(^|;)emergency(;|$)"](around:${radius},${lat},${lon});
        nwr["amenity"="hospital"]["emergency"="yes"](around:${radius},${lat},${lon});
        nwr["amenity"="hospital"]["name"~"A&E|Accident|Emergency",i](around:${radius},${lat},${lon});
      );
      out center tags;
    `;
    try{
      const r=await fetch("https://overpass-api.de/api/interpreter?data="+encodeURIComponent(query));
      const d=await r.json();
      const places=(d.elements||[]).map(el=>normaliseAE(el,lat,lon)).filter(Boolean).sort((a,b)=>a.distanceKm-b.distanceKm);
      if(places.length)return places[0];
    }catch{}
  }
  return null;
}

function normaliseAE(el,lat,lon){
  const placeLat=el.lat||el.center?.lat,placeLon=el.lon||el.center?.lon;
  if(!placeLat||!placeLon||!el.tags)return null;
  const tags=el.tags;
  const addressParts=[tags["addr:housename"],tags["addr:housenumber"],tags["addr:street"],tags["addr:city"],tags["addr:postcode"]].filter(Boolean);
  return{
    name:tags.name||tags.operator||"Unnamed A&E",
    address:addressParts.length?addressParts.join(", "):"Address not listed",
    phone:tags.phone||tags["contact:phone"]||"Phone not listed",
    distanceKm:haversineKm(lat,lon,placeLat,placeLon)
  };
}

function escapeHtml(value){
  return String(value).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
}

function renderCard(title,value,detail="",className=""){
  return `<div class="card ${className}"><h2>${escapeHtml(title)}</h2><div class="value">${escapeHtml(value)}</div>${detail?`<div class="small">${escapeHtml(detail)}</div>`:""}</div>`;
}

async function locate(){
  const btn=document.getElementById("locateBtn"),out=document.getElementById("out"),label=document.getElementById("label");
  if(!navigator.geolocation){
    out.innerHTML=renderCard("Error","Location is not supported by this browser.","","error");
    return;
  }
  btn.textContent="...";
  btn.disabled=true;
  label.textContent="Locating...";
  out.innerHTML="";

  navigator.geolocation.getCurrentPosition(async pos=>{
    const lat=pos.coords.latitude,lon=pos.coords.longitude,accuracy=Math.round(pos.coords.accuracy);
    label.textContent="Building report...";
    const grid=latLonToOSGrid(lat,lon);
    const [w3w,ae]=await Promise.all([getW3W(lat,lon),getAE(lat,lon)]);
    out.innerHTML=[
      renderCard("Coordinates",`${lat.toFixed(5)}, ${lon.toFixed(5)}`,`Accuracy about ${accuracy} m`,"mono"),
      renderCard("Six digit grid reference",grid,"","mono"),
      renderCard("what3words",w3w.words,w3w.note,"mono"),
      ae?renderCard("Nearest A&E",ae.name,`${ae.address} | ${ae.phone} | ${ae.distanceKm.toFixed(1)} km away`):renderCard("Nearest A&E","No A&E found","No matching emergency department was found in the public map data.","error")
    ].join("");
    btn.textContent="LOC";
    btn.disabled=false;
    label.textContent="Tap to locate";
  },err=>{
    out.innerHTML=renderCard("Error",err.message,"Location permission may need to be allowed for this site.","error");
    btn.textContent="LOC";
    btn.disabled=false;
    label.textContent="Tap to locate";
  },{enableHighAccuracy:true,timeout:15000,maximumAge:0});
}
</script>
</body>
</html>
