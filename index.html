<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tree Survey Locator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
  --forest:#123326;
  --panel:#ffffff;
  --panel-soft:#f7faf7;
  --leaf:#18764a;
  --leaf-dark:#0f5637;
  --amber:#d89a1c;
  --cream:#f8faf7;
  --ink:#15221b;
  --muted:#65746b;
  --line:rgba(21,34,27,.13);
  --danger:#c64e40;
  --shadow:0 16px 42px rgba(20,43,31,.13);
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(circle at top left, rgba(24,118,74,.13), transparent 34rem),
    linear-gradient(180deg,#f3f7f3 0%,#e8f0ea 100%);
  color:var(--ink);
  font-family:Inter,Arial,sans-serif;
}
header{
  padding:18px 16px 18px 108px;
  border-bottom:1px solid rgba(255,255,255,.12);
  background:linear-gradient(135deg,#123326,#0e261d);
  color:var(--cream);
  box-shadow:0 10px 28px rgba(11,31,22,.16);
}
body.map-mode{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  overflow:hidden;
}
body.map-mode header{
  display:none;
}
body.map-mode main{
  position:fixed;
  inset:0;
  width:100vw;
  height:100dvh;
  margin:0;
  padding:0;
  display:block;
  max-width:none;
}
h1,h2,p{margin:0}
h1{
  font-size:22px;
  letter-spacing:-.01em;
}
header p{
  margin-top:4px;
  color:rgba(248,250,247,.72);
  font-size:13px;
  font-weight:600;
}
main{
  width:min(100%,980px);
  margin:auto;
  padding:18px 14px 34px;
}
.view-switch-fab{
  position:fixed;
  top:10px;
  left:10px;
  z-index:920;
  min-height:38px;
  min-width:78px;
  border:1px solid rgba(24,118,74,.34);
  border-radius:999px;
  background:var(--leaf);
  color:#fff;
  font:800 13px Inter,Arial,sans-serif;
  box-shadow:0 8px 24px rgba(20,43,31,.18);
  cursor:pointer;
}
body.map-mode .view-switch-fab{
  top:10px;
  left:10px;
}
.tabs{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:8px;
  margin-bottom:14px;
}
.tab-btn{
  min-height:42px;
  border:1px solid var(--line);
  border-radius:8px;
  background:rgba(255,255,255,.72);
  color:var(--ink);
  font:700 14px Inter,Arial,sans-serif;
  cursor:pointer;
  box-shadow:0 4px 12px rgba(20,43,31,.06);
}
.tab-btn.active{
  border-color:rgba(24,118,74,.32);
  background:var(--leaf);
  color:#fff;
}
.view{
  display:block;
}
body.map-mode #mapView{
  position:absolute;
  inset:0;
  min-height:0;
  display:block;
}
body.map-mode #locatorView{
  display:none;
}
body.map-mode .tabs{
  display:none;
}
body.map-mode .map-controls{
  position:absolute;
  z-index:840;
  left:10px;
  right:10px;
  bottom:12px;
  margin:0;
  padding:10px;
  background:rgba(255,255,255,.92);
  box-shadow:var(--shadow);
  backdrop-filter:blur(7px);
}
body.map-mode .map-top-left,
body.map-mode .map-top-right,
body.map-mode .map-search{
  position:absolute;
  z-index:850;
  margin:0;
  padding:8px;
  background:rgba(255,255,255,.92);
  box-shadow:var(--shadow);
  backdrop-filter:blur(7px);
}
body.map-mode .map-top-left{
  top:60px;
  left:10px;
  width:min(210px,45vw);
}
body.map-mode .map-top-right{
  top:10px;
  right:10px;
  width:min(160px,36vw);
}
body.map-mode .map-search{
  top:10px;
  left:50%;
  width:min(420px,48vw);
  transform:translateX(-50%);
}
body.map-mode .map-title{
  display:none;
}
body.screenshot-mode .map-controls,
body.screenshot-mode .map-top-left,
body.screenshot-mode .map-top-right,
body.screenshot-mode .map-search,
body.screenshot-mode .leaflet-control{
  display:none !important;
}
body.map-mode .map-canvas-card{
  position:absolute;
  inset:0;
  min-height:0;
  padding:0;
  border:0;
  border-radius:0;
  overflow:hidden;
}
.hero{
  display:grid;
  gap:14px;
  justify-items:center;
  padding:20px 0 22px;
  text-align:center;
}
#locateBtn{
  width:138px;
  height:138px;
  border-radius:50%;
  border:5px solid rgba(255,255,255,.72);
  background:linear-gradient(145deg,var(--leaf),var(--leaf-dark));
  color:#fff;
  font-size:26px;
  font-weight:700;
  cursor:pointer;
  box-shadow:0 22px 52px rgba(13,70,43,.28);
}
#locateBtn:disabled{opacity:.75;cursor:wait}
#status{
  min-height:24px;
  color:var(--leaf-dark);
  font-family:Inter,Arial,sans-serif;
  font-size:13px;
  font-weight:700;
  letter-spacing:1.6px;
  text-transform:uppercase;
}
.grid{
  display:grid;
  gap:12px;
}
.card{
  border:1px solid var(--line);
  border-radius:8px;
  background:rgba(255,255,255,.86);
  padding:15px;
  box-shadow:0 8px 24px rgba(20,43,31,.08);
}
.card h2{
  margin-bottom:7px;
  color:var(--leaf-dark);
  font-family:Inter,Arial,sans-serif;
  font-size:12px;
  letter-spacing:1.2px;
  text-transform:uppercase;
}
.span-match-card{
  cursor:pointer;
}
.span-match-card:active{
  transform:translateY(1px);
}
.span-match-card:focus-visible{
  outline:3px solid rgba(24,118,74,.35);
  outline-offset:2px;
}
.value{
  font-size:22px;
  line-height:1.28;
  overflow-wrap:anywhere;
  font-weight:750;
  letter-spacing:-.01em;
}
.detail{
  margin-top:6px;
  color:var(--muted);
  font-family:Inter,Arial,sans-serif;
  font-size:14px;
  line-height:1.35;
}
.actions{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:8px;
  margin-top:12px;
}
button.small,a.small{
  min-height:40px;
  border:1px solid var(--line);
  border-radius:8px;
  background:#fff;
  color:var(--ink);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:8px 10px;
  text-decoration:none;
  font:700 14px Inter,Arial,sans-serif;
  cursor:pointer;
  box-shadow:0 3px 10px rgba(20,43,31,.06);
}
input.text-field,textarea.text-field{
  width:100%;
  border:1px solid var(--line);
  border-radius:8px;
  background:#fff;
  color:var(--ink);
  padding:10px;
  font:16px Inter,Arial,sans-serif;
}
input.file-field{
  width:100%;
  color:var(--ink);
  font:14px Inter,Arial,sans-serif;
}
textarea.text-field{
  min-height:118px;
  resize:vertical;
  line-height:1.35;
}
.field-row{
  display:grid;
  gap:8px;
  margin-top:12px;
}
.search-panel{
  margin-bottom:14px;
}
.search-form{
  display:grid;
  grid-template-columns:1fr auto;
  gap:8px;
  align-items:center;
}
.search-form .small{
  min-width:96px;
}
.match-list{
  display:grid;
  gap:10px;
  margin-top:12px;
}
.field-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
}
.map-panel{
  display:grid;
  gap:10px;
  margin-top:12px;
}
#w3wMap{
  width:100%;
  height:300px;
  border:1px solid var(--line);
  border-radius:8px;
  overflow:hidden;
  background:#d8dfcf;
}
#surveyMap{
  width:100%;
  height:min(72vh,680px);
  min-height:430px;
  border:1px solid var(--line);
  border-radius:8px;
  overflow:hidden;
  background:#d8dfcf;
  touch-action:none;
}
body.map-mode #surveyMap{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  min-height:0;
  border:0;
  border-radius:0;
}
.leaflet-container{
  font-family:Inter,Arial,sans-serif;
  touch-action:none;
}
.leaflet-control,
.leaflet-control *{
  touch-action:manipulation;
}
.survey-line-canvas{
  position:absolute;
  inset:0;
  z-index:430;
  pointer-events:none;
}
.map-toolbar,
.map-actions,
.frame-actions,
.map-compact-actions,
.map-rotation-actions{
  display:grid;
  gap:8px;
}
.map-toolbar{grid-template-columns:repeat(9,minmax(0,1fr));margin-top:10px}
.map-actions{
  grid-template-columns:repeat(4,minmax(0,1fr));
  margin-top:10px;
}
.frame-actions{
  grid-template-columns:1fr;
}
.map-compact-actions{
  grid-template-columns:1fr;
}
.map-rotation-actions{
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:6px;
  margin-top:6px;
}
.map-toolbar .small,
.map-actions .small,
.frame-actions .small,
.map-compact-actions .small,
.map-rotation-actions .small{
  min-height:48px;
  padding:10px 8px;
  touch-action:manipulation;
  user-select:none;
}
.map-rotation-actions .small{
  min-height:38px;
  padding:8px 4px;
  font-size:12px;
}
.map-toolbar .small.active{
  border-color:var(--leaf);
  background:var(--leaf);
  color:#fff;
}
.edit-action{
  border-color:rgba(24,118,74,.48);
}
.draw-tools{display:none}
#mapView.map-locked .frame-tools{display:none}
#mapView.map-locked .draw-tools{display:grid}
#mapView:not(.map-locked) .map-toolbar{
  display:none;
}
#mapView.map-locked .map-toolbar{
  display:grid;
}
.map-hint{
  color:var(--muted);
  font:700 12px Arial,sans-serif;
  letter-spacing:.6px;
  text-transform:uppercase;
}
.draw-shape-label{
  display:grid;
  width:54px;
  height:34px;
  place-items:center;
  color:#111;
  font:800 24px Inter,Arial,sans-serif;
  text-shadow:0 1px 2px #fff, 0 -1px 2px #fff, 1px 0 2px #fff, -1px 0 2px #fff;
}
.pole-label{
  color:#101010;
  font:700 13px Arial,sans-serif;
  text-shadow:0 1px 2px #fff, 0 -1px 2px #fff, 1px 0 2px #fff, -1px 0 2px #fff;
  white-space:nowrap;
}
.survey-pole-dot{
  width:14px;
  height:14px;
  border:0;
  border-radius:50%;
  background:var(--pole-color,#1d4ed8);
  box-shadow:0 1px 4px rgba(0,0,0,.35);
}
.pole-popup{
  min-width:150px;
  font-family:Inter,Arial,sans-serif;
  line-height:1.35;
}
.pole-popup-line{
  margin:0 0 4px;
}
.pole-popup-title{
  font-weight:700;
}
.pole-popup-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
  margin-top:8px;
}
.pole-popup-actions button{
  min-height:36px;
  border:1px solid rgba(16,34,25,.25);
  border-radius:6px;
  background:#fff;
  color:#102219;
  font:700 13px Arial,sans-serif;
}
.pole-popup-actions button.danger{
  border-color:rgba(176,48,32,.45);
  color:#8f2418;
}
.text-label{
  color:#111;
  font:700 17px Inter,Arial,sans-serif;
  text-shadow:0 1px 2px #fff, 0 -1px 2px #fff, 1px 0 2px #fff, -1px 0 2px #fff;
  white-space:nowrap;
}
.marker-row{
  display:grid;
  grid-template-columns:1fr auto;
  gap:8px;
  align-items:center;
}
.marker-row .small{
  min-width:110px;
}
a.primary,button.primary{
  border-color:var(--leaf);
  background:var(--leaf);
  color:#fff;
}
.danger{border-color:rgba(198,78,64,.58);color:#9d3328}
.hidden{display:none}
.asset-line{
  margin-top:5px;
  font-family:Inter,Arial,sans-serif;
  font-size:14px;
  line-height:1.38;
}
.asset-line strong{color:var(--ink)}
@media(max-width:520px){
  .actions{grid-template-columns:1fr}
  .search-form{grid-template-columns:1fr}
  body.map-mode .tabs{
    width:168px;
  }
  body.map-mode .map-controls{
    left:8px;
    right:8px;
    bottom:8px;
  }
  body.map-mode .map-search{
    top:64px;
    left:8px;
    right:8px;
    width:auto;
    transform:none;
  }
  body.map-mode .map-top-left{
    top:58px;
  }
  body.map-mode .map-top-right{
    top:8px;
  }
  .map-toolbar{grid-template-columns:repeat(4,minmax(0,1fr))}
  .map-actions{grid-template-columns:repeat(2,minmax(0,1fr))}
  .frame-actions{grid-template-columns:1fr}
  .marker-row{grid-template-columns:1fr}
  .field-grid{grid-template-columns:1fr}
  .value{font-size:20px}
}
</style>
</head>
<body>
<header>
  <h1>Tree Survey Locator</h1>
  <p>Field mapping, span lookup and survey copy helper</p>
</header>

<button class="view-switch-fab" id="viewSwitchBtn" type="button" onclick="toggleAppView()">Map</button>

<main>
  <nav class="tabs" aria-label="App views">
    <button class="tab-btn active" id="locatorTab" type="button" onclick="switchView('locator')">Locator</button>
    <button class="tab-btn" id="mapTab" type="button" onclick="switchView('map')">Map</button>
  </nav>

  <section id="locatorView" class="view">
    <section class="hero">
      <button id="locateBtn" type="button">LOCATE</button>
      <div id="status">Tap to locate</div>
    </section>

    <section class="card search-panel">
      <h2>Span data</h2>
      <div class="field-row">
        <input class="file-field" id="spanFileInput" type="file" accept=".csv,.xlsx,.xls" multiple>
      </div>
      <div class="detail" id="spanDataStatus">No span spreadsheet imported on this device.</div>
      <div class="actions">
        <button class="small primary" type="button" onclick="importSpanFiles()">Import spreadsheet</button>
        <button class="small" type="button" onclick="clearSpanData()">Clear data</button>
      </div>
    </section>

    <section class="card search-panel">
      <h2>Find span</h2>
      <form class="search-form" onsubmit="searchSpan(event)">
        <input class="text-field" id="spanSearchInput" type="search" placeholder="Span, pole, feeder, circuit, primary, grid ref">
        <button class="small primary" type="submit">Search</button>
      </form>
      <div class="detail" id="spanSearchStatus">Search your uploaded LV/HV span data.</div>
      <div class="match-list" id="spanSearchResults"></div>
    </section>

    <section id="results" class="grid"></section>
  </section>

  <section id="mapView" class="view hidden">
    <section class="card map-top-left">
      <div class="frame-actions">
        <button class="small primary" id="mapLockToggleBtn" type="button" onclick="toggleSurveyLock()">Lock map</button>
      </div>
    </section>

    <section class="card map-top-right">
      <div class="map-compact-actions">
        <button class="small" id="baseMapToggleBtn" type="button" onclick="toggleSurveyBaseMap()">Satellite</button>
      </div>
      <div class="map-rotation-actions">
        <button class="small" id="mapRotateLeftBtn" type="button" onclick="rotateSurveyMap(-15)">Left</button>
        <button class="small" id="mapNorthBtn" type="button" onclick="resetSurveyMapRotation()">North</button>
        <button class="small" id="mapRotateRightBtn" type="button" onclick="rotateSurveyMap(15)">Right</button>
      </div>
    </section>

    <section class="card map-search">
      <form class="search-form" onsubmit="searchMapSpan(event)">
        <input class="text-field" id="mapSpanSearchInput" type="search" placeholder="Search span or pole">
        <button class="small primary" type="submit">Find</button>
      </form>
    </section>

    <section class="card search-panel map-controls">
      <h2 class="map-title">Map drawing</h2>
      <div class="map-hint" id="surveyMapStage">Frame the span</div>
      <div class="detail" id="surveyMapStatus">Open the map tab to plot all imported spans.</div>
      <div class="map-toolbar">
        <button class="small" id="tool-tree" type="button" onclick="setMapTool('tree')">Tree</button>
        <button class="small" id="tool-group" type="button" onclick="setMapTool('group')">Group</button>
        <button class="small" id="tool-pole" type="button" onclick="setMapTool('pole')">Add pole</button>
        <button class="small" id="tool-link" type="button" onclick="setMapTool('link')">Link</button>
        <button class="small" id="tool-unlink" type="button" onclick="setMapTool('unlink')">Unlink</button>
        <button class="small" id="tool-label" type="button" onclick="setMapTool('label')">Label</button>
        <button class="small danger" id="tool-delete" type="button" onclick="setMapTool('delete')">Delete</button>
        <button class="small" type="button" onclick="undoMapDrawing()">Undo</button>
        <button class="small primary" type="button" onclick="captureSurveyMapScreenshot()">Screenshot</button>
      </div>
    </section>
    <section class="card map-canvas-card">
      <div id="surveyMap" aria-label="Survey map drawing area"></div>
    </section>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script>
<script src="https://unpkg.com/leaflet-rotate@0.2.8/dist/leaflet-rotate-src.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
<script>
const locateBtn = document.getElementById("locateBtn");
const statusEl = document.getElementById("status");
const resultsEl = document.getElementById("results");
const spanFileInput = document.getElementById("spanFileInput");
const spanDataStatus = document.getElementById("spanDataStatus");
const spanSearchInput = document.getElementById("spanSearchInput");
const spanSearchStatus = document.getElementById("spanSearchStatus");
const spanSearchResults = document.getElementById("spanSearchResults");
const locatorView = document.getElementById("locatorView");
const mapView = document.getElementById("mapView");
const locatorTab = document.getElementById("locatorTab");
const mapTab = document.getElementById("mapTab");
const viewSwitchBtn = document.getElementById("viewSwitchBtn");
const surveyMapStatus = document.getElementById("surveyMapStatus");
const surveyMapStage = document.getElementById("surveyMapStage");
const mapSpanSearchInput = document.getElementById("mapSpanSearchInput");
let currentReport = null;
let currentSpanMatches = [];
let currentLocateMatches = [];
let w3wMap = null;
let w3wMarker = null;
let w3wMarkerPosition = null;
let surveyMap = null;
let surveyStreetLayer = null;
let surveySatelliteLayer = null;
let surveyIsSatellite = false;
let surveyPoleLayer = null;
let surveyLineLayer = null;
let surveyLineCanvas = null;
let surveyLineCanvasCtx = null;
let surveyLineShapes = [];
let surveyLineCanvasSize = { width:0, height:0, ratio:0 };
let surveyDrawingLayer = null;
let surveyPoleBounds = null;
let mapTool = "pan";
let mapLocked = false;
let lockedMapBounds = null;
let lockedMapMinZoom = null;
let surveyMapRendered = false;
let surveyPolePoints = [];
let forcedMapPoleId = null;
let manualMapLinks = [];
let blockedAutoMapLinks = [];
let pendingLinkPoleId = null;
let rotateRedrawTimer = null;
let activeStrokePreview = null;
let mapDrawingStack = [];
let selectedDrawing = null;
let drawCounters = { tree:0, group:0 };
let activeRoute = null;
let activeRoutePoints = [];
window.SPAN_DATA = [];
window.AE_DATA = [];

locateBtn.addEventListener("click", locate);
loadStoredSpanData();
loadStoredManualMapLinks();
loadStoredBlockedAutoMapLinks();
loadBundledAEData();

function setBusy(isBusy, text){
  locateBtn.disabled = isBusy;
  locateBtn.textContent = isBusy ? "..." : "LOCATE";
  statusEl.textContent = text;
}

function escapeHtml(value){
  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function card(id, title, value, detail="", actions=""){
  return `
    <article class="card" id="${id}">
      <h2>${escapeHtml(title)}</h2>
      <div class="value">${escapeHtml(value)}</div>
      ${detail ? `<div class="detail">${escapeHtml(detail)}</div>` : ""}
      ${actions}
    </article>
  `;
}

function actions(items){
  return `<div class="actions">${items.join("")}</div>`;
}

function linkButton(label, href, primary=false){
  return `<a class="small ${primary ? "primary" : ""}" href="${href}" target="_blank" rel="noopener">${escapeHtml(label)}</a>`;
}

function copyButton(label, value){
  const encodedValue = encodeURIComponent(value).replaceAll("'","%27");
  return `<button class="small" type="button" onclick="copyText('${encodedValue}')">${escapeHtml(label)}</button>`;
}

async function copyText(encoded){
  const text = decodeURIComponent(encoded);
  try{
    await navigator.clipboard.writeText(text);
    statusEl.textContent = "Copied";
  }catch{
    statusEl.textContent = "Could not copy";
  }
}

function switchView(view){
  const showMap = view === "map";
  document.body.classList.toggle("map-mode", showMap);
  locatorView.classList.toggle("hidden", showMap);
  mapView.classList.toggle("hidden", !showMap);
  locatorTab.classList.toggle("active", !showMap);
  mapTab.classList.toggle("active", showMap);
  updateViewSwitchButton(showMap);

  if(showMap){
    initSurveyMap();
    setTimeout(() => {
      if(surveyMap){
        surveyMap.invalidateSize();
        const selectedSpan = currentReport?.nearestSpan;
        if(selectedSpan && getSpanMapPosition(selectedSpan)){
          focusMapOnSpan(selectedSpan);
        }else{
          renderSurveyMap(true);
        }
      }
    }, 100);
  }
}

function toggleAppView(){
  switchView(document.body.classList.contains("map-mode") ? "locator" : "map");
}

function updateViewSwitchButton(showMap=document.body.classList.contains("map-mode")){
  if(!viewSwitchBtn) return;
  viewSwitchBtn.textContent = showMap ? "Locator" : "Map";
  viewSwitchBtn.title = showMap ? "Return to locator view" : "Open map view";
}

function initSurveyMap(attempts=0){
  if(surveyMap) return;

  if(!window.L){
    if(attempts > 12){
      setSurveyMapStatus("Map library could not load. Check signal, then refresh.");
      return;
    }
    setSurveyMapStatus("Map is loading...");
    setTimeout(() => initSurveyMap(attempts + 1), 500);
    return;
  }

  const mapEl = document.getElementById("surveyMap");
  if(!mapEl) return;

  surveyMap = L.map(mapEl, {
    rotate:true,
    rotateControl:false,
    touchRotate:true,
    bearing:0,
    zoomControl:false,
    attributionControl:true,
    tap:true,
    touchZoom:true,
    dragging:true,
    scrollWheelZoom:true,
    doubleClickZoom:false,
    inertia:false,
    zoomAnimation:false,
    fadeAnimation:false,
    markerZoomAnimation:false,
    bounceAtZoomLimits:false,
    preferCanvas:false,
    zoomSnap:0.25,
    zoomDelta:0.25,
    maxBoundsViscosity:1.0
  }).setView([52.68, -1.82], 13);

  surveyStreetLayer = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom:19,
    attribution:"&copy; OpenStreetMap",
    keepBuffer:4,
    updateWhenIdle:true,
    updateWhenZooming:false
  }).addTo(surveyMap);

  surveySatelliteLayer = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {
    maxZoom:19,
    attribution:"Sources: Esri, Maxar, Earthstar Geographics, and the GIS User Community",
    keepBuffer:4,
    updateWhenIdle:true,
    updateWhenZooming:false
  });

  updateBaseMapButtons();

  surveyLineLayer = L.layerGroup().addTo(surveyMap);
  surveyPoleLayer = L.layerGroup().addTo(surveyMap);
  surveyDrawingLayer = L.layerGroup().addTo(surveyMap);
  installSurveyLineCanvas(mapEl);
  surveyMap.on("zoom move rotate resize", () => drawSurveyLineCanvas());
  surveyMap.on("zoomend moveend", () => {
    drawSurveyLineCanvas();
    refreshSurveyPoleMarkers();
  });
  surveyMap.on("rotate", () => {
    updateSurveyMapRotationButton();
  });
  surveyMap.on("rotateend", () => {
    scheduleSurveyLineRedrawAfterRotate();
  });
  installSurveyTouchHandlers(mapEl);
  unlockSurveyFrame(false);
  renderSurveyMap(true);
}

function setSurveyMapStatus(message){
  if(surveyMapStatus) surveyMapStatus.textContent = message;
}

function setSurveyMapStage(message){
  if(surveyMapStage) surveyMapStage.textContent = message;
}

function toggleSurveyBaseMap(){
  if(!surveyMap || !surveyStreetLayer || !surveySatelliteLayer) return;
  if(surveyIsSatellite){
    surveyMap.removeLayer(surveySatelliteLayer);
    surveyStreetLayer.addTo(surveyMap);
    surveyIsSatellite = false;
  }else{
    surveyMap.removeLayer(surveyStreetLayer);
    surveySatelliteLayer.addTo(surveyMap);
    surveyIsSatellite = true;
  }
  updateBaseMapButtons();
}

function updateBaseMapButtons(){
  const label = surveyIsSatellite ? "Street" : "Satellite";
  for(const id of ["baseMapToggleBtn"]){
    const button = document.getElementById(id);
    if(button) button.textContent = label;
  }
}

function rotateSurveyMap(delta){
  if(!surveyMap) initSurveyMap();
  if(!surveyMap) return;
  if(mapLocked){
    setSurveyMapStatus("Rotation is locked. Unlock the map to turn the frame.");
    return;
  }
  const current = getSurveyMapBearing();
  setSurveyMapBearing(current + delta);
}

function resetSurveyMapRotation(){
  if(mapLocked){
    setSurveyMapStatus("Rotation is locked. Unlock the map to turn the frame.");
    return;
  }
  setSurveyMapBearing(0);
}

function getSurveyMapBearing(){
  if(!surveyMap) return 0;
  if(typeof surveyMap.getBearing === "function"){
    const bearing = Number(surveyMap.getBearing());
    return Number.isFinite(bearing) ? bearing : 0;
  }
  return Number(surveyMap._bearing || 0) || 0;
}

function setSurveyMapBearing(bearing){
  if(!surveyMap) return;
  const next = ((bearing % 360) + 360) % 360;
  if(typeof surveyMap.setBearing !== "function"){
    setSurveyMapStatus("Map rotation could not load. Check signal, then refresh.");
    return;
  }
  surveyMap.setBearing(next);
  updateSurveyMapRotationButton();
  scheduleSurveyLineRedrawAfterRotate();
}

function updateSurveyMapRotationButton(){
  const bearing = Math.round(getSurveyMapBearing());
  const northButton = document.getElementById("mapNorthBtn");
  if(northButton) northButton.textContent = bearing ? `${bearing} deg` : "North";
  for(const id of ["mapRotateLeftBtn","mapNorthBtn","mapRotateRightBtn"]){
    const button = document.getElementById(id);
    if(!button) continue;
    button.disabled = mapLocked;
    button.title = mapLocked ? "Unlock the map to rotate it" : "";
  }
}

function scheduleSurveyLineRedrawAfterRotate(){
  window.clearTimeout(rotateRedrawTimer);
  rotateRedrawTimer = window.setTimeout(() => {
    if(!surveyMapRendered) return;
    drawSurveyLineCanvas();
    refreshSurveyPoleMarkers();
  }, 180);
}

function searchMapSpan(event){
  event.preventDefault();
  const query = mapSpanSearchInput?.value.trim() || "";
  if(!query){
    setSurveyMapStatus("Type a span or pole name to zoom the map to it.");
    return;
  }

  const matches = findSpanMatches(query, 1);
  const span = matches[0];
  focusMapOnSpan(span, { query });
}

function focusMapOnSpan(span, options={}){
  if(!surveyMap) initSurveyMap();
  if(!surveyMapRendered) renderSurveyMap(false);

  const query = options.query || poleDisplayName(span || {}) || "that span";
  const position = getSpanMapPosition(span);
  if(!span || !position){
    setSurveyMapStatus(`No plottable map result found for "${query}".`);
    return;
  }

  if(mapLocked) unlockSurveyFrame(false);
  forcedMapPoleId = span.mapPoleId || null;
  if(mapSpanSearchInput) mapSpanSearchInput.value = poleDisplayName(span);
  const zoom = Math.max(surveyMap.getZoom() || 0, 18);
  surveyMap.setView([position.lat, position.lon], zoom, { animate:false });
  drawSurveyLineCanvas();
  refreshSurveyPoleMarkers(forcedMapPoleId);

  const point = surveyPolePoints.find((item) => item.span === span || item.span?.mapPoleId === span.mapPoleId);
  if(point?.marker){
    point.marker.openPopup();
  }

  setSurveyMapStage("Frame the span");
  setSurveyMapStatus(`Showing ${poleDisplayName(span)}. Pan/zoom the patch, then lock the map.`);
}

async function captureSurveyMapScreenshot(){
  const mapEl = document.getElementById("surveyMap");
  if(!mapEl) return;

  try{
    if(typeof html2canvas !== "function") throw new Error("Screenshot tool still loading");
    setSurveyMapStatus("Preparing a map-only screenshot...");
    await new Promise((resolve) => setTimeout(resolve, 120));
    const canvas = await html2canvas(mapEl, {
      backgroundColor:null,
      scale:Math.min(2, window.devicePixelRatio || 1),
      useCORS:true,
      allowTaint:false,
      ignoreElements:(el) => Boolean(el.closest?.(".leaflet-control"))
    });
    const link = document.createElement("a");
    link.href = canvas.toDataURL("image/png");
    link.download = `survey-map-${new Date().toISOString().slice(0, 10)}.png`;
    document.body.appendChild(link);
    link.click();
    link.remove();
    setSurveyMapStatus("Map screenshot saved.");
  }catch{
    enterMapScreenshotMode();
  }
}

function enterMapScreenshotMode(){
  document.body.classList.add("screenshot-mode");
  setSurveyMapStatus("Controls hidden for 5 seconds. Take your iPad screenshot now.");
  setTimeout(() => {
    document.body.classList.remove("screenshot-mode");
    setSurveyMapStatus("Screenshot mode finished.");
  }, 5000);
}

function installSurveyTouchHandlers(mapEl){
  let strokePoints = [];
  let strokeStarted = false;
  let strokeMoved = false;
  let suppressClick = false;
  let pointTap = null;
  const editPointers = new Map();
  let editGesture = null;
  let selectedDrawingLastTapAt = 0;

  mapEl.addEventListener("pointerdown", (event) => {
    if(editGesture && selectedDrawing && mapLocked && mapTool === "pan"){
      event.preventDefault();
      event.stopPropagation();
      event.stopImmediatePropagation?.();
      mapEl.setPointerCapture?.(event.pointerId);
      editPointers.set(event.pointerId, pointerEventPoint(event));
      editGesture.last = gestureInfo([...editPointers.values()]);
      disableSurveyMapMovement();
      return;
    }

    if(selectedDrawing && mapLocked && mapTool === "pan" && isDrawingDomTarget(event.target)){
      event.preventDefault();
      event.stopPropagation();
      event.stopImmediatePropagation?.();
      mapEl.setPointerCapture?.(event.pointerId);
      editPointers.set(event.pointerId, pointerEventPoint(event));
      editGesture = {
        last:gestureInfo([...editPointers.values()]),
        moved:false,
        startedOnDrawing:isDrawingDomTarget(event.target)
      };
      disableSurveyMapMovement();
      return;
    }

    if(surveyMap && mapLocked && isPointMapTool() && !isLeafletControlTarget(event.target)){
      event.preventDefault();
      event.stopPropagation();
      event.stopImmediatePropagation?.();
      mapEl.setPointerCapture?.(event.pointerId);
      pointTap = {
        id:event.pointerId,
        x:event.clientX,
        y:event.clientY,
        latlng:latLngFromPointerEvent(event)
      };
      return;
    }

    if(!surveyMap || !mapLocked || mapTool !== "group") return;
    event.preventDefault();
    event.stopPropagation();
    event.stopImmediatePropagation?.();
    mapEl.setPointerCapture?.(event.pointerId);
    strokeStarted = true;
    strokeMoved = false;
    strokePoints = [surveyMap.containerPointToLatLng(L.point(event.clientX, event.clientY))];
    activeStrokePreview = L.polyline(strokePoints, {
      color:"#5fbd65",
      weight:5,
      opacity:0.95,
      dashArray:"8 6",
      interactive:false
    }).addTo(surveyDrawingLayer);
  }, { passive:false, capture:true });

  mapEl.addEventListener("pointermove", (event) => {
    if(pointTap && pointTap.id === event.pointerId){
      const moved = Math.hypot(event.clientX - pointTap.x, event.clientY - pointTap.y);
      if(moved > 10) pointTap = null;
    }

    if(editPointers.has(event.pointerId) && editGesture){
      event.preventDefault();
      event.stopPropagation();
      event.stopImmediatePropagation?.();
      editPointers.set(event.pointerId, pointerEventPoint(event));
      const current = gestureInfo([...editPointers.values()]);
      if(!current || !editGesture.last) return;

      const dx = current.center.x - editGesture.last.center.x;
      const dy = current.center.y - editGesture.last.center.y;
      if(Math.hypot(dx, dy) > 1){
        moveSelectedDrawingByPixels(dx, dy);
        editGesture.moved = true;
      }

      if(current.count >= 2 && editGesture.last.count >= 2){
        const scale = current.distance / Math.max(1, editGesture.last.distance);
        const rotation = current.angle - editGesture.last.angle;
        if(Math.abs(scale - 1) > 0.01){
          resizeDrawing(selectedDrawing, scale);
          editGesture.moved = true;
        }
        if(Math.abs(rotation) > 0.015){
          rotateDrawing(selectedDrawing, rotation * 180 / Math.PI);
          editGesture.moved = true;
        }
      }

      editGesture.last = current;
      return;
    }

    if(!strokeStarted || !surveyMap) return;
    event.preventDefault();
    event.stopPropagation();
    event.stopImmediatePropagation?.();
    strokePoints.push(surveyMap.containerPointToLatLng(L.point(event.clientX, event.clientY)));
    strokeMoved = strokeMoved || strokePoints.length > 3;
    if(activeStrokePreview) activeStrokePreview.setLatLngs(strokePoints);
  }, { passive:false, capture:true });

  for(const eventName of ["pointerup","pointercancel"]){
    mapEl.addEventListener(eventName, (event) => {
      if(pointTap && pointTap.id === event.pointerId){
        event.preventDefault();
        event.stopPropagation();
        event.stopImmediatePropagation?.();
        suppressClick = true;
        applySurveyMapTool(pointTap.latlng);
        pointTap = null;
        setTimeout(() => {
          suppressClick = false;
        }, 500);
        return;
      }

      if(editPointers.has(event.pointerId)){
        event.preventDefault();
        event.stopPropagation();
        event.stopImmediatePropagation?.();
        mapEl.releasePointerCapture?.(event.pointerId);
        editPointers.delete(event.pointerId);
        if(editGesture && !editGesture.moved && !editGesture.startedOnDrawing){
          selectDrawing(null);
          setSurveyMapStatus("Mark deselected.");
        }else if(editGesture && !editGesture.moved && editGesture.startedOnDrawing && selectedDrawing){
          const now = Date.now();
          if(now - selectedDrawingLastTapAt < 380){
            renameDrawingItem(selectedDrawing);
            selectedDrawingLastTapAt = 0;
          }else{
            selectedDrawingLastTapAt = now;
            setSurveyMapStatus(`${selectedDrawing.text} selected. Double tap to rename, drag to move, pinch to resize.`);
          }
        }
        if(!editPointers.size){
          editGesture = null;
          syncMapMovementState();
        }else{
          editGesture.last = gestureInfo([...editPointers.values()]);
        }
        return;
      }

      if(!strokeStarted) return;
      event.preventDefault();
      event.stopPropagation();
      event.stopImmediatePropagation?.();
      mapEl.releasePointerCapture?.(event.pointerId);
      strokeStarted = false;
      suppressClick = true;
      if(activeStrokePreview){
        surveyDrawingLayer.removeLayer(activeStrokePreview);
        activeStrokePreview = null;
      }
      addSurveyShapeFromStroke(mapTool, strokePoints, strokeMoved);
      setMapTool("pan");
      strokePoints = [];
      setTimeout(() => {
        suppressClick = false;
      }, 650);
    }, { passive:false, capture:true });
  }

  surveyMap.on("click", (event) => {
    if(suppressClick) return;
    handleSurveyMapClick(event);
  });
}

function renderSurveyMap(fitAfterRender=true){
  initSurveyMap();
  if(!surveyMap || !surveyPoleLayer || !surveyLineLayer) return;

  const points = getSurveyPolePoints();
  surveyPolePoints = points;
  surveyPoleLayer.clearLayers();
  surveyLineLayer.clearLayers();
  surveyLineShapes = [];
  clearSurveyLineCanvas();
  surveyPoleBounds = null;
  surveyMapRendered = false;

  if(!points.length){
    setSurveyMapStage("No map data");
    setSurveyMapStatus("No plottable poles found. Import a spreadsheet with Grid Ref or Grid Reference.");
    return;
  }

  const bounds = [];
  for(const point of points){
    bounds.push([point.lat, point.lon]);
  }

  renderSurveyLineRuns(points);
  renderManualMapLinks();
  surveyPoleBounds = L.latLngBounds(bounds);
  surveyMapRendered = true;
  if(fitAfterRender) fitSurveyMap();
  drawSurveyLineCanvas();
  refreshSurveyPoleMarkers();
  setSurveyMapStage(mapLocked ? "Drawing tools" : "Frame the span");
  setSurveyMapStatus(`${points.length} poles plotted. Links are inferred from pole names or nearest distance; use Link and Unlink to correct the map.`);
}

function fitSurveyMap(){
  if(!surveyMap) initSurveyMap();
  if(surveyMap && surveyPoleBounds && surveyPoleBounds.isValid()){
    surveyMap.fitBounds(surveyPoleBounds.pad(0.18), { maxZoom:18 });
  }
}

function getSurveyPolePoints(){
  const spans = Array.isArray(window.SPAN_DATA) ? window.SPAN_DATA : [];
  return spans
    .map((span) => {
      const position = getSpanMapPosition(span);
      if(!position) return null;
      if(!span.mapPoleId) span.mapPoleId = createId("pole");
      const label = poleDisplayName(span);
      const parsed = parsePoleLabel(label);
      return {
        span,
        label,
        lat:position.lat,
        lon:position.lon,
        prefix:parsed.prefix,
        number:parsed.number,
        suffix:parsed.suffix,
        network:span.networkNumber || span.primaryNo || "network"
      };
    })
    .filter(Boolean);
}

function refreshSurveyPoleMarkers(forceMapPoleId=null){
  if(!surveyMap || !surveyPoleLayer || !surveyPolePoints.length) return;
  const forceId = forceMapPoleId || forcedMapPoleId;
  const zoom = surveyMap.getZoom();
  const density = poleDisplayDensity(zoom);
  const bounds = surveyMap.getBounds().pad(0.08);
  const shown = [];
  const usedCells = new Set();

  surveyPoleLayer.clearLayers();
  for(const point of surveyPolePoints){
    point.marker = null;
  }

  for(const point of surveyPolePoints){
    const isForced = forceId && point.span.mapPoleId === forceId;
    if(!isForced && !bounds.contains([point.lat, point.lon])) continue;

    let showLabel = isForced || density.showLabels;
    if(density.cellSize > 0 && !isForced){
      const pixel = surveyMap.latLngToContainerPoint([point.lat, point.lon]);
      const key = `${Math.floor(pixel.x / density.cellSize)}:${Math.floor(pixel.y / density.cellSize)}`;
      showLabel = !usedCells.has(key);
      if(showLabel) usedCells.add(key);
    }

    shown.push({ point, showLabel });
  }

  if(!shown.length){
    const fallback = surveyPolePoints.find((point) => bounds.contains([point.lat, point.lon])) || surveyPolePoints[0];
    if(fallback) shown.push({ point:fallback, showLabel:false });
  }

  for(const item of shown){
    renderSurveyPole(item.point, item.showLabel);
  }
}

function poleDisplayDensity(zoom){
  if(zoom >= 17.5) return { cellSize:0, showLabels:true };
  if(zoom >= 16.5) return { cellSize:82, showLabels:true };
  if(zoom >= 15.5) return { cellSize:115, showLabels:true };
  if(zoom >= 14) return { cellSize:165, showLabels:false };
  return { cellSize:240, showLabels:false };
}

function renderSurveyPole(point, showLabel=false){
  const marker = L.marker([point.lat, point.lon], {
    draggable:true,
    title:point.label,
    icon:L.divIcon({
      className:"",
      html:`<div class="survey-pole-dot" style="--pole-color:${lineColorForPoints(point)}"></div>`,
      iconSize:[14,14],
      iconAnchor:[7,7]
    })
  }).addTo(surveyPoleLayer);

  marker.bindTooltip(point.label, {
    permanent:showLabel,
    direction:"top",
    offset:[0,-8],
    className:"pole-label"
  });

  marker.bindPopup(buildPolePopup(point));
  point.marker = marker;

  marker.on("click", (event) => {
    if(mapTool === "link"){
      L.DomEvent.stop(event.originalEvent || event);
      handleManualPoleLink(point);
      return;
    }
    if(mapTool === "unlink"){
      L.DomEvent.stop(event.originalEvent || event);
      handleManualPoleUnlink(point);
      return;
    }
    if(mapTool === "delete"){
      L.DomEvent.stop(event.originalEvent || event);
      removeMapPole(point.span.mapPoleId);
    }
  });

  marker.on("dragstart", () => {
    setMapTool("pan");
  });

  marker.on("dragend", () => {
    const position = marker.getLatLng();
    point.lat = position.lat;
    point.lon = position.lng;
    point.span.latitude = position.lat;
    point.span.longitude = position.lng;
    point.span.coordinateSource = "manual-map";
    persistSpanData();
    redrawSurveyLinesOnly();
    setSurveyMapStatus(`${point.label} moved. Lock the map again when the span is framed.`);
  });
}

function buildPolePopup(point){
  const wrap = document.createElement("div");
  wrap.className = "pole-popup";

  const lines = [
    ["Drag this pole to reposition it.", ""],
    [point.label, "pole-popup-title"],
    [point.span.gridRef || "", ""],
    [point.span.networkNumber || point.span.primaryNo || "", ""],
    [point.span.circuitName || "", ""]
  ];

  for(const [text, className] of lines){
    if(!text) continue;
    const line = document.createElement("div");
    line.className = `pole-popup-line ${className}`.trim();
    line.textContent = text;
    wrap.appendChild(line);
  }

  const actions = document.createElement("div");
  actions.className = "pole-popup-actions";

  const rename = document.createElement("button");
  rename.type = "button";
  rename.textContent = "Rename";
  rename.addEventListener("click", (event) => {
    event.preventDefault();
    event.stopPropagation();
    renameMapPole(point.span.mapPoleId);
  });

  const remove = document.createElement("button");
  remove.type = "button";
  remove.className = "danger";
  remove.textContent = "Remove";
  remove.addEventListener("click", (event) => {
    event.preventDefault();
    event.stopPropagation();
    removeMapPole(point.span.mapPoleId);
  });

  actions.append(rename, remove);
  wrap.appendChild(actions);
  return wrap;
}

function renderSurveyLineRuns(points){
  const groups = new Map();

  for(const point of points){
    const key = `${point.network}|${point.prefix || "unknown"}`;
    if(!groups.has(key)) groups.set(key, []);
    groups.get(key).push(point);
  }

  for(const group of groups.values()){
    const numbered = group
      .filter((point) => Number.isFinite(point.number));
    if(shouldUseDistanceNetwork(group, numbered)){
      drawDistanceNetworkLinks(group);
      continue;
    }

    const mainPoles = numbered
      .filter((point) => !point.suffix)
      .sort((a, b) => a.number - b.number);
    const mainByNumber = new Map(mainPoles.map((point) => [point.number, point]));

    for(let i = 0; i < mainPoles.length - 1; i++){
      const a = mainPoles[i];
      const b = mainPoles[i + 1];
      const distanceM = haversineKm(a.lat, a.lon, b.lat, b.lon) * 1000;
      const hasMissingPole = Number.isFinite(a.number) && Number.isFinite(b.number) && Math.abs(b.number - a.number) > 1;
      drawSurveyAutoNetworkLine(a, b, hasMissingPole || distanceM > 250);
    }

    const spurGroups = new Map();
    for(const point of numbered.filter((item) => item.suffix)){
      if(!spurGroups.has(point.number)) spurGroups.set(point.number, []);
      spurGroups.get(point.number).push(point);
    }

    for(const [number, spurs] of spurGroups.entries()){
      const orderedSpurs = spurs.sort((a, b) => suffixSortValue(a.suffix) - suffixSortValue(b.suffix));
      const base = mainByNumber.get(number);
      if(base && orderedSpurs[0]){
        drawSurveyAutoNetworkLine(base, orderedSpurs[0], false);
      }

      for(let i = 0; i < orderedSpurs.length - 1; i++){
        const a = orderedSpurs[i];
        const b = orderedSpurs[i + 1];
        const hasMissingSuffix = suffixSortValue(b.suffix) - suffixSortValue(a.suffix) > 1;
        drawSurveyAutoNetworkLine(a, b, hasMissingSuffix);
      }
    }
  }
}

function shouldUseDistanceNetwork(group, numbered){
  if(group.length < 2) return false;
  const alphaCount = numbered.filter((point) => point.prefix && point.prefix !== "UNKNOWN").length;
  return alphaCount < 2;
}

function drawDistanceNetworkLinks(points){
  const candidates = points
    .filter((point) => Number.isFinite(point.lat) && Number.isFinite(point.lon));
  if(candidates.length < 2) return;

  const connected = new Set([candidates[0].span.mapPoleId]);
  const remaining = new Set(candidates.slice(1).map((point) => point.span.mapPoleId));
  const byId = new Map(candidates.map((point) => [point.span.mapPoleId, point]));

  while(remaining.size){
    let best = null;
    for(const fromId of connected){
      const from = byId.get(fromId);
      for(const toId of remaining){
        const to = byId.get(toId);
        const distanceM = haversineKm(from.lat, from.lon, to.lat, to.lon) * 1000;
        if(!best || distanceM < best.distanceM){
          best = { from, to, distanceM };
        }
      }
    }

    if(!best) break;
    drawSurveyAutoNetworkLine(best.from, best.to, best.distanceM > 180);
    connected.add(best.to.span.mapPoleId);
    remaining.delete(best.to.span.mapPoleId);
  }
}

function suffixSortValue(suffix){
  const text = String(suffix || "").toUpperCase();
  let value = 0;
  for(const char of text){
    const code = char.charCodeAt(0);
    if(code < 65 || code > 90) continue;
    value = value * 26 + (code - 64);
  }
  return value;
}

function drawSurveyAutoNetworkLine(a, b, isGap=false){
  const autoLinkId = mapLinkKey(a.span.mapPoleId, b.span.mapPoleId);
  if(blockedAutoMapLinks.includes(autoLinkId)) return;
  drawSurveyNetworkLine([[a.lat, a.lon], [b.lat, b.lon]], isGap, null, autoLinkId, lineColorForPoints(a, b));
}

function renderManualMapLinks(){
  if(!surveyLineLayer || !manualMapLinks.length) return;
  const pointsById = new Map(surveyPolePoints.map((point) => [point.span.mapPoleId, point]));
  const before = manualMapLinks.length;
  manualMapLinks = manualMapLinks.filter((link) => pointsById.has(link.a) && pointsById.has(link.b));
  if(manualMapLinks.length !== before) persistManualMapLinks();

  for(const link of manualMapLinks){
    const a = pointsById.get(link.a);
    const b = pointsById.get(link.b);
    drawSurveyNetworkLine([[a.lat, a.lon], [b.lat, b.lon]], false, link.id, null, lineColorForPoints(a, b));
  }
}

function drawSurveyNetworkLine(latlngs, isGap=false, manualLinkId=null, autoLinkId=null, lineColor="#2648d8"){
  surveyLineShapes.push({
    latlngs:latlngs.map((point) => L.latLng(point[0], point[1])),
    isGap,
    manualLinkId,
    autoLinkId,
    lineColor
  });
}

function lineColorForPoints(...points){
  const hasHv = points.some((point) => normaliseSearchText(point?.span?.voltage || "").startsWith("hv"));
  return hasHv ? "#d33a2c" : "#2648d8";
}

function redrawSurveyLinesOnly(){
  if(!surveyLineLayer) return;
  surveyLineLayer.clearLayers();
  surveyLineShapes = [];
  clearSurveyLineCanvas();
  renderSurveyLineRuns(surveyPolePoints);
  renderManualMapLinks();
  drawSurveyLineCanvas();
}

function refreshSurveyLineDisplay(){
  drawSurveyLineCanvas();
}

function installSurveyLineCanvas(mapEl){
  if(surveyLineCanvas) return;
  surveyLineCanvas = document.createElement("canvas");
  surveyLineCanvas.className = "survey-line-canvas";
  surveyLineCanvas.setAttribute("aria-hidden", "true");
  mapEl.appendChild(surveyLineCanvas);
  surveyLineCanvasCtx = surveyLineCanvas.getContext("2d");
  resizeSurveyLineCanvas();
}

function resizeSurveyLineCanvas(){
  if(!surveyLineCanvas || !surveyMap) return;
  const size = surveyMap.getSize();
  const ratio = window.devicePixelRatio || 1;
  const width = Math.max(1, Math.round(size.x * ratio));
  const height = Math.max(1, Math.round(size.y * ratio));
  surveyLineCanvas.style.width = `${size.x}px`;
  surveyLineCanvas.style.height = `${size.y}px`;
  if(surveyLineCanvas.width !== width || surveyLineCanvas.height !== height || surveyLineCanvasSize.ratio !== ratio){
    surveyLineCanvas.width = width;
    surveyLineCanvas.height = height;
    surveyLineCanvasSize = { width, height, ratio };
  }
  if(surveyLineCanvasCtx){
    surveyLineCanvasCtx.setTransform(ratio, 0, 0, ratio, 0, 0);
  }
}

function clearSurveyLineCanvas(){
  if(!surveyLineCanvasCtx || !surveyLineCanvas || !surveyMap) return;
  const size = surveyMap.getSize();
  surveyLineCanvasCtx.clearRect(0, 0, size.x, size.y);
}

function drawSurveyLineCanvas(){
  if(!surveyLineCanvasCtx || !surveyMap) return;
  resizeSurveyLineCanvas();
  clearSurveyLineCanvas();
  if(!surveyLineShapes.length) return;

  const ctx = surveyLineCanvasCtx;
  ctx.save();
  ctx.lineWidth = 3.5;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.globalAlpha = 0.95;

  for(const line of surveyLineShapes){
    const points = line.latlngs.map((latlng) => surveyMap.latLngToContainerPoint(latlng));
    if(points.length < 2) continue;
    ctx.strokeStyle = line.lineColor || "#2648d8";
    ctx.setLineDash(line.isGap ? [1, 14] : []);
    ctx.beginPath();
    ctx.moveTo(points[0].x, points[0].y);
    for(let i = 1; i < points.length; i++){
      ctx.lineTo(points[i].x, points[i].y);
    }
    ctx.stroke();
  }

  ctx.restore();
}

function handleCanvasLineClick(containerPoint){
  if(!["unlink","delete"].includes(mapTool) || !surveyLineShapes.length) return false;
  const point = { x:containerPoint.x, y:containerPoint.y };
  for(let i = surveyLineShapes.length - 1; i >= 0; i--){
    const line = surveyLineShapes[i];
    const points = line.latlngs.map((latlng) => surveyMap.latLngToContainerPoint(latlng));
    if(points.length < 2) continue;
    for(let p = 0; p < points.length - 1; p++){
      if(pointToSegmentDistance(point, points[p], points[p + 1]) <= 14){
        if(line.manualLinkId){
          removeManualMapLink(line.manualLinkId);
          return true;
        }
        if(line.autoLinkId && mapTool === "unlink"){
          blockAutoMapLink(line.autoLinkId);
          return true;
        }
      }
    }
  }
  return false;
}

function pointToSegmentDistance(point, a, b){
  const dx = b.x - a.x;
  const dy = b.y - a.y;
  if(dx === 0 && dy === 0) return Math.hypot(point.x - a.x, point.y - a.y);
  const t = Math.max(0, Math.min(1, ((point.x - a.x) * dx + (point.y - a.y) * dy) / (dx * dx + dy * dy)));
  const x = a.x + t * dx;
  const y = a.y + t * dy;
  return Math.hypot(point.x - x, point.y - y);
}

function toggleSurveyLock(){
  if(mapLocked) unlockSurveyFrame();
  else lockSurveyFrame();
}

function updateLockButton(){
  const button = document.getElementById("mapLockToggleBtn");
  if(!button) return;
  button.textContent = mapLocked ? "Unlock map" : "Lock map";
  button.classList.toggle("primary", !mapLocked);
  updateSurveyMapRotationButton();
}

function lockSurveyFrame(){
  if(!surveyMap) initSurveyMap();
  if(!surveyMapRendered) renderSurveyMap(false);
  lockedMapBounds = surveyMap.getBounds().pad(0.02);
  lockedMapMinZoom = surveyMap.getZoom();
  mapLocked = true;
  mapView.classList.add("map-locked");
  enableSurveyMapMovement();
  surveyMap.setMaxBounds(lockedMapBounds);
  surveyMap.setMinZoom(lockedMapMinZoom);
  setMapTool("pan", true);
  setSurveyMapStage("Drawing tools");
  setSurveyMapStatus("Patch locked. You can zoom in and pan inside this framed area.");
  updateLockButton();
}

function unlockSurveyFrame(showMessage=true){
  mapLocked = false;
  lockedMapBounds = null;
  lockedMapMinZoom = null;
  mapView.classList.remove("map-locked");
  selectDrawing(null);
  clearSurveyMapBounds();
  enableSurveyMapMovement();
  setSurveyMapStage("Frame the span");
  if(showMessage) setSurveyMapStatus("Map unlocked. Pan and zoom to frame the span, then lock the map.");
  updateLockButton();
}

function clearSurveyMapBounds(){
  if(!surveyMap) return;
  surveyMap.setMaxBounds(null);
  surveyMap.setMinZoom(0);
}

function disableSurveyMapMovement(){
  if(!surveyMap) return;
  surveyMap.dragging.disable();
  surveyMap.touchZoom.disable();
  surveyMap.touchRotate?.disable?.();
  surveyMap.scrollWheelZoom.disable();
  surveyMap.doubleClickZoom.disable();
  surveyMap.boxZoom.disable();
  surveyMap.keyboard.disable();
}

function enableSurveyMapMovement(){
  if(!surveyMap) return;
  surveyMap.dragging.enable();
  surveyMap.touchZoom.enable();
  if(mapLocked) surveyMap.touchRotate?.disable?.();
  else surveyMap.touchRotate?.enable?.();
  surveyMap.scrollWheelZoom.enable();
  surveyMap.doubleClickZoom.disable();
  surveyMap.boxZoom.enable();
  surveyMap.keyboard.enable();
}

function persistSpanData(){
  try{
    localStorage.setItem("treeSurveySpanData", JSON.stringify(window.SPAN_DATA || []));
  }catch{
    setSurveyMapStatus("Pole moved, but this browser could not save it locally.");
  }
}

function poleDisplayName(span){
  return String(span.toPole || span.span || span.externalReference || "Pole").trim();
}

function parsePoleLabel(label){
  const match = String(label || "").trim().match(/^([A-Za-z]+)\s*0*(\d+)([A-Za-z]*)/);
  return {
    prefix:match ? match[1].toUpperCase() : "UNKNOWN",
    number:match ? Number(match[2]) : NaN,
    suffix:match ? match[3].toUpperCase() : ""
  };
}

function addMapPole(latlng){
  const suggestion = suggestMissingPole(latlng);
  const naming = chooseAddedPoleName(latlng, suggestion);
  if(!naming) return;
  const label = naming.label;

  const template = naming.template?.span || suggestion?.template?.span || {};
  const gridRef = latLonToOSGrid(latlng.lat, latlng.lng);
  const span = {
    ...template,
    mapPoleId:createId("pole"),
    span:label,
    toPole:label,
    externalReference:label,
    gridRef,
    latitude:latlng.lat,
    longitude:latlng.lng,
    coordinateSource:"manual-map",
    manuallyAdded:true
  };

  window.SPAN_DATA.push(span);
  persistSpanData();
  renderSurveyMap(false);
  setMapTool("pan");
  setSurveyMapStatus(`${label} added. Drag it to fine tune, or tap the pole popup to rename.`);
}

function addPoleAtMapCenter(){
  if(!surveyMap) return;
  if(!mapLocked){
    setSurveyMapStatus("Lock the map first, then add a pole.");
    return;
  }
  addMapPole(surveyMap.getCenter());
}

function nextManualPoleName(){
  const count = (window.SPAN_DATA || []).filter((span) => span.manuallyAdded).length + 1;
  return `NEW POLE ${count}`;
}

function chooseAddedPoleName(latlng, gapSuggestion=null){
  const nearestRun = nearestPoleRunForPoint(latlng);
  const choices = poleNamingChoices(nearestRun?.run || [], gapSuggestion);

  if(!choices.length){
    return { label:nextManualPoleName(), template:gapSuggestion?.template || nearestRun?.template || null };
  }

  const lines = choices.map((choice, index) => `${index + 1}. ${choice.label} - ${choice.detail}`).join("\n");
  const answer = window.prompt(`Name this new pole:\n${lines}\n\nType 1 or 2, or type a custom pole name.`, "1");
  if(answer === null) return null;
  const trimmed = answer.trim();
  const choiceIndex = Number(trimmed) - 1;
  if(Number.isInteger(choiceIndex) && choices[choiceIndex]){
    return choices[choiceIndex];
  }
  const custom = trimmed.toUpperCase();
  if(!custom) return null;
  return { label:custom, template:gapSuggestion?.template || nearestRun?.template || null };
}

function poleNamingChoices(run, gapSuggestion=null){
  const points = run.filter((point) => Number.isFinite(point.number));
  const template = gapSuggestion?.template || points[0] || null;
  const prefix = (gapSuggestion?.label?.match(/^[A-Z]+/i)?.[0] || points.find((point) => point.prefix && point.prefix !== "UNKNOWN")?.prefix || "POLE").toUpperCase();
  const used = new Set(points.map((point) => point.number));
  const max = points.length ? Math.max(...points.map((point) => point.number)) : null;

  const choices = [];
  if(Number.isFinite(max)){
    choices.push({
      label:`${prefix}${max + 1}`,
      detail:"next pole ascending",
      template:points.find((point) => point.number === max) || template
    });
  }

  let descendingNumber = null;
  if(gapSuggestion?.label){
    const parsed = parsePoleLabel(gapSuggestion.label);
    if(Number.isFinite(parsed.number)) descendingNumber = parsed.number;
  }
  if(!Number.isFinite(descendingNumber) && Number.isFinite(max)){
    for(let candidate = max - 1; candidate >= 1; candidate--){
      if(!used.has(candidate)){
        descendingNumber = candidate;
        break;
      }
    }
    if(!Number.isFinite(descendingNumber)){
      const min = Math.min(...points.map((point) => point.number));
      if(min > 1) descendingNumber = min - 1;
    }
  }

  if(Number.isFinite(descendingNumber)){
    const descendingLabel = gapSuggestion?.label || `${prefix}${descendingNumber}`;
    choices.push({
      label:descendingLabel,
      detail:gapSuggestion?.label ? "missing pole in this run" : "next available pole descending",
      template
    });
  }

  if(!choices.length) choices.push({ label:nextManualPoleName(), detail:"manual pole name", template });
  return choices.slice(0, 2);
}

function nearestPoleRunForPoint(latlng){
  if(!surveyMap || !surveyPolePoints.length) return null;
  const tapPoint = surveyMap.latLngToContainerPoint(latlng);
  let best = null;

  for(const run of groupedSurveyPoleRuns()){
    if(!run.length) continue;
    for(let i = 0; i < run.length; i++){
      const point = surveyMap.latLngToContainerPoint([run[i].lat, run[i].lon]);
      const distance = Math.hypot(tapPoint.x - point.x, tapPoint.y - point.y);
      if(!best || distance < best.distance){
        best = { run, distance, template:run[i] };
      }
    }
    for(let i = 0; i < run.length - 1; i++){
      const a = surveyMap.latLngToContainerPoint([run[i].lat, run[i].lon]);
      const b = surveyMap.latLngToContainerPoint([run[i + 1].lat, run[i + 1].lon]);
      const distance = pointToSegmentDistance(tapPoint, a, b);
      if(!best || distance < best.distance){
        best = { run, distance, template:run[i] };
      }
    }
  }

  return best;
}

function suggestMissingPole(latlng){
  if(!surveyMap || !surveyPolePoints.length) return null;
  const tapPoint = surveyMap.latLngToContainerPoint(latlng);
  let best = null;

  for(const run of groupedSurveyPoleRuns()){
    for(let i = 0; i < run.length - 1; i++){
      const a = run[i];
      const b = run[i + 1];
      if(!Number.isFinite(a.number) || !Number.isFinite(b.number)) continue;
      const gap = b.number - a.number;
      if(Math.abs(gap) <= 1) continue;

      const aPoint = surveyMap.latLngToContainerPoint([a.lat, a.lon]);
      const bPoint = surveyMap.latLngToContainerPoint([b.lat, b.lon]);
      const distance = pointToSegmentDistance(tapPoint, aPoint, bPoint);
      if(best && distance >= best.distance) continue;

      const missingNumber = a.number + Math.sign(gap);
      best = {
        distance,
        label:`${a.prefix}${missingNumber}${a.suffix || ""}`,
        template:a
      };
    }
  }

  return best && best.distance <= 90 ? best : null;
}

function groupedSurveyPoleRuns(){
  const groups = new Map();
  for(const point of surveyPolePoints){
    const key = `${point.network}|${point.prefix || "unknown"}`;
    if(!groups.has(key)) groups.set(key, []);
    groups.get(key).push(point);
  }
  return [...groups.values()].map((group) => group
    .filter((point) => Number.isFinite(point.number))
    .sort((a, b) => a.number - b.number || String(a.suffix).localeCompare(String(b.suffix))));
}

function renameMapPole(mapPoleId){
  const span = (window.SPAN_DATA || []).find((item) => item.mapPoleId === mapPoleId);
  if(!span) return;
  const current = poleDisplayName(span);
  const next = (window.prompt("Pole name", current) || "").trim();
  if(!next || next === current) return;
  span.span = next;
  span.toPole = next;
  span.externalReference = next;
  persistSpanData();
  renderSurveyMap(false);
  setSurveyMapStatus(`${next} renamed.`);
}

function removeMapPole(mapPoleId){
  const spans = Array.isArray(window.SPAN_DATA) ? window.SPAN_DATA : [];
  const index = spans.findIndex((item) => item.mapPoleId === mapPoleId);
  if(index < 0) return;

  const name = poleDisplayName(spans[index]);
  const ok = window.confirm(`Remove ${name} from this device's map data?`);
  if(!ok) return;

  spans.splice(index, 1);
  if(forcedMapPoleId === mapPoleId) forcedMapPoleId = null;
  manualMapLinks = manualMapLinks.filter((link) => link.a !== mapPoleId && link.b !== mapPoleId);
  blockedAutoMapLinks = blockedAutoMapLinks.filter((key) => !String(key).split("|").includes(mapPoleId));
  persistManualMapLinks();
  persistBlockedAutoMapLinks();
  persistSpanData();
  renderSurveyMap(false);
  setMapTool("pan", true);
  setSurveyMapStatus(`${name} removed.`);
}

function handleManualPoleLink(point){
  const poleId = point.span.mapPoleId;
  if(!pendingLinkPoleId){
    pendingLinkPoleId = poleId;
    setSurveyMapStatus(`Link started at ${point.label}. Tap the next pole.`);
    return;
  }

  if(pendingLinkPoleId === poleId){
    pendingLinkPoleId = null;
    setMapTool("pan", true);
    setSurveyMapStatus("Link cancelled.");
    return;
  }

  const existing = manualMapLinks.some((link) =>
    (link.a === pendingLinkPoleId && link.b === poleId) ||
    (link.a === poleId && link.b === pendingLinkPoleId)
  );

  if(existing){
    pendingLinkPoleId = null;
    setMapTool("pan", true);
    setSurveyMapStatus("Those poles are already linked.");
    return;
  }

  manualMapLinks.push({
    id:createId("link"),
    a:pendingLinkPoleId,
    b:poleId
  });
  pendingLinkPoleId = null;
  persistManualMapLinks();
  redrawSurveyLinesOnly();
  setMapTool("pan", true);
  setSurveyMapStatus("Poles linked.");
}

function handleManualPoleUnlink(point){
  const poleId = point.span.mapPoleId;
  if(!pendingLinkPoleId){
    pendingLinkPoleId = poleId;
    setSurveyMapStatus(`Unlink started at ${point.label}. Tap the connected pole.`);
    return;
  }

  if(pendingLinkPoleId === poleId){
    pendingLinkPoleId = null;
    setMapTool("pan", true);
    setSurveyMapStatus("Unlink cancelled.");
    return;
  }

  const linkKey = mapLinkKey(pendingLinkPoleId, poleId);
  const manualBefore = manualMapLinks.length;
  manualMapLinks = manualMapLinks.filter((link) => mapLinkKey(link.a, link.b) !== linkKey);

  if(manualMapLinks.length !== manualBefore){
    persistManualMapLinks();
    pendingLinkPoleId = null;
    redrawSurveyLinesOnly();
    setMapTool("pan", true);
    setSurveyMapStatus("Manual pole link removed.");
    return;
  }

  if(!blockedAutoMapLinks.includes(linkKey)){
    blockedAutoMapLinks.push(linkKey);
    persistBlockedAutoMapLinks();
    pendingLinkPoleId = null;
    redrawSurveyLinesOnly();
    setMapTool("pan", true);
    setSurveyMapStatus("Automatic pole link hidden.");
    return;
  }

  pendingLinkPoleId = null;
  setMapTool("pan", true);
  setSurveyMapStatus("Those poles were already unlinked.");
}

function removeManualMapLink(linkId){
  const before = manualMapLinks.length;
  manualMapLinks = manualMapLinks.filter((link) => link.id !== linkId);
  if(manualMapLinks.length === before) return;
  persistManualMapLinks();
  redrawSurveyLinesOnly();
  setSurveyMapStatus("Manual pole link removed.");
}

function blockAutoMapLink(autoLinkId){
  if(!blockedAutoMapLinks.includes(autoLinkId)){
    blockedAutoMapLinks.push(autoLinkId);
    persistBlockedAutoMapLinks();
  }
  redrawSurveyLinesOnly();
  setSurveyMapStatus("Automatic pole link hidden. Use Link to draw the correct connection.");
}

function persistManualMapLinks(){
  try{
    localStorage.setItem("treeSurveyManualMapLinks", JSON.stringify(manualMapLinks));
  }catch{
    setSurveyMapStatus("Link changed, but this browser could not save it locally.");
  }
}

function persistBlockedAutoMapLinks(){
  try{
    localStorage.setItem("treeSurveyBlockedAutoMapLinks", JSON.stringify(blockedAutoMapLinks));
  }catch{
    setSurveyMapStatus("Auto link hidden, but this browser could not save it locally.");
  }
}

function mapLinkKey(a, b){
  return [a, b].map(String).sort().join("|");
}

function createId(prefix){
  return `${prefix}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}`;
}

function setMapTool(tool, force=false){
  if(!force && ["pole","tree","group","link"].includes(tool) && mapTool === tool){
    tool = "pan";
  }
  mapTool = tool;
  if(tool !== "link" && tool !== "unlink") pendingLinkPoleId = null;
  updateMapMovementForTool();
  for(const id of ["pan","pole","tree","group","link","unlink","route","label","delete"]){
    const button = document.getElementById(`tool-${id}`);
    if(button) button.classList.toggle("active", id === tool);
  }
  const messages = {
    pan:"Pan and zoom the locked map. Tap a mark to select it.",
    pole:"Tap where the missing pole should go.",
    tree:"Tap once to place a single tree circle.",
    group:"Draw around the group. The app will tidy it into the closest shape.",
    link:"Tap one pole, then tap the pole it should link to.",
    unlink:"Tap one pole, then tap the pole it should unlink from.",
    route:"Tap along the access route. Press Finish route when done.",
    label:"Tap the map, then type a label.",
    delete:"Tap a drawn mark, manual link, or pole to remove it."
  };
  setSurveyMapStatus(messages[tool] || "Map tool selected.");
}

function updateMapMovementForTool(){
  syncMapMovementState();
}

function syncMapMovementState(){
  if(!surveyMap) return;
  if(mapLocked && (mapTool === "group" || selectedDrawing)){
    disableSurveyMapMovement();
  }else{
    enableSurveyMapMovement();
  }
}

function handleSurveyMapClick(event){
  if(handleCanvasLineClick(event.containerPoint)) return;

  if(mapTool === "pan" && selectedDrawing){
    selectDrawing(null);
    setSurveyMapStatus("Mark deselected.");
    return;
  }
  if(mapTool === "pole"){
    addMapPole(event.latlng);
    return;
  }
  applySurveyMapTool(event.latlng);
}

function isPointMapTool(){
  return ["pole","tree","route","label"].includes(mapTool);
}

function isLeafletControlTarget(target){
  return Boolean(target?.closest?.(".leaflet-control"));
}

function latLngFromPointerEvent(event){
  const rect = surveyMap.getContainer().getBoundingClientRect();
  return surveyMap.containerPointToLatLng(L.point(event.clientX - rect.left, event.clientY - rect.top));
}

function applySurveyMapTool(latlng){
  if(!mapLocked && mapTool !== "delete") return;
  if(mapTool === "pole") addMapPole(latlng);
  else if(mapTool === "tree") addSurveyCircleShape("tree", [latlng]);
  else if(mapTool === "group") return;
  else if(mapTool === "route") addAccessRoutePoint(latlng);
  else if(mapTool === "label") addSurveyTextLabel(latlng);
}

function addSurveyShapeFromStroke(kind, points, wasDrawn=false){
  if(!points.length || !surveyDrawingLayer) return;
  const shapeType = wasDrawn ? closestStrokeShape(points) : "circle";
  if(shapeType === "rectangle") addSurveyRectangleShape(kind, points);
  else addSurveyCircleShape(kind, points);
}

function addSurveyCircleShape(kind, points){
  const center = averageLatLng(points);
  const radius = Math.max(4, Math.min(70, maxPointDistanceM(center, points) || 7));
  const text = nextDrawingLabel(kind);
  const shape = L.circle(center, {
    radius,
    color:"#5fbd65",
    weight:5,
    fill:true,
    fillColor:"#5fbd65",
    fillOpacity:0.01,
    className:"survey-drawing-shape"
  });
  addNumberedDrawing(shape, center, text, "circle", { radius });
}

function addSurveyRectangleShape(kind, points){
  const rect = orientedStrokeRectangle(points);
  const text = nextDrawingLabel(kind);
  const shape = L.polygon(rect.corners, {
    color:"#5fbd65",
    weight:5,
    fill:true,
    fillColor:"#5fbd65",
    fillOpacity:0.01,
    className:"survey-drawing-shape"
  });
  addNumberedDrawing(shape, rect.center, text, "rectangle");
}

function nextDrawingLabel(kind){
  const prefix = kind === "group" ? "G" : "T";
  const key = kind === "group" ? "group" : "tree";
  drawCounters[key] += 1;
  return `${prefix}${drawCounters[key]}`;
}

function addNumberedDrawing(shape, labelPosition, text, type="shape", meta={}){
  const label = L.marker(labelPosition, {
    draggable:false,
    icon:drawingLabelIcon(text)
  });
  const group = L.layerGroup([shape, label]).addTo(surveyDrawingLayer);

function drawingLabelIcon(text){
  return L.divIcon({
    className:"",
    html:`<div class="draw-shape-label">${escapeHtml(text)}</div>`,
    iconSize:[54,34],
    iconAnchor:[27,17]
  });
}

function averageLatLng(points){
  const total = points.reduce((sum, point) => ({
    lat:sum.lat + point.lat,
    lng:sum.lng + point.lng
  }), { lat:0, lng:0 });
  return L.latLng(total.lat / points.length, total.lng / points.length);
}

function maxPointDistanceM(center, points){
  return points.reduce((max, point) => Math.max(max, haversineKm(center.lat, center.lng, point.lat, point.lng) * 1000), 0);
}

function closestStrokeShape(points){
  if(!surveyMap || points.length < 4) return "circle";

  const pixelPoints = points.map((point) => surveyMap.latLngToContainerPoint(point));
  const rect = orientedStrokeMetrics(pixelPoints);
  const ratio = Math.max(rect.width, rect.height) / Math.max(1, Math.min(rect.width, rect.height));
  const distances = pixelPoints.map((point) => Math.hypot(point.x - rect.center.x, point.y - rect.center.y));
  const radius = distances.reduce((sum, value) => sum + value, 0) / distances.length || 1;
  const circleError = distances.reduce((sum, value) => sum + Math.abs(value - radius), 0) / distances.length / radius;
  const rectScale = Math.max(1, Math.min(rect.width, rect.height));
  const rectError = pixelPoints.reduce((sum, point) => {
    const dx = point.x - rect.center.x;
    const dy = point.y - rect.center.y;
    const along = dx * rect.axis.x + dy * rect.axis.y;
    const across = dx * rect.perp.x + dy * rect.perp.y;
    const edgeDistance = Math.min(
      Math.abs(along - rect.minAlong),
      Math.abs(along - rect.maxAlong),
      Math.abs(across - rect.minAcross),
      Math.abs(across - rect.maxAcross)
    );
    return sum + edgeDistance;
  }, 0) / pixelPoints.length / rectScale;

  if(ratio > 1.35) return "rectangle";
  return rectError < circleError * 0.78 ? "rectangle" : "circle";
}

function orientedStrokeRectangle(points){
  if(!surveyMap || points.length < 2){
    const center = points[0] || L.latLng(0, 0);
    return {
      center,
      corners:[center, center, center, center]
    };
  }

  const pixelPoints = points.map((point) => surveyMap.latLngToContainerPoint(point));
  const metrics = orientedStrokeMetrics(pixelPoints);
  const pad = Math.max(4, Math.min(12, Math.min(metrics.width, metrics.height) * 0.12));
  const minAlong = metrics.minAlong - pad;
  const maxAlong = metrics.maxAlong + pad;
  const minAcross = metrics.minAcross - pad;
  const maxAcross = metrics.maxAcross + pad;
  const cornerPixels = [
    pointFromAxes(metrics, minAlong, minAcross),
    pointFromAxes(metrics, maxAlong, minAcross),
    pointFromAxes(metrics, maxAlong, maxAcross),
    pointFromAxes(metrics, minAlong, maxAcross)
  ];

  return {
    center:surveyMap.containerPointToLatLng(L.point(metrics.center.x, metrics.center.y)),
    corners:cornerPixels.map((point) => surveyMap.containerPointToLatLng(L.point(point.x, point.y)))
  };
}

function orientedStrokeMetrics(pixelPoints){
  const center = {
    x:pixelPoints.reduce((sum, point) => sum + point.x, 0) / pixelPoints.length,
    y:pixelPoints.reduce((sum, point) => sum + point.y, 0) / pixelPoints.length
  };
  let xx = 0;
  let yy = 0;
  let xy = 0;

  for(const point of pixelPoints){
    const dx = point.x - center.x;
    const dy = point.y - center.y;
    xx += dx * dx;
    yy += dy * dy;
    xy += dx * dy;
  }

  const angle = 0.5 * Math.atan2(2 * xy, xx - yy);
  const axis = { x:Math.cos(angle), y:Math.sin(angle) };
  const perp = { x:-Math.sin(angle), y:Math.cos(angle) };
  const projections = pixelPoints.map((point) => {
    const dx = point.x - center.x;
    const dy = point.y - center.y;
    return {
      along:dx * axis.x + dy * axis.y,
      across:dx * perp.x + dy * perp.y
    };
  });
  let minAlong = Math.min(...projections.map((point) => point.along));
  let maxAlong = Math.max(...projections.map((point) => point.along));
  let minAcross = Math.min(...projections.map((point) => point.across));
  let maxAcross = Math.max(...projections.map((point) => point.across));

  if(maxAlong - minAlong < 18){
    const mid = (maxAlong + minAlong) / 2;
    minAlong = mid - 9;
    maxAlong = mid + 9;
  }
  if(maxAcross - minAcross < 18){
    const mid = (maxAcross + minAcross) / 2;
    minAcross = mid - 9;
    maxAcross = mid + 9;
  }

  return {
    center,
    axis,
    perp,
    minAlong,
    maxAlong,
    minAcross,
    maxAcross,
    width:maxAlong - minAlong,
    height:maxAcross - minAcross
  };
}

function pointFromAxes(metrics, along, across){
  return {
    x:metrics.center.x + metrics.axis.x * along + metrics.perp.x * across,
    y:metrics.center.y + metrics.axis.y * along + metrics.perp.y * across
  };
}

function strokeBounds(points){
  if(points.length < 2){
    const center = points[0];
    const offset = 0.00006;
    return L.latLngBounds(
      [center.lat - offset, center.lng - offset],
      [center.lat + offset, center.lng + offset]
    );
  }
  return L.latLngBounds(points).pad(0.08);
}

function registerInteractiveDrawing(drawing){
  let lastTapAt = 0;
  let renamedAt = 0;
  const handleRenameTap = (event) => {
    const now = Date.now();
    if(now - lastTapAt < 360){
      L.DomEvent.stop(event);
      renameDrawingItem(drawing);
      renamedAt = now;
      lastTapAt = 0;
      return true;
    }
    lastTapAt = now;
    return false;
  };

  for(const layer of [drawing.shape, drawing.label]){
    layer.on("click", (event) => {
      L.DomEvent.stop(event);
      if(handleRenameTap(event)) return;
      if(mapTool === "delete"){
        removeDrawingItem(drawing);
        return;
      }
      selectDrawing(drawing);
    });
    layer.on("dblclick", (event) => {
      L.DomEvent.stop(event);
      if(Date.now() - renamedAt < 500) return;
      renameDrawingItem(drawing);
      renamedAt = Date.now();
    });
  }

  drawing.label.on("dragstart", () => {
    selectDrawing(drawing);
  });

  drawing.label.on("dragend", () => {
    moveDrawingTo(drawing, drawing.label.getLatLng());
    selectDrawing(drawing);
  });
}

function renameDrawingItem(drawing){
  if(!drawing) return;
  const current = drawing.text || "";
  const next = (window.prompt("Tree/group label", current) || "").trim().toUpperCase();
  if(!next || next === current) return;
  drawing.text = next;
  drawing.label.setIcon(drawingLabelIcon(next));
  selectDrawing(drawing);
  setSurveyMapStatus(`Renamed to ${next}.`);
}

function selectDrawing(drawing){
  if(selectedDrawing?.shape?.setStyle){
    selectedDrawing.shape.setStyle({ color:"#5fbd65", weight:5, fillOpacity:0.01 });
  }

  selectedDrawing = drawing || null;

  if(selectedDrawing?.shape?.setStyle){
    selectedDrawing.shape.setStyle({ color:"#d99a18", weight:6, fillOpacity:0.08 });
    selectedDrawing.shape.bringToFront?.();
    setSurveyMapStatus(`${selectedDrawing.text} selected. One finger moves it. Two fingers resize and rotate it.`);
  }
  syncMapMovementState();
}

function removeDrawingItem(item){
  if(!item || !surveyDrawingLayer) return;
  if(item.group){
    surveyDrawingLayer.removeLayer(item.group);
  }else{
    surveyDrawingLayer.removeLayer(item);
  }
  mapDrawingStack = mapDrawingStack.filter((layer) => layer !== item);
  if(selectedDrawing === item) selectedDrawing = null;
  syncMapMovementState();
  setSurveyMapStatus("Drawing removed.");
}

function moveDrawingTo(drawing, newCenter){
  const oldCenter = drawing.center || drawing.label.getLatLng();
  const dLat = newCenter.lat - oldCenter.lat;
  const dLng = newCenter.lng - oldCenter.lng;

  if(drawing.type === "circle"){
    drawing.shape.setLatLng(newCenter);
  }else if(drawing.shape.getLatLngs){
    const corners = getPolygonCorners(drawing).map((point) => L.latLng(point.lat + dLat, point.lng + dLng));
    drawing.shape.setLatLngs(corners);
  }

  drawing.center = newCenter;
  drawing.label.setLatLng(newCenter);
}

function pointerEventPoint(event){
  return { x:event.clientX, y:event.clientY };
}

function gestureInfo(points){
  if(!points.length) return null;
  const center = {
    x:points.reduce((sum, point) => sum + point.x, 0) / points.length,
    y:points.reduce((sum, point) => sum + point.y, 0) / points.length
  };

  if(points.length < 2){
    return { count:1, center, distance:0, angle:0 };
  }

  const first = points[0];
  const second = points[1];
  return {
    count:points.length,
    center,
    distance:Math.hypot(second.x - first.x, second.y - first.y),
    angle:Math.atan2(second.y - first.y, second.x - first.x)
  };
}

function isDrawingDomTarget(target){
  return Boolean(
    target?.closest?.(".survey-drawing-shape, .draw-shape-label")
  );
}

function moveSelectedDrawingByPixels(dx, dy){
  if(!selectedDrawing || !surveyMap) return;
  const center = selectedDrawing.label.getLatLng();
  const point = surveyMap.latLngToContainerPoint(center);
  const nextCenter = surveyMap.containerPointToLatLng(L.point(point.x + dx, point.y + dy));
  moveDrawingTo(selectedDrawing, nextCenter);
}

function resizeSelectedDrawing(factor){
  if(!selectedDrawing){
    setSurveyMapStatus("Tap a tree/group mark first, then resize it.");
    return;
  }

  resizeDrawing(selectedDrawing, factor);
  setSurveyMapStatus(`${selectedDrawing.text} resized.`);
}

function rotateSelectedDrawing(degrees){
  if(!selectedDrawing){
    setSurveyMapStatus("Tap a tree/group mark first, then rotate it.");
    return;
  }

  rotateDrawing(selectedDrawing, degrees);
  setSurveyMapStatus(`${selectedDrawing.text} rotated.`);
}

function resizeDrawing(drawing, factor){
  if(!drawing || !Number.isFinite(factor) || factor <= 0) return;
  if(drawing.type === "circle"){
    const current = drawing.shape.getRadius();
    drawing.shape.setRadius(Math.max(1, current * factor));
  }else{
    transformDrawingPolygon(drawing, (point, center) => ({
      x:center.x + (point.x - center.x) * factor,
      y:center.y + (point.y - center.y) * factor
    }));
  }
}

function rotateDrawing(drawing, degrees){
  if(!drawing || !Number.isFinite(degrees)) return;
  if(drawing.type === "circle"){
    setSurveyMapStatus("Circles do not need rotating.");
    return;
  }

  const radians = degrees * Math.PI / 180;
  const cos = Math.cos(radians);
  const sin = Math.sin(radians);
  transformDrawingPolygon(drawing, (point, center) => {
    const dx = point.x - center.x;
    const dy = point.y - center.y;
    return {
      x:center.x + dx * cos - dy * sin,
      y:center.y + dx * sin + dy * cos
    };
  });
}

function transformSelectedPolygon(transformer){
  transformDrawingPolygon(selectedDrawing, transformer);
}

function transformDrawingPolygon(drawing, transformer){
  if(!drawing || !surveyMap || !drawing.shape.getLatLngs) return;
  const center = drawing.label.getLatLng();
  const centerPoint = surveyMap.latLngToContainerPoint(center);
  const nextCorners = getPolygonCorners(drawing).map((latlng) => {
    const point = surveyMap.latLngToContainerPoint(latlng);
    const next = transformer(point, centerPoint);
    return surveyMap.containerPointToLatLng(L.point(next.x, next.y));
  });
  drawing.shape.setLatLngs(nextCorners);
  drawing.center = center;
}

function getPolygonCorners(drawing){
  const latLngs = drawing.shape.getLatLngs();
  return Array.isArray(latLngs[0]) ? latLngs[0] : latLngs;
}

function addAccessRoutePoint(latlng){
  activeRoutePoints.push(latlng);

  if(!activeRoute){
    activeRoute = L.polyline([], {
      color:"#f4c430",
      weight:5,
      opacity:0.95
    }).addTo(surveyDrawingLayer);
    activeRoute.on("click", (event) => {
      if(mapTool !== "delete") return;
      L.DomEvent.stop(event);
      removeDrawingItem(activeRoute);
      activeRoute = null;
      activeRoutePoints = [];
      setSurveyMapStatus("Access route removed.");
    });
    mapDrawingStack.push(activeRoute);
  }

  activeRoute.setLatLngs(activeRoutePoints);
}

function finishAccessRoute(){
  activeRoute = null;
  activeRoutePoints = [];
  setSurveyMapStatus("Access route finished.");
}

function addSurveyTextLabel(latlng){
  const text = window.prompt("Label text");
  if(!text) return;
  const marker = L.marker(latlng, {
    draggable:true,
    icon:L.divIcon({
      className:"",
      html:`<div class="text-label">${escapeHtml(text)}</div>`,
      iconSize:[120,26],
      iconAnchor:[0,13]
    })
  }).addTo(surveyDrawingLayer);
  marker.on("click", (event) => {
    if(mapTool !== "delete") return;
    L.DomEvent.stop(event);
    removeDrawingItem(marker);
    setSurveyMapStatus("Label removed.");
  });
