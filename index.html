<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tree Survey Locator</title>

<style>
body { font-family: Arial; background:#0f2318; color:#f0ebe0; text-align:center; padding:20px; }
button { padding:15px 25px; font-size:18px; border-radius:12px; cursor:pointer; }
.card { margin:15px auto; padding:15px; border:1px solid #444; border-radius:10px; max-width:500px; }
</style>
</head>

<body>

<h2>🌳 Tree Survey Locator</h2>

<button onclick="locate()">📍 Locate</button>

<div id="out"></div>

<script>
function haversine(lat1,lon1,lat2,lon2){
  const R=6371;
  const dLat=(lat2-lat1)*Math.PI/180;
  const dLon=(lon2-lon1)*Math.PI/180;
  const a=
    Math.sin(dLat/2)**2+
    Math.cos(lat1*Math.PI/180)*
    Math.cos(lat2*Math.PI/180)*
    Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

// Simple OS grid approx (reliable lightweight version)
function latLonToGrid(lat, lon){
  const e = Math.floor((lon + 2) * 5);
  const n = Math.floor((lat - 49) * 5);
  return `Grid approx: ${e} / ${n}`;
}

// What3Words
async function getW3W(lat, lon){
  const key = localStorage.getItem("w3w_key");
  if(!key) return "No API key set";
  try{
    const r = await fetch(`https://api.what3words.com/v3/convert-to-3wa?coordinates=${lat},${lon}&key=${key}`);
    const d = await r.json();
    return d.words ? `///${d.words}` : "Not found";
  }catch(e){
    return "W3W error";
  }
}

// Nearest hospital (A&E)
async function getAE(lat, lon){
  const q = `[out:json];
  node["amenity"="hospital"](around:20000,${lat},${lon});
  out;`;

  const r = await fetch("https://overpass-api.de/api/interpreter?data=" + encodeURIComponent(q));
  const d = await r.json();

  if(!d.elements.length) return "No hospital found";

  let best=null, min=9999;

  for(let el of d.elements){
    const dist = haversine(lat,lon,el.lat,el.lon);
    if(dist<min){
      min=dist;
      best=el;
    }
  }

  return best?.tags?.name + " (" + min.toFixed(1) + "km)";
}

async function locate(){
  const out = document.getElementById("out");
  out.innerHTML = "Locating...";

  navigator.geolocation.getCurrentPosition(async (pos)=>{
    const lat = pos.coords.latitude;
    const lon = pos.coords.longitude;

    const grid = latLonToGrid(lat, lon);
    const w3w = await getW3W(lat, lon);
    const ae = await getAE(lat, lon);

    out.innerHTML = `
      <div class="card">📍 ${lat.toFixed(5)}, ${lon.toFixed(5)}</div>
      <div class="card">🗺 ${grid}</div>
      <div class="card">/// ${w3w}</div>
      <div class="card">🏥 ${ae}</div>
    `;
  },
  (err)=>{
    out.innerHTML = "Location error: " + err.message;
  });
}
</script>

</body>
</html>
