<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tree Survey Locator</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
  --forest:#102219;
  --panel:#172d22;
  --leaf:#3f7d51;
  --amber:#d99a18;
  --cream:#f3eddf;
  --muted:#a8bba8;
  --line:rgba(255,255,255,.14);
  --danger:#d96a5f;
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  background:linear-gradient(180deg,#102219 0%,#07120d 100%);
  color:var(--cream);
  font-family:Georgia,"Times New Roman",serif;
}
header{
  padding:18px 16px;
  border-bottom:1px solid var(--line);
}
h1,h2,p{margin:0}
h1{font-size:22px}
main{
  width:min(100%,720px);
  margin:auto;
  padding:18px 14px 34px;
}
.hero{
  display:grid;
  gap:14px;
  justify-items:center;
  padding:20px 0 22px;
  text-align:center;
}
#locateBtn{
  width:138px;
  height:138px;
  border-radius:50%;
  border:2px solid var(--amber);
  background:var(--leaf);
  color:var(--cream);
  font-size:26px;
  font-weight:700;
  cursor:pointer;
  box-shadow:0 20px 45px rgba(0,0,0,.32);
}
#locateBtn:disabled{opacity:.75;cursor:wait}
#status{
  min-height:24px;
  color:var(--amber);
  font-family:Arial,sans-serif;
  font-size:13px;
  font-weight:700;
  letter-spacing:1.6px;
  text-transform:uppercase;
}
.grid{
  display:grid;
  gap:12px;
}
.card{
  border:1px solid var(--line);
  border-radius:8px;
  background:rgba(255,255,255,.045);
  padding:15px;
}
.card h2{
  margin-bottom:7px;
  color:var(--amber);
  font-family:Arial,sans-serif;
  font-size:12px;
  letter-spacing:1.2px;
  text-transform:uppercase;
}
.value{
  font-size:22px;
  line-height:1.28;
  overflow-wrap:anywhere;
}
.detail{
  margin-top:6px;
  color:var(--muted);
  font-family:Arial,sans-serif;
  font-size:14px;
  line-height:1.35;
}
.actions{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:8px;
  margin-top:12px;
}
button.small,a.small{
  min-height:40px;
  border:1px solid var(--line);
  border-radius:8px;
  background:rgba(255,255,255,.07);
  color:var(--cream);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:8px 10px;
  text-decoration:none;
  font:700 14px Arial,sans-serif;
  cursor:pointer;
}
input.text-field,textarea.text-field{
  width:100%;
  border:1px solid var(--line);
  border-radius:8px;
  background:rgba(255,255,255,.07);
  color:var(--cream);
  padding:10px;
  font:16px Arial,sans-serif;
}
input.file-field{
  width:100%;
  color:var(--cream);
  font:14px Arial,sans-serif;
}
textarea.text-field{
  min-height:118px;
  resize:vertical;
  line-height:1.35;
}
.field-row{
  display:grid;
  gap:8px;
  margin-top:12px;
}
.search-panel{
  margin-bottom:14px;
}
.search-form{
  display:grid;
  grid-template-columns:1fr auto;
  gap:8px;
  align-items:center;
}
.search-form .small{
  min-width:96px;
}
.match-list{
  display:grid;
  gap:10px;
  margin-top:12px;
}
.field-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
}
.map-panel{
  display:grid;
  gap:10px;
  margin-top:12px;
}
#w3wMap{
  width:100%;
  height:300px;
  border:1px solid var(--line);
  border-radius:8px;
  overflow:hidden;
  background:#d8dfcf;
}
.leaflet-container{
  font-family:Arial,sans-serif;
}
.marker-row{
  display:grid;
  grid-template-columns:1fr auto;
  gap:8px;
  align-items:center;
}
.marker-row .small{
  min-width:110px;
}
a.primary,button.primary{
  border-color:var(--amber);
  background:var(--amber);
  color:#191204;
}
.danger{border-color:rgba(217,106,95,.7)}
.hidden{display:none}
.asset-line{
  margin-top:5px;
  font-family:Arial,sans-serif;
  font-size:14px;
  line-height:1.38;
}
.asset-line strong{color:var(--cream)}
@media(max-width:520px){
  .actions{grid-template-columns:1fr}
  .search-form{grid-template-columns:1fr}
  .marker-row{grid-template-columns:1fr}
  .field-grid{grid-template-columns:1fr}
  .value{font-size:20px}
}
</style>
</head>
<body>
<header>
  <h1>Tree Survey Locator</h1>
</header>

<main>
  <section class="hero">
    <button id="locateBtn" type="button">LOCATE</button>
    <div id="status">Tap to locate</div>
  </section>

  <section class="card search-panel">
    <h2>Span data</h2>
    <div class="field-row">
      <input class="file-field" id="spanFileInput" type="file" accept=".csv,.xlsx,.xls" multiple>
    </div>
    <div class="detail" id="spanDataStatus">No span spreadsheet imported on this device.</div>
    <div class="actions">
      <button class="small primary" type="button" onclick="importSpanFiles()">Import spreadsheet</button>
      <button class="small" type="button" onclick="clearSpanData()">Clear data</button>
    </div>
  </section>

  <section class="card search-panel">
    <h2>Find span</h2>
    <form class="search-form" onsubmit="searchSpan(event)">
      <input class="text-field" id="spanSearchInput" type="search" placeholder="Span, pole, feeder, circuit, primary, grid ref">
      <button class="small primary" type="submit">Search</button>
    </form>
    <div class="detail" id="spanSearchStatus">Search your uploaded LV/HV span data.</div>
    <div class="match-list" id="spanSearchResults"></div>
  </section>

  <section id="results" class="grid"></section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script>
<script>
const locateBtn = document.getElementById("locateBtn");
const statusEl = document.getElementById("status");
const resultsEl = document.getElementById("results");
const spanFileInput = document.getElementById("spanFileInput");
const spanDataStatus = document.getElementById("spanDataStatus");
const spanSearchInput = document.getElementById("spanSearchInput");
const spanSearchStatus = document.getElementById("spanSearchStatus");
const spanSearchResults = document.getElementById("spanSearchResults");
let currentReport = null;
let currentSpanMatches = [];
let currentLocateMatches = [];
let w3wMap = null;
let w3wMarker = null;
let w3wMarkerPosition = null;
window.SPAN_DATA = [];
window.AE_DATA = [];

locateBtn.addEventListener("click", locate);
loadStoredSpanData();
loadBundledAEData();

function setBusy(isBusy, text){
  locateBtn.disabled = isBusy;
  locateBtn.textContent = isBusy ? "..." : "LOCATE";
  statusEl.textContent = text;
}

function escapeHtml(value){
  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function card(id, title, value, detail="", actions=""){
  return `
    <article class="card" id="${id}">
      <h2>${escapeHtml(title)}</h2>
      <div class="value">${escapeHtml(value)}</div>
      ${detail ? `<div class="detail">${escapeHtml(detail)}</div>` : ""}
      ${actions}
    </article>
  `;
}

function actions(items){
  return `<div class="actions">${items.join("")}</div>`;
}

function linkButton(label, href, primary=false){
  return `<a class="small ${primary ? "primary" : ""}" href="${href}" target="_blank" rel="noopener">${escapeHtml(label)}</a>`;
}

function copyButton(label, value){
  const encodedValue = encodeURIComponent(value).replaceAll("'","%27");
  return `<button class="small" type="button" onclick="copyText('${encodedValue}')">${escapeHtml(label)}</button>`;
}

async function copyText(encoded){
  const text = decodeURIComponent(encoded);
  try{
    await navigator.clipboard.writeText(text);
    statusEl.textContent = "Copied";
  }catch{
    statusEl.textContent = "Could not copy";
  }
}

function loadStoredSpanData(){
  try{
    const stored = localStorage.getItem("treeSurveySpanData");
    if(!stored){
      updateSpanDataStatus();
      return;
    }

    const rows = JSON.parse(stored);
    window.SPAN_DATA = Array.isArray(rows) ? rows.map(repairSpanPosition).filter((span) => isUsableCoordinate(span.latitude, span.longitude)) : [];
    updateSpanDataStatus();
  }catch{
    window.SPAN_DATA = [];
    updateSpanDataStatus("Saved span data could not be read. Re-import the spreadsheet.");
  }
}

function updateSpanDataStatus(message=""){
  const count = Array.isArray(window.SPAN_DATA) ? window.SPAN_DATA.length : 0;
  spanDataStatus.textContent = message || (count
    ? `${count} spans imported.`
    : "No span spreadsheet imported on this device.");
  spanSearchStatus.textContent = count
    ? "Search your imported LV/HV span data."
    : "Import a spreadsheet before searching spans.";
}

async function importSpanFiles(){
  const files = [...spanFileInput.files];

  if(!files.length){
    updateSpanDataStatus("Choose one or more CSV/XLSX files first.");
    return;
  }

  try{
    const imported = [];

    for(const file of files){
      const rows = await readSpanFile(file);
      imported.push(...rows.map(normaliseImportedSpan).filter(Boolean));
    }

    if(!imported.length){
      updateSpanDataStatus("No usable span rows found in those files.");
      return;
    }

    window.SPAN_DATA = imported;
    localStorage.setItem("treeSurveySpanData", JSON.stringify(imported));
    currentSpanMatches = [];
    spanSearchResults.innerHTML = "";
    updateSpanDataStatus(`${imported.length} spans imported.`);
  }catch(error){
    updateSpanDataStatus(error.message || "Could not import that spreadsheet.");
  }
}

function clearSpanData(){
  localStorage.removeItem("treeSurveySpanData");
  window.SPAN_DATA = [];
  currentSpanMatches = [];
  spanSearchResults.innerHTML = "";
  updateSpanDataStatus("Span data cleared from this device.");
}

async function loadBundledAEData(){
  try{
    const response = await fetch("ae-data.csv", { cache:"no-store" });
    if(!response.ok) return;

    const rows = parseCsvRows(await response.text());
    window.AE_DATA = rows.map(normaliseAERow).filter(Boolean);
  }catch{
    window.AE_DATA = [];
  }
}

function normaliseAERow(row){
  const hospital = {
    name:getRowValue(row, ["Name", "Hospital", "Hospital Name", "A&E Name", "AE Name"]),
    address:getRowValue(row, ["Address", "Full Address"]),
    phone:getRowValue(row, ["Phone", "Telephone", "Telephone Number"]),
    mapsLink:getRowValue(row, ["Maps Link", "Google Maps", "Map Link"]),
    latitude:parseCoordinateNumber(getRowValue(row, ["Latitude", "Lat", "latitude", "lat"])),
    longitude:parseCoordinateNumber(getRowValue(row, ["Longitude", "Lon", "Lng", "longitude", "lon", "lng"]))
  };

  if(!hospital.name || !isUsableCoordinate(hospital.latitude, hospital.longitude)) return null;
  return hospital;
}

async function readSpanFile(file){
  const extension = file.name.split(".").pop().toLowerCase();

  if(extension === "csv"){
    return parseCsvRows(await file.text());
  }

  if(extension === "xlsx" || extension === "xls"){
    if(!window.XLSX) throw new Error("Spreadsheet reader is still loading. Try again in a few seconds.");

    const data = await file.arrayBuffer();
    const workbook = XLSX.read(data, { type:"array" });
    return workbook.SheetNames.flatMap((sheetName) => {
      const sheet = workbook.Sheets[sheetName];
      return XLSX.utils.sheet_to_json(sheet, { defval:"" });
    });
  }

  throw new Error("Use a CSV, XLSX, or XLS file.");
}

function parseCsvRows(text){
  const rows = [];
  let row = [];
  let field = "";
  let quoted = false;

  for(let i = 0; i < text.length; i++){
    const char = text[i];
    const next = text[i + 1];

    if(quoted){
      if(char === '"' && next === '"'){
        field += '"';
        i++;
      }else if(char === '"'){
        quoted = false;
      }else{
        field += char;
      }
    }else if(char === '"'){
      quoted = true;
    }else if(char === ","){
      row.push(field);
      field = "";
    }else if(char === "\n"){
      row.push(field);
      rows.push(row);
      row = [];
      field = "";
    }else if(char !== "\r"){
      field += char;
    }
  }

  if(field || row.length){
    row.push(field);
    rows.push(row);
  }

  const headers = (rows.shift() || []).map((header) => String(header).trim());
  return rows
    .filter((values) => values.some((value) => String(value).trim()))
    .map((values) => Object.fromEntries(headers.map((header, index) => [header, values[index] || ""])));
}

function normaliseImportedSpan(row){
  const span = {
    primaryNo:getRowValue(row, ["Primary No", "PrimaryNo", "primaryNo"]),
    primaryName:getRowValue(row, ["Primary Name", "PrimaryName", "primaryName"]),
    hvFeeder:getRowValue(row, ["HV Feeder", "HVFeeder", "hvFeeder"]),
    feederName:getRowValue(row, ["Feeder Name", "FeederName", "feederName"]),
    distNo:getRowValue(row, ["Dist No", "DistNo", "distNo"]),
    circuitName:getRowValue(row, ["circuitName", "Circuit Name", "CircuitName"]),
    voltage:getRowValue(row, ["V", "Voltage", "voltage"]),
    span:getRowValue(row, ["Span", "span", "spanId"]),
    toPole:getRowValue(row, ["ToPole", "To Pole", "toPole"]),
    externalReference:getRowValue(row, ["ExternalReference", "External Reference", "externalReference"]),
    gridRef:getRowValue(row, ["Grid Ref", "GridRef", "gridRef"]),
    latitude:parseCoordinateNumber(getRowValue(row, ["latitude", "Latitude", "lat"])),
    longitude:parseCoordinateNumber(getRowValue(row, ["longitude", "Longitude", "lon", "lng"]))
  };

  if(!span.span && !span.toPole && !span.gridRef) return null;
  const repaired = repairSpanPosition(span);
  if(!isUsableCoordinate(repaired.latitude, repaired.longitude)) return null;
  return repaired;
}

function getRowValue(row, names){
  const keys = Object.keys(row);
  const wanted = names.map((name) => normaliseHeader(name));
  const match = keys.find((key) => wanted.includes(normaliseHeader(key)));
  return match ? String(row[match]).trim() : "";
}

function normaliseHeader(value){
  return String(value).toLowerCase().replace(/[^a-z0-9]+/g, "");
}

function updateW3W(){
  if(!currentReport) return;
  const input = document.getElementById("w3wInput");
  currentReport.w3w = input ? input.value.trim() : "";
}

function saveW3WKey(){
  const input = document.getElementById("w3wKeyInput");
  const key = input ? input.value.trim() : "";
  if(!key){
    localStorage.removeItem("treeSurveyW3WKey");
    setW3WStatus("API key removed from this device.");
    return;
  }
  localStorage.setItem("treeSurveyW3WKey", key);
  setW3WStatus("API key saved on this device.");
}

function getW3WKey(){
  const input = document.getElementById("w3wKeyInput");
  return (input && input.value.trim()) || localStorage.getItem("treeSurveyW3WKey") || "";
}

function setW3WStatus(message){
  const status = document.getElementById("w3wStatus");
  if(status) status.textContent = message;
}

function setW3WValue(value){
  const valueEl = document.getElementById("w3wValue");
  if(valueEl) valueEl.textContent = value || "No w3w yet";
  if(currentReport) currentReport.w3w = value || "";
}

async function convertMarkerToW3W(){
  if(!w3wMarkerPosition){
    setW3WStatus("No marker position available yet.");
    return;
  }

  const key = getW3WKey();
  if(!key){
    setW3WStatus("Paste your what3words API key first.");
    return;
  }

  saveW3WKey();
  setW3WStatus("Converting marker position...");

  const { lat, lng } = w3wMarkerPosition;
  const url = `https://api.what3words.com/v3/convert-to-3wa?coordinates=${encodeURIComponent(`${lat},${lng}`)}&language=en&format=json&key=${encodeURIComponent(key)}`;

  try{
    const response = await fetch(url);
    const data = await response.json();

    if(!response.ok || data.error){
      const message = data?.error?.message || "what3words did not return a result.";
      throw new Error(message);
    }

    const words = data.words ? `///${data.words}` : "";
    if(!words) throw new Error("No what3words address returned.");

    setW3WValue(words);
    setW3WStatus(`Marker converted near ${data.nearestPlace || "selected position"}.`);
  }catch(error){
    setW3WStatus(error.message || "Could not convert marker position.");
  }
}

function copyCurrentW3W(){
  const words = currentReport?.w3w || document.getElementById("w3wValue")?.textContent || "";
  if(!words || words === "No w3w yet"){
    setW3WStatus("Convert the marker before copying.");
    return;
  }
  copyText(encodeURIComponent(words));
}

function resetW3WMarker(){
  if(!currentReport) return;
  setW3WMarker(currentReport.lat, currentReport.lon, true);
  setW3WValue("");
  setW3WStatus("Marker reset to the grid reference location.");
}

function searchSpan(event){
  event.preventDefault();
  const query = spanSearchInput.value.trim();

  if(!query){
    spanSearchStatus.textContent = "Enter a span, pole, feeder, circuit, primary, or grid reference.";
    spanSearchResults.innerHTML = "";
    return;
  }

  const matches = findSpanMatches(query, 5);
  currentSpanMatches = matches;

  if(!matches.length){
    spanSearchStatus.textContent = `No matches found for "${query}".`;
    currentSpanMatches = [];
    spanSearchResults.innerHTML = "";
    return;
  }

  spanSearchStatus.textContent = `${matches.length} best match${matches.length === 1 ? "" : "es"} for "${query}".`;
  spanSearchResults.innerHTML = matches.map((span, index) => renderSpanSearchResult(span, index)).join("");
}

function findSpanMatches(query, limit=5){
  const terms = normaliseSearchText(query).split(" ").filter(Boolean);
  const spans = Array.isArray(window.SPAN_DATA) ? window.SPAN_DATA : [];
  if(!terms.length || !spans.length) return [];

  return spans
    .map((span) => ({ ...span, score: scoreSpanMatch(span, terms) }))
    .filter((span) => span.score > 0)
    .sort((a, b) => b.score - a.score || String(a.span).localeCompare(String(b.span)))
    .slice(0, limit);
}

function scoreSpanMatch(span, terms){
  const weightedFields = [
    [span.span, 90],
    [span.toPole, 70],
    [span.externalReference, 70],
    [span.gridRef, 60],
    [span.hvFeeder, 50],
    [span.circuitName, 45],
    [span.distNo, 40],
    [span.primaryNo, 35],
    [span.primaryName, 30],
    [span.feederName, 25],
    [span.voltage, 15]
  ];

  let score = 0;
  const voltage = normaliseSearchText(span.voltage || "");
  const compactSpan = compactSearchText(span.span || "");
  const compactExternal = compactSearchText(span.externalReference || "");
  const spanBaseDigits = String(span.span || "").split("/")[0].replace(/\D/g, "");

  for(const term of terms){
    let termScore = 0;
    const compactTerm = compactSearchText(term);

    if(voltage.startsWith("lv") && lvTailMatches(spanBaseDigits, compactTerm)){
      termScore = Math.max(termScore, 260);
    }

    if(voltage.startsWith("hv") && compactTerm.length >= 2 && compactSpan.startsWith(compactTerm)){
      termScore = Math.max(termScore, compactTerm.length >= 4 ? 260 : 210);
    }

    if(compactTerm && (compactSpan === compactTerm || compactExternal === compactTerm)){
      termScore = Math.max(termScore, 300);
    }

    for(const [value, weight] of weightedFields){
      const text = normaliseSearchText(value || "");
      const compactText = compactSearchText(value || "");
      if(!text) continue;
      if(text === term) termScore = Math.max(termScore, weight * 3);
      else if(compactText === compactTerm) termScore = Math.max(termScore, weight * 3);
      else if(text.startsWith(term)) termScore = Math.max(termScore, weight * 2);
      else if(compactText.startsWith(compactTerm)) termScore = Math.max(termScore, weight * 2);
      else if(text.includes(term)) termScore = Math.max(termScore, weight);
      else if(compactText.includes(compactTerm)) termScore = Math.max(termScore, weight);
    }
    if(termScore === 0) return 0;
    score += termScore;
  }

  return score;
}

function normaliseSearchText(value){
  return String(value)
    .toLowerCase()
    .replace(/[^a-z0-9]+/g, " ")
    .trim();
}

function compactSearchText(value){
  return String(value)
    .toLowerCase()
    .replace(/[^a-z0-9]+/g, "");
}

function lvTailMatches(spanBaseDigits, term){
  if(!spanBaseDigits || !/^\d{1,4}$/.test(term)) return false;
  const tail = spanBaseDigits.slice(-4);
  return stripLeadingZeroes(tail) === stripLeadingZeroes(term) || tail === term.padStart(4, "0");
}

function stripLeadingZeroes(value){
  return String(value).replace(/^0+/, "") || "0";
}

function renderSpanSearchResult(span, index){
  const isLv = normaliseSearchText(span.voltage || "").startsWith("lv");
  const mainValue = isLv && span.toPole
    ? `LV To Pole ${span.toPole}`
    : `${span.voltage || "Unknown"} ${span.span || "Unknown span"}`;
  const detail = isLv
    ? `${span.voltage || "LV"} span ${span.span || "Unknown span"}`
    : "";

  return `
    <article class="card" id="span-search-${index}">
      <h2>Span match</h2>
      <div class="value">${escapeHtml(mainValue)}</div>
      ${detail ? `<div class="detail">${escapeHtml(detail)}</div>` : ""}
      <div class="asset-line"><strong>Primary:</strong> ${escapeHtml(`${span.primaryNo || ""} ${span.primaryName || ""}`.trim() || "Not listed")}</div>
      <div class="asset-line"><strong>HV feeder:</strong> ${escapeHtml(span.hvFeeder || "Not listed")}</div>
      <div class="asset-line"><strong>Dist/circuit:</strong> ${escapeHtml([span.distNo, span.circuitName].filter(Boolean).join(" / ") || "Not listed")}</div>
      <div class="asset-line"><strong>To pole:</strong> ${escapeHtml(span.toPole || "Not listed")}</div>
      ${actions([`<button class="small primary" type="button" onclick="useSpanFromSearch(${index})">Use grid ref</button>`, copyButton("Copy span info", spanCopyText(span))])}
    </article>
  `;
}

function useSpanFromSearch(index){
  const span = currentSpanMatches[index];
  if(!span) return;
  fillFromSpanRecord(span);
}

function useSpanFromLocate(index){
  const span = currentLocateMatches[index];
  if(!span) return;
  fillFromSpanRecord(span);
}

function fillFromSpanRecord(span){
  const position = getSpanMapPosition(span);

  if(!position){
    spanSearchStatus.textContent = "That span has no usable map position. Add latitude/longitude or grid ref.";
    return;
  }

  const selectedSpan = { ...span, latitude:position.lat, longitude:position.lon };
  const gridRef = span.gridRef ? formatSpreadsheetGridRef(span.gridRef) : latLonToOSGrid(position.lat, position.lon);

  renderLocationCards({
    lat: position.lat,
    lon: position.lon,
    accuracy: "",
    gridRef,
    gridDetail: "Six-figure grid reference from the selected span.",
    nearestSpan: selectedSpan,
    spanTitle: Number.isFinite(span.distanceM) && span.distanceM > 0 ? "Selected nearby span" : "Selected span from search",
    sourceNote: "Filled from your uploaded span spreadsheet."
  });

  spanSearchStatus.textContent = `Filled from ${span.voltage || "span"} ${span.span || ""}.`;
  resultsEl.scrollIntoView({ behavior:"smooth", block:"start" });
}

function locate(){
  if(!navigator.geolocation){
    resultsEl.innerHTML = card("error","Error","Location is not supported by this browser.","Use a modern mobile browser over HTTPS.");
    return;
  }

  setBusy(true,"Locating...");
  resultsEl.innerHTML = "";

  navigator.geolocation.getCurrentPosition(showLocation, showError, {
    enableHighAccuracy:true,
    timeout:12000,
    maximumAge:0
  });
}

async function showLocation(pos){
  const lat = pos.coords.latitude;
  const lon = pos.coords.longitude;
  const accuracy = Math.round(pos.coords.accuracy);
  const nearestSpans = findNearestSpans(lat, lon, 5);
  currentLocateMatches = nearestSpans;

  setBusy(false, nearestSpans.length ? "Choose span" : "No span data");
  renderNearestSpanChoices(nearestSpans, accuracy);
}

function renderNearestSpanChoices(spans, accuracy){
  if(!Array.isArray(window.SPAN_DATA) || !window.SPAN_DATA.length){
    resultsEl.innerHTML = card(
      "nearest-spans",
      "Nearest spans",
      "No span data imported",
      "Import your span spreadsheet, then press locate again."
    );
    return;
  }

  if(!spans.length){
    resultsEl.innerHTML = card(
      "nearest-spans",
      "Nearest spans",
      "No nearby spans found",
      "The imported rows need latitude and longitude before locate can rank them."
    );
    return;
  }

  resultsEl.innerHTML = `
    <article class="card" id="nearest-spans">
      <h2>Nearest spans</h2>
      <div class="value">Choose the span</div>
      <div class="detail">Device accuracy about ${escapeHtml(accuracy || "unknown")} m. The w3w marker will start from the span you choose.</div>
    </article>
    <section class="match-list">
      ${spans.map((span, index) => renderNearestSpanChoice(span, index)).join("")}
    </section>
  `;
}

function renderNearestSpanChoice(span, index){
  const isLv = normaliseSearchText(span.voltage || "").startsWith("lv");
  const mainValue = isLv && span.toPole
    ? `LV To Pole ${span.toPole}`

    <article class="card" id="nearest-span-${index}">

      <div class="asset-line"><strong>Primary:</strong> ${escapeHtml(primarySubValue(span) || "Not listed")}</div>
      <div class="asset-line"><strong>HV feeder:</strong> ${escapeHtml(span.hvFeeder || "Not listed")}</div>
      <div class="asset-line"><strong>Dist/circuit:</strong> ${escapeHtml([span.distNo, span.circuitName].filter(Boolean).join(" / ") || "Not listed")}</div>
      <div class="asset-line"><strong>To pole:</strong> ${escapeHtml(span.toPole || "Not listed")}</div>

function renderLocationCards(options){
  const lat = options.lat;
  const lon = options.lon;
  const accuracy = options.accuracy;
  const coords = `${lat.toFixed(5)}, ${lon.toFixed(5)}`;

  currentReport = {
    lat,
    lon,
    gridRef: options.gridRef,
    coords,
    accuracy,
    w3w:"",
    nearestSpan: options.nearestSpan
  };

  resultsEl.innerHTML = [
    renderSpanCard(options.nearestSpan, options.spanTitle),

      "grid-ref",
      "Grid reference",

function renderAECard(lat, lon){
  const ae = findNearestAE(lat, lon);

  const mapsQuery = ae.mapsLink || `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(`${ae.name} ${ae.address}`.trim())}`;
  const directions = `https://www.google.com/maps/dir/?api=1&origin=${lat},${lon}&destination=${encodeURIComponent(`${ae.name} ${ae.address}`.trim())}`;

    ae.name,
    ae.address || "Address not listed",

  ].join("\n");

      ${actions([

      ].filter(Boolean))}

function findNearestAE(lat, lon){
  const hospitals = Array.isArray(window.AE_DATA) ? window.AE_DATA : [];
  return hospitals
    .filter((hospital) => Number.isFinite(hospital.latitude) && Number.isFinite(hospital.longitude))
    .map((hospital) => ({
      ...hospital,
      distanceKm:haversineKm(lat, lon, hospital.latitude, hospital.longitude)
    }))
    .sort((a, b) => a.distanceKm - b.distanceKm)[0] || null;
}

function initW3WMap(lat, lon, gridRef, attempts=0){
  w3wMarkerPosition = { lat, lng:lon };

  if(!window.L){
    if(attempts > 12){
      setW3WStatus("Map could not load. Check signal, then refresh and try again.");
      return;
    }
    setW3WStatus("Map is loading. Try the marker in a few seconds.");
    setTimeout(() => initW3WMap(lat, lon, gridRef, attempts + 1), 500);
    return;
  }

  if(w3wMap){
    w3wMap.remove();
    w3wMap = null;
    w3wMarker = null;
  }

  const mapEl = document.getElementById("w3wMap");
  if(!mapEl) return;

  w3wMap = L.map(mapEl, {
    zoomControl:true,
    attributionControl:true
  }).setView([lat, lon], 17);

  const streetLayer = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom:19,
    attribution:"&copy; OpenStreetMap"
  });

  const satelliteLayer = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {
    maxZoom:19,
    attribution:"Sources: Esri, Maxar, Earthstar Geographics, and the GIS User Community"
  }).addTo(w3wMap);

  L.control.layers({
    "Satellite": satelliteLayer,
    "Street map": streetLayer
  }, null, {
    collapsed:false,
    position:"topright"
  }).addTo(w3wMap);

  w3wMarker = L.marker([lat, lon], {
    draggable:true,
    title:"Emergency access point"
  }).addTo(w3wMap);

  w3wMarker.bindPopup("Emergency access point").openPopup();

  w3wMarker.on("dragend", () => {
    const position = w3wMarker.getLatLng();
    setW3WMarker(position.lat, position.lng);
    setW3WValue("");
    setW3WStatus("Marker moved. Convert again for the access-point w3w.");
  });

  w3wMap.on("click", (event) => {
    setW3WMarker(event.latlng.lat, event.latlng.lng, true);
    setW3WValue("");
    setW3WStatus("Marker moved. Convert again for the access-point w3w.");
  });

  setTimeout(() => w3wMap.invalidateSize(), 100);
  setW3WStatus(`Marker starts at ${gridRef}. Tap or drag it to the emergency access point.`);
}

function setW3WMarker(lat, lng, pan=false){
  w3wMarkerPosition = { lat, lng };
  if(w3wMarker) w3wMarker.setLatLng([lat, lng]);
  if(w3wMap && pan) w3wMap.setView([lat, lng], w3wMap.getZoom());
}

function findNearestSpans(lat, lon, limit=5){
  const spans = Array.isArray(window.SPAN_DATA) ? window.SPAN_DATA : [];
  return spans
    .map((span) => ({ span, position:getSpanMapPosition(span) }))
    .filter((item) => item.position)
    .map((item) => ({
      ...item.span,
      latitude:item.position.lat,
      longitude:item.position.lon,
      distanceM: Math.round(haversineKm(lat, lon, item.position.lat, item.position.lon) * 1000)
    }))
    .sort((a, b) => a.distanceM - b.distanceM)
    .slice(0, limit);
}

    `mf-${id}`,

    displayValue,

    value ? actions([copyButton("Copy", value)]) : ""
  );

function primarySubValue(span){
  return `${span.primaryNo || ""} ${cleanPrimaryName(span.primaryName)}`.trim();
}

function cleanPrimaryName(name){
  return String(name || "")
    .replace(/\s*132\s*\/\s*11\s*kV\s*DUMMY\s*/ig, "")
    .replace(/\s*132\s*\/\s*11\s*kv\s*dummy\s*/ig, "")
    .replace(/\s+/g, " ")
    .trim();
}

function spanCopyText(span){
  if(!span) return "";
  return [
    `Voltage: ${span.voltage || ""}`,
    `Span: ${span.span || ""}`,
    `To pole: ${span.toPole || ""}`,
    `Primary: ${primarySubValue(span)}`,
    `HV feeder: ${span.hvFeeder || ""}`,
    `Dist No: ${span.distNo || ""}`,
    `Circuit: ${span.circuitName || ""}`,
    Number.isFinite(span.distanceM) && span.distanceM > 0 ? `Distance from GPS: ${span.distanceM} m` : ""
  ].filter(Boolean).join("\n");
}

function formatSpreadsheetGridRef(gridRef){
  const compact = compactSearchText(gridRef);
  const match = compact.match(/^([a-z]{2})(\d{3})\d{0,3}(\d{3})\d{0,3}$/i);
  if(!match) return String(gridRef).replace(/\s+/g, "");
  return `${match[1].toUpperCase()}${match[2]}${match[3]}`;
}

function parseCoordinateNumber(value){
  const text = String(value ?? "").trim();
  if(!text) return NaN;
  const number = Number(text.replace(",", "."));
  return Number.isFinite(number) ? number : NaN;
}

function isUsableCoordinate(lat, lon){
  return Number.isFinite(lat) &&
    Number.isFinite(lon) &&
    !(Math.abs(lat) < 0.0001 && Math.abs(lon) < 0.0001) &&
    lat >= 49 &&
    lat <= 61 &&
    lon >= -9 &&
    lon <= 2;
}

function repairSpanPosition(span){
  if(!span) return span;
  const latitude = parseCoordinateNumber(span.latitude);
  const longitude = parseCoordinateNumber(span.longitude);
  if(isUsableCoordinate(latitude, longitude)){
    return { ...span, latitude, longitude, coordinateSource:span.coordinateSource || "latlon" };
  }

  const gridPosition = osGridRefToLatLon(span.gridRef);
  if(gridPosition){
    return { ...span, latitude:gridPosition.lat, longitude:gridPosition.lon, coordinateSource:"gridRef" };
  }

  return { ...span, latitude, longitude };
}

function getSpanMapPosition(span){
  if(!span) return null;
  if(isUsableCoordinate(span.latitude, span.longitude)){
    return { lat:Number(span.latitude), lon:Number(span.longitude) };
  }
  return osGridRefToLatLon(span.gridRef);
}

function osGridRefToLatLon(gridRef){
  const eastNorth = osGridRefToEastNorth(gridRef);
  return eastNorth ? eastNorthToLatLon(eastNorth.easting, eastNorth.northing) : null;
}

function osGridRefToEastNorth(gridRef){
  const compact = compactSearchText(gridRef).toUpperCase();
  const match = compact.match(/^([A-Z]{2})(\d{3})\d{0,3}(\d{3})\d{0,3}$/);
  if(!match) return null;

  let l1 = match[1].charCodeAt(0) - 65;
  let l2 = match[1].charCodeAt(1) - 65;
  if(l1 > 7) l1--;
  if(l2 > 7) l2--;

  const e100k = ((l1 - 2) % 5) * 5 + (l2 % 5);
  const n100k = (19 - Math.floor(l1 / 5) * 5) - Math.floor(l2 / 5);
  if(e100k < 0 || e100k > 6 || n100k < 0 || n100k > 12) return null;

  return {
    easting:e100k * 100000 + Number(match[2]) * 100 + 50,
    northing:n100k * 100000 + Number(match[3]) * 100 + 50
  };
}

function showError(err){
  setBusy(false,"Tap to locate");
  resultsEl.innerHTML = card(
    "error",
    "Location error",
    err.message,
    "Check browser location permission and make sure the site is opened with HTTPS.",
    "",
    "danger"
  );
}

function haversineKm(lat1, lon1, lat2, lon2){
  const r = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 +
    Math.cos(lat1*Math.PI/180) *
    Math.cos(lat2*Math.PI/180) *
    Math.sin(dLon/2)**2;
  return 2 * r * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function eastNorthToLatLon(easting, northing){
  const deg = Math.PI / 180;
  const a = 6377563.396;
  const b = 6356256.909;
  const f0 = 0.9996012717;
  const lat0 = 49 * deg;
  const lon0 = -2 * deg;
  const n0 = -100000;
  const e0 = 400000;
  const e2 = 1 - (b*b)/(a*a);
  const n = (a-b)/(a+b);

  let lat = lat0;
  let meridionalArc = 0;

  do{
    lat = (northing - n0 - meridionalArc) / (a * f0) + lat;
    const ma = (1+n+(5/4)*n*n+(5/4)*n*n*n) * (lat-lat0);
    const mb = (3*n+3*n*n+(21/8)*n*n*n) * Math.sin(lat-lat0) * Math.cos(lat+lat0);
    const mc = ((15/8)*n*n+(15/8)*n*n*n) * Math.sin(2*(lat-lat0)) * Math.cos(2*(lat+lat0));
    const md = (35/24)*n*n*n * Math.sin(3*(lat-lat0)) * Math.cos(3*(lat+lat0));
    meridionalArc = b * f0 * (ma - mb + mc - md);
  }while(Math.abs(northing - n0 - meridionalArc) >= 0.00001);

  const sinLat = Math.sin(lat);
  const cosLat = Math.cos(lat);
  const tanLat = Math.tan(lat);
  const nu = a * f0 / Math.sqrt(1 - e2 * sinLat * sinLat);
  const rho = a * f0 * (1-e2) / Math.pow(1 - e2 * sinLat * sinLat, 1.5);
  const eta2 = nu / rho - 1;
  const dE = easting - e0;
  const tan2 = tanLat * tanLat;
  const tan4 = tan2 * tan2;
  const tan6 = tan4 * tan2;
  const secLat = 1 / cosLat;

  const vii = tanLat / (2 * rho * nu);
  const viii = tanLat / (24 * rho * Math.pow(nu, 3)) * (5 + 3*tan2 + eta2 - 9*tan2*eta2);
  const ix = tanLat / (720 * rho * Math.pow(nu, 5)) * (61 + 90*tan2 + 45*tan4);
  const x = secLat / nu;
  const xi = secLat / (6 * Math.pow(nu, 3)) * (nu/rho + 2*tan2);
  const xii = secLat / (120 * Math.pow(nu, 5)) * (5 + 28*tan2 + 24*tan4);
  const xiia = secLat / (5040 * Math.pow(nu, 7)) * (61 + 662*tan2 + 1320*tan4 + 720*tan6);

  const osgbLat = lat - vii*dE*dE + viii*Math.pow(dE, 4) - ix*Math.pow(dE, 6);
  const osgbLon = lon0 + x*dE - xi*Math.pow(dE, 3) + xii*Math.pow(dE, 5) - xiia*Math.pow(dE, 7);

  return osgb36ToWgs84(osgbLat, osgbLon);
}

function osgb36ToWgs84(lat, lon){
  const deg = Math.PI / 180;
  const a = 6377563.396;
  const b = 6356256.909;
  const e2 = 1 - (b*b)/(a*a);
  const sinLat = Math.sin(lat);
  const cosLat = Math.cos(lat);
  const nu = a / Math.sqrt(1 - e2 * sinLat * sinLat);

  const x1 = nu * cosLat * Math.cos(lon);
  const y1 = nu * cosLat * Math.sin(lon);
  const z1 = (1 - e2) * nu * sinLat;

  const tx = 446.448;
  const ty = -125.157;
  const tz = 542.06;
  const s = -20.4894e-6;
  const rx = (0.1502 / 3600) * deg;
  const ry = (0.2470 / 3600) * deg;
  const rz = (0.8421 / 3600) * deg;

  const x2 = tx + (1+s)*x1 - rz*y1 + ry*z1;
  const y2 = ty + rz*x1 + (1+s)*y1 - rx*z1;
  const z2 = tz - ry*x1 + rx*y1 + (1+s)*z1;

  const wgsA = 6378137;
  const wgsB = 6356752.3141;
  const wgsE2 = 1 - (wgsB*wgsB)/(wgsA*wgsA);
  const p = Math.sqrt(x2*x2 + y2*y2);
  let phi = Math.atan2(z2, p * (1-wgsE2));
  let previous;

  do{
    previous = phi;
    const nu2 = wgsA / Math.sqrt(1 - wgsE2 * Math.sin(phi) * Math.sin(phi));
    phi = Math.atan2(z2 + wgsE2 * nu2 * Math.sin(phi), p);
  }while(Math.abs(phi - previous) > 1e-12);

  return {
    lat:phi / deg,
    lon:Math.atan2(y2, x2) / deg
  };
}

function latLonToOSGrid(lat, lon){
  const deg = Math.PI / 180;
  const a = 6377563.396;
  const b = 6356256.909;
  const f0 = 0.9996012717;
  const lat0 = 49 * deg;
  const lon0 = -2 * deg;
  const n0 = -100000;
  const e0 = 400000;
  const e2 = 1 - (b*b)/(a*a);
  const n = (a-b)/(a+b);
  const wgsA = 6378137;
  const wgsB = 6356752.3141;
  const wgsE2 = 1 - (wgsB*wgsB)/(wgsA*wgsA);
  const phi = lat * deg;
  const lambda = lon * deg;
  const sinPhi = Math.sin(phi);
  const cosPhi = Math.cos(phi);
  const nu = wgsA / Math.sqrt(1 - wgsE2 * sinPhi * sinPhi);
  const x1 = nu * cosPhi * Math.cos(lambda);
  const y1 = nu * cosPhi * Math.sin(lambda);
  const z1 = (1 - wgsE2) * nu * sinPhi;
  const tx = -446.448;
  const ty = 125.157;
  const tz = -542.06;
  const s = 20.4894e-6;
  const rx = (-0.1502 / 3600) * deg;
  const ry = (-0.2470 / 3600) * deg;
  const rz = (-0.8421 / 3600) * deg;
  const x2 = tx + (1+s)*x1 - rz*y1 + ry*z1;
  const y2 = ty + rz*x1 + (1+s)*y1 - rx*z1;
  const z2 = tz - ry*x1 + rx*y1 + (1+s)*z1;
  const p = Math.sqrt(x2*x2 + y2*y2);
  let phi2 = Math.atan2(z2, p * (1-e2));
  let previous;

  do{
    previous = phi2;
    const nu2 = a / Math.sqrt(1 - e2 * Math.sin(phi2) * Math.sin(phi2));
    phi2 = Math.atan2(z2 + e2 * nu2 * Math.sin(phi2), p);
  }while(Math.abs(phi2 - previous) > 1e-10);

  const lambda2 = Math.atan2(y2, x2);
  const sinPhi2 = Math.sin(phi2);
  const cosPhi2 = Math.cos(phi2);
  const tanPhi2 = Math.tan(phi2);
  const nu2 = a*f0 / Math.sqrt(1 - e2*sinPhi2*sinPhi2);
  const rho = a*f0*(1-e2) / Math.pow(1 - e2*sinPhi2*sinPhi2, 1.5);
  const eta2 = nu2/rho - 1;
  const ma = (1+n+5*n*n/4+5*n*n*n/4) * (phi2-lat0);
  const mb = (3*n+3*n*n+21*n*n*n/8) * Math.sin(phi2-lat0) * Math.cos(phi2+lat0);
  const mc = (15*n*n/8+15*n*n*n/8) * Math.sin(2*(phi2-lat0)) * Math.cos(2*(phi2+lat0));
  const md = 35*n*n*n/24 * Math.sin(3*(phi2-lat0)) * Math.cos(3*(phi2+lat0));
  const m = b*f0*(ma-mb+mc-md);
  const dLon = lambda2-lon0;
  const northing = m+n0 + (nu2/2*sinPhi2*cosPhi2)*dLon**2 + (nu2/24*sinPhi2*cosPhi2**3*(5-tanPhi2**2+9*eta2))*dLon**4;
  const easting = e0 + nu2*cosPhi2*dLon + (nu2/6*cosPhi2**3*(nu2/rho-tanPhi2**2))*dLon**3;
  return formatGridRef(easting, northing);
}

function formatGridRef(easting, northing){
  if(!Number.isFinite(easting) || !Number.isFinite(northing)) return "Unavailable";
  const e100k = Math.floor(easting / 100000);
  const n100k = Math.floor(northing / 100000);
  if(e100k < 0 || e100k > 6 || n100k < 0 || n100k > 12) return "Outside OS Grid";

  let l1 = (19-n100k) - (19-n100k)%5 + Math.floor((e100k+10)/5);
  let l2 = (19-n100k)*5%25 + e100k%5;
  if(l1 > 7) l1++;
  if(l2 > 7) l2++;

  const letters = String.fromCharCode(l1+65) + String.fromCharCode(l2+65);
  const e = Math.floor((easting % 100000) / 100).toString().padStart(3,"0");
  const n = Math.floor((northing % 100000) / 100).toString().padStart(3,"0");
  return `${letters}${e}${n}`;
}
