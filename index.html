<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tree Survey Locator</title>
<style>
:root{
  --forest:#102219;
  --panel:#172d22;
  --leaf:#3f7d51;
  --amber:#d99a18;
  --cream:#f3eddf;
  --muted:#a8bba8;
  --line:rgba(255,255,255,.14);
  --danger:#d96a5f;
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  background:linear-gradient(180deg,#102219 0%,#07120d 100%);
  color:var(--cream);
  font-family:Georgia,"Times New Roman",serif;
}
header{
  padding:18px 16px;
  border-bottom:1px solid var(--line);
}
h1,h2,p{margin:0}
h1{font-size:22px}
main{
  width:min(100%,720px);
  margin:auto;
  padding:18px 14px 34px;
}
.hero{
  display:grid;
  gap:14px;
  justify-items:center;
  padding:20px 0 22px;
  text-align:center;
}
#locateBtn{
  width:138px;
  height:138px;
  border-radius:50%;
  border:2px solid var(--amber);
  background:var(--leaf);
  color:var(--cream);
  font-size:26px;
  font-weight:700;
  cursor:pointer;
  box-shadow:0 20px 45px rgba(0,0,0,.32);
}
#locateBtn:disabled{opacity:.75;cursor:wait}
#status{
  min-height:24px;
  color:var(--amber);
  font-family:Arial,sans-serif;
  font-size:13px;
  font-weight:700;
  letter-spacing:1.6px;
  text-transform:uppercase;
}
.grid{
  display:grid;
  gap:12px;
}
.card{
  border:1px solid var(--line);
  border-radius:8px;
  background:rgba(255,255,255,.045);
  padding:15px;
}
.card h2{
  margin-bottom:7px;
  color:var(--amber);
  font-family:Arial,sans-serif;
  font-size:12px;
  letter-spacing:1.2px;
  text-transform:uppercase;
}
.value{
  font-size:22px;
  line-height:1.28;
  overflow-wrap:anywhere;
}
.detail{
  margin-top:6px;
  color:var(--muted);
  font-family:Arial,sans-serif;
  font-size:14px;
  line-height:1.35;
}
.actions{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:8px;
  margin-top:12px;
}
button.small,a.small{
  min-height:40px;
  border:1px solid var(--line);
  border-radius:8px;
  background:rgba(255,255,255,.07);
  color:var(--cream);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:8px 10px;
  text-decoration:none;
  font:700 14px Arial,sans-serif;
  cursor:pointer;
}
input.text-field,textarea.text-field{
  width:100%;
  border:1px solid var(--line);
  border-radius:8px;
  background:rgba(255,255,255,.07);
  color:var(--cream);
  padding:10px;
  font:16px Arial,sans-serif;
}
textarea.text-field{
  min-height:118px;
  resize:vertical;
  line-height:1.35;
}
.field-row{
  display:grid;
  gap:8px;
  margin-top:12px;
}
.search-panel{
  margin-bottom:14px;
}
.search-form{
  display:grid;
  grid-template-columns:1fr auto;
  gap:8px;
  align-items:center;
}
.search-form .small{
  min-width:96px;
}
.match-list{
  display:grid;
  gap:10px;
  margin-top:12px;
}
a.primary,button.primary{
  border-color:var(--amber);
  background:var(--amber);
  color:#191204;
}
.danger{border-color:rgba(217,106,95,.7)}
.hidden{display:none}
.asset-line{
  margin-top:5px;
  font-family:Arial,sans-serif;
  font-size:14px;
  line-height:1.38;
}
.asset-line strong{color:var(--cream)}
@media(max-width:520px){
  .actions{grid-template-columns:1fr}
  .search-form{grid-template-columns:1fr}
  .value{font-size:20px}
}
</style>
</head>
<body>
<header>
  <h1>Tree Survey Locator</h1>
</header>

<main>
  <section class="hero">
    <button id="locateBtn" type="button">LOCATE</button>
    <div id="status">Tap to locate</div>
  </section>

  <section class="card search-panel">
    <h2>Find span</h2>
    <form class="search-form" onsubmit="searchSpan(event)">
      <input class="text-field" id="spanSearchInput" type="search" placeholder="Span, pole, feeder, circuit, primary, grid ref">
      <button class="small primary" type="submit">Search</button>
    </form>
    <div class="detail" id="spanSearchStatus">Search your uploaded LV/HV span data.</div>
    <div class="match-list" id="spanSearchResults"></div>
  </section>

  <section id="results" class="grid"></section>
</main>

<script src="span-data-current.js"></script>
<script>
const locateBtn = document.getElementById("locateBtn");
const statusEl = document.getElementById("status");
const resultsEl = document.getElementById("results");
const spanSearchInput = document.getElementById("spanSearchInput");
const spanSearchStatus = document.getElementById("spanSearchStatus");
const spanSearchResults = document.getElementById("spanSearchResults");
let currentReport = null;
let currentSpanMatches = [];

locateBtn.addEventListener("click", locate);

function setBusy(isBusy, text){
  locateBtn.disabled = isBusy;
  locateBtn.textContent = isBusy ? "..." : "LOCATE";
  statusEl.textContent = text;
}

function escapeHtml(value){
  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function card(id, title, value, detail="", actions=""){
  return `
    <article class="card" id="${id}">
      <h2>${escapeHtml(title)}</h2>
      <div class="value">${escapeHtml(value)}</div>
      ${detail ? `<div class="detail">${escapeHtml(detail)}</div>` : ""}
      ${actions}
    </article>
  `;
}

function actions(items){
  return `<div class="actions">${items.join("")}</div>`;
}

function linkButton(label, href, primary=false){
  return `<a class="small ${primary ? "primary" : ""}" href="${href}" target="_blank" rel="noopener">${escapeHtml(label)}</a>`;
}

function copyButton(label, value){
  return `<button class="small" type="button" onclick="copyText('${encodeURIComponent(value)}')">${escapeHtml(label)}</button>`;
}

async function copyText(encoded){
  const text = decodeURIComponent(encoded);
  try{
    await navigator.clipboard.writeText(text);
    statusEl.textContent = "Copied";
  }catch{
    statusEl.textContent = "Could not copy";
  }
}

function updateW3W(){
  if(!currentReport) return;
  const input = document.getElementById("w3wInput");
  currentReport.w3w = input ? input.value.trim() : "";
}

function searchSpan(event){
  event.preventDefault();
  const query = spanSearchInput.value.trim();

  if(!query){
    spanSearchStatus.textContent = "Enter a span, pole, feeder, circuit, primary, or grid reference.";
    spanSearchResults.innerHTML = "";
    return;
  }

  const matches = findSpanMatches(query, 5);
  currentSpanMatches = matches;

  if(!matches.length){
    spanSearchStatus.textContent = `No matches found for "${query}".`;
    currentSpanMatches = [];
    spanSearchResults.innerHTML = "";
    return;
  }

  spanSearchStatus.textContent = `${matches.length} best match${matches.length === 1 ? "" : "es"} for "${query}".`;
  spanSearchResults.innerHTML = matches.map((span, index) => renderSpanSearchResult(span, index)).join("");
}

function findSpanMatches(query, limit=5){
  const terms = normaliseSearchText(query).split(" ").filter(Boolean);
  const spans = Array.isArray(window.SPAN_DATA) ? window.SPAN_DATA : [];
  if(!terms.length || !spans.length) return [];

  return spans
    .map((span) => ({ ...span, score: scoreSpanMatch(span, terms) }))
    .filter((span) => span.score > 0)
    .sort((a, b) => b.score - a.score || String(a.span).localeCompare(String(b.span)))
    .slice(0, limit);
}

function scoreSpanMatch(span, terms){
  const weightedFields = [
    [span.span, 90],
    [span.toPole, 70],
    [span.externalReference, 70],
    [span.gridRef, 60],
    [span.hvFeeder, 50],
    [span.circuitName, 45],
    [span.distNo, 40],
    [span.primaryNo, 35],
    [span.primaryName, 30],
    [span.feederName, 25],
    [span.voltage, 15]
  ];

  let score = 0;
  const voltage = normaliseSearchText(span.voltage || "");
  const compactSpan = compactSearchText(span.span || "");
  const compactExternal = compactSearchText(span.externalReference || "");
  const spanBaseDigits = String(span.span || "").split("/")[0].replace(/\D/g, "");

  for(const term of terms){
    let termScore = 0;
    const compactTerm = compactSearchText(term);

    if(voltage.startsWith("lv") && lvTailMatches(spanBaseDigits, compactTerm)){
      termScore = Math.max(termScore, 260);
    }

    if(voltage.startsWith("hv") && compactTerm.length >= 2 && compactSpan.startsWith(compactTerm)){
      termScore = Math.max(termScore, compactTerm.length >= 4 ? 260 : 210);
    }

    if(compactTerm && (compactSpan === compactTerm || compactExternal === compactTerm)){
      termScore = Math.max(termScore, 300);
    }

    for(const [value, weight] of weightedFields){
      const text = normaliseSearchText(value || "");
      const compactText = compactSearchText(value || "");
      if(!text) continue;
      if(text === term) termScore = Math.max(termScore, weight * 3);
      else if(compactText === compactTerm) termScore = Math.max(termScore, weight * 3);
      else if(text.startsWith(term)) termScore = Math.max(termScore, weight * 2);
      else if(compactText.startsWith(compactTerm)) termScore = Math.max(termScore, weight * 2);
      else if(text.includes(term)) termScore = Math.max(termScore, weight);
      else if(compactText.includes(compactTerm)) termScore = Math.max(termScore, weight);
    }
    if(termScore === 0) return 0;
    score += termScore;
  }

  return score;
}

function normaliseSearchText(value){
  return String(value)
    .toLowerCase()
    .replace(/[^a-z0-9]+/g, " ")
    .trim();
}

function compactSearchText(value){
  return String(value)
    .toLowerCase()
    .replace(/[^a-z0-9]+/g, "");
}

function lvTailMatches(spanBaseDigits, term){
  if(!spanBaseDigits || !/^\d{1,4}$/.test(term)) return false;
  const tail = spanBaseDigits.slice(-4);
  return stripLeadingZeroes(tail) === stripLeadingZeroes(term) || tail === term.padStart(4, "0");
}

function stripLeadingZeroes(value){
  return String(value).replace(/^0+/, "") || "0";
}

function renderSpanSearchResult(span, index){
  return `
    <article class="card" id="span-search-${index}">
      <h2>Span match</h2>
      <div class="value">${escapeHtml(`${span.voltage || "Unknown"} ${span.span || "Unknown span"}`)}</div>
      <div class="detail">${escapeHtml(span.gridRef || "No grid ref")}</div>
      <div class="asset-line"><strong>Primary:</strong> ${escapeHtml(`${span.primaryNo || ""} ${span.primaryName || ""}`.trim() || "Not listed")}</div>
      <div class="asset-line"><strong>HV feeder:</strong> ${escapeHtml(span.hvFeeder || "Not listed")}</div>
      <div class="asset-line"><strong>Dist/circuit:</strong> ${escapeHtml([span.distNo, span.circuitName].filter(Boolean).join(" / ") || "Not listed")}</div>
      <div class="asset-line"><strong>To pole:</strong> ${escapeHtml(span.toPole || "Not listed")}</div>
      ${actions([`<button class="small primary" type="button" onclick="useSpanFromSearch(${index})">Use this span</button>`, copyButton("Copy span info", spanCopyText(span))])}
    </article>
  `;
}

function useSpanFromSearch(index){
  const span = currentSpanMatches[index];
  if(!span) return;
  fillFromSpanRecord(span);
}

function fillFromSpanRecord(span){
  if(!Number.isFinite(span.latitude) || !Number.isFinite(span.longitude)){
    spanSearchStatus.textContent = "That span has no latitude/longitude in the spreadsheet.";
    return;
  }

  const selectedSpan = { ...span, distanceM: 0 };
  const gridRef = span.gridRef ? formatSpreadsheetGridRef(span.gridRef) : latLonToOSGrid(span.latitude, span.longitude);

  renderLocationCards({
    lat: span.latitude,
    lon: span.longitude,
    accuracy: "",
    gridRef,
    gridDetail: span.gridRef ? `Spreadsheet grid ref: ${span.gridRef}` : "Grid reference calculated from spreadsheet coordinates.",
    nearestSpan: selectedSpan,
    spanTitle: "Selected span from search",
    sourceNote: "Filled from your uploaded span spreadsheet."
  });

  spanSearchStatus.textContent = `Filled from ${span.voltage || "span"} ${span.span || ""}.`;
  resultsEl.scrollIntoView({ behavior:"smooth", block:"start" });
}

function locate(){
  if(!navigator.geolocation){
    resultsEl.innerHTML = card("error","Error","Location is not supported by this browser.","Use a modern mobile browser over HTTPS.");
    return;
  }

  setBusy(true,"Locating...");
  resultsEl.innerHTML = "";

  navigator.geolocation.getCurrentPosition(showLocation, showError, {
    enableHighAccuracy:true,
    timeout:12000,
    maximumAge:0
  });
}

async function showLocation(pos){
  const lat = pos.coords.latitude;
  const lon = pos.coords.longitude;
  const accuracy = Math.round(pos.coords.accuracy);
  const gridRef = latLonToOSGrid(lat, lon);
  const nearestSpan = findNearestSpan(lat, lon);

  renderLocationCards({
    lat,
    lon,
    accuracy,
    gridRef,
    gridDetail:"Give this to the team or write it on the survey record.",
    nearestSpan,
    spanTitle:"Nearest span from your data",
    sourceNote:"Filled from device GPS."
  });

  setBusy(false,"Ready");
  findFreeAE(lat, lon);
}

function renderLocationCards(options){
  const lat = options.lat;
  const lon = options.lon;
  const accuracy = options.accuracy;
  const coords = `${lat.toFixed(5)}, ${lon.toFixed(5)}`;
  const mapsSearch = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent("nearest A&E hospital near " + lat + "," + lon)}`;
  const nhsFinder = "https://www.nhs.uk/nhs-services/urgent-and-emergency-care-services/find-urgent-and-emergency-care-services/";
  const directions = `https://www.google.com/maps/dir/?api=1&origin=${lat},${lon}&destination=${encodeURIComponent("nearest A&E hospital")}`;
  const w3wUrl = "https://what3words.com/";

  currentReport = {
    gridRef: options.gridRef,
    coords,
    accuracy,
    w3w:"",
    nearestSpan: options.nearestSpan
  };

  resultsEl.innerHTML = [
    card(
      "grid-ref",
      "Grid reference",
      options.gridRef,
      options.gridDetail || "",
      actions([copyButton("Copy grid ref", options.gridRef)])
    ),
    card(
      "coords",
      "GPS coordinates",
      coords,
      accuracy === "" ? (options.sourceNote || "") : `Accuracy about ${accuracy} m.`,
      actions([copyButton("Copy GPS", coords), linkButton("Open position", `https://www.google.com/maps/search/?api=1&query=${lat},${lon}`)])
    ),
    `
      <article class="card" id="w3w">
        <h2>what3words</h2>
        <div class="value">Paste ///words here</div>
        <div class="detail">Free mode opens what3words for you, then you can copy it back into MightyFields.</div>
        <div class="field-row">
          <input class="text-field" id="w3wInput" type="text" placeholder="///filled.count.soap" oninput="updateW3W()">
        </div>
        ${actions([linkButton("Open what3words", w3wUrl, true), copyButton("Copy GPS for w3w", coords)])}
      </article>
    `,
    renderSpanCard(options.nearestSpan, options.spanTitle),
    card(
      "ae",
      "Nearest A&E",
      "Open a live finder",
      "Free mode does not wait for slow databases. These buttons use your location immediately.",
      actions([linkButton("Google Maps A&E", mapsSearch, true), linkButton("NHS finder", nhsFinder), linkButton("Directions", directions)])
    )
  ].join("");
}

function findNearestSpan(lat, lon){
  const spans = Array.isArray(window.SPAN_DATA) ? window.SPAN_DATA : [];
  return spans
    .filter((span) => Number.isFinite(span.latitude) && Number.isFinite(span.longitude))
    .map((span) => ({
      ...span,
      distanceM: Math.round(haversineKm(lat, lon, span.latitude, span.longitude) * 1000)
    }))
    .sort((a, b) => a.distanceM - b.distanceM)[0] || null;
}

function renderSpanCard(span, title="Nearest span from your data"){
  if(!span){
    return card("span","Nearest span","No span data loaded","Add span-data-current.js beside this page to enable span autofill.");
  }

  return `
    <article class="card" id="span">
      <h2>${escapeHtml(title)}</h2>
      <div class="value">${escapeHtml(`${span.voltage || "Unknown"} ${span.span || "Unknown span"}`)}</div>
      <div class="detail">${escapeHtml(`${span.distanceM} m away | ${span.gridRef || "No grid ref"}`)}</div>
      <div class="asset-line"><strong>Primary:</strong> ${escapeHtml(`${span.primaryNo || ""} ${span.primaryName || ""}`.trim() || "Not listed")}</div>
      <div class="asset-line"><strong>HV feeder:</strong> ${escapeHtml(span.hvFeeder || "Not listed")}</div>
      <div class="asset-line"><strong>Dist/circuit:</strong> ${escapeHtml([span.distNo, span.circuitName].filter(Boolean).join(" / ") || "Not listed")}</div>
      <div class="asset-line"><strong>To pole:</strong> ${escapeHtml(span.toPole || "Not listed")}</div>
      ${actions([copyButton("Copy span info", spanCopyText(span))])}
    </article>
  `;
}

function spanCopyText(span){
  if(!span) return "";
  return [
    `Voltage: ${span.voltage || ""}`,
    `Span: ${span.span || ""}`,
    `To pole: ${span.toPole || ""}`,
    `Primary: ${span.primaryNo || ""} ${span.primaryName || ""}`.trim(),
    `HV feeder: ${span.hvFeeder || ""}`,
    `Dist No: ${span.distNo || ""}`,
    `Circuit: ${span.circuitName || ""}`,
    `Asset grid ref: ${span.gridRef || ""}`,
    `Distance from GPS: ${span.distanceM} m`
  ].join("\n");
}

function formatSpreadsheetGridRef(gridRef){
  const compact = compactSearchText(gridRef);
  const match = compact.match(/^([a-z]{2})(\d{3})\d{0,3}(\d{3})\d{0,3}$/i);
  if(!match) return String(gridRef);
  return `${match[1].toUpperCase()} ${match[2]} ${match[3]}`;
}

function showError(err){
  setBusy(false,"Tap to locate");
  resultsEl.innerHTML = card(
    "error",
    "Location error",
    err.message,
    "Check browser location permission and make sure the site is opened with HTTPS.",
    "",
    "danger"
  );
}

async function findFreeAE(lat, lon){
  const aeCard = document.getElementById("ae");
  if(!aeCard) return;

  const endpoints = [
    "https://overpass-api.de/api/interpreter",
    "https://overpass.kumi.systems/api/interpreter"
  ];
  const radiuses = [30000, 60000, 100000];

  aeCard.querySelector(".detail").textContent = "Checking public map data. Use the buttons if you need it immediately.";

  for(const radius of radiuses){
    const query = buildAEQuery(lat, lon, radius);

    try{
      const responses = await Promise.allSettled(
        endpoints.map((endpoint) => fetchWithTimeout(endpoint, query, 9000))
      );
      const elements = responses
        .filter((result) => result.status === "fulfilled")
        .flatMap((result) => result.value.elements || []);
      const best = bestAEFromElements(elements, lat, lon);

      if(best){
        renderFoundAE(aeCard, best, lat, lon);
        return;
      }
    }catch{
      // Try the next radius before giving up.
    }
  }

  aeCard.querySelector(".detail").textContent = "No A&E found in public map data. Use Google Maps or NHS finder.";
}

function buildAEQuery(lat, lon, radius){
  return `
    [out:json][timeout:8];
    (
      nwr["amenity"="hospital"]["emergency"~"^(yes|designated)$"](around:${radius},${lat},${lon});
      nwr["healthcare"="hospital"]["emergency"~"^(yes|designated)$"](around:${radius},${lat},${lon});
      nwr["healthcare"="emergency_ward"](around:${radius},${lat},${lon});
      nwr["emergency"="emergency_ward_entrance"](around:${radius},${lat},${lon});
      nwr["amenity"="hospital"]["name"~"A&E|A & E|Accident|Emergency|Casualty",i](around:${radius},${lat},${lon});
      nwr["healthcare"="hospital"]["name"~"A&E|A & E|Accident|Emergency|Casualty",i](around:${radius},${lat},${lon});
    );
    out center tags;
  `;
}

function bestAEFromElements(elements, lat, lon){
  const seen = new Set();

  return elements
    .map((el) => normaliseAE(el, lat, lon))
    .filter(Boolean)
    .filter((ae) => {
      const key = `${ae.name.toLowerCase()}|${ae.lat.toFixed(3)}|${ae.lon.toFixed(3)}`;
      if(seen.has(key)) return false;
      seen.add(key);
      return true;
    })
    .sort((a, b) => a.distanceKm - b.distanceKm || b.quality - a.quality)[0] || null;
}

function renderFoundAE(aeCard, ae, lat, lon){
  const mapsQuery = ae.address === "Address not listed" ? `${ae.name} near ${lat},${lon}` : `${ae.name} ${ae.address}`;
  const maps = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(mapsQuery)}`;
  const directions = `https://www.google.com/maps/dir/?api=1&origin=${lat},${lon}&destination=${encodeURIComponent(mapsQuery)}`;

  aeCard.innerHTML = `
    <h2>Nearest A&E from public map data</h2>
    <div class="value">${escapeHtml(ae.name)}</div>
    <div class="detail">${escapeHtml(`${ae.address} | ${ae.phone} | ${ae.distanceKm.toFixed(1)} km away`)}</div>
    ${actions([linkButton("Open in Maps", maps, true), linkButton("Directions", directions), linkButton("NHS finder", "https://www.nhs.uk/nhs-services/urgent-and-emergency-care-services/find-urgent-and-emergency-care-services/")])}
  `;
}

async function fetchWithTimeout(endpoint, query, ms){
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), ms);

  try{
    const response = await fetch(endpoint, {
      method:"POST",
      body:"data=" + encodeURIComponent(query),
      headers:{ "Content-Type":"application/x-www-form-urlencoded;charset=UTF-8" },
      signal:controller.signal
    });
    if(!response.ok) throw new Error("Map lookup failed");
    return await response.json();
  }finally{
    clearTimeout(timeout);
  }
}

function normaliseAE(el, lat, lon){
  const placeLat = el.lat || el.center?.lat;
  const placeLon = el.lon || el.center?.lon;
  if(!placeLat || !placeLon || !el.tags) return null;

  const tags = el.tags;
  const address = [
    tags["addr:full"],
    tags["addr:housename"],
    tags["addr:housenumber"],
    tags["addr:street"],
    tags["addr:city"],
    tags["addr:postcode"]
  ].filter(Boolean).join(", ");
  const name = tags.name || tags.operator || tags.brand || "Unnamed A&E";
  const emergency = String(tags.emergency || "").toLowerCase();
  const healthcare = String(tags.healthcare || "").toLowerCase();
  const amenity = String(tags.amenity || "").toLowerCase();
  const nameLooksEmergency = /a&e|a & e|accident|emergency|casualty/i.test(name);
  let quality = 0;

  if(amenity === "hospital" || healthcare === "hospital") quality += 80;
  if(emergency === "yes" || emergency === "designated") quality += 70;
  if(healthcare === "emergency_ward" || emergency === "emergency_ward_entrance") quality += 55;
  if(nameLooksEmergency) quality += 35;
  if(address) quality += 8;
  if(tags.phone || tags["contact:phone"]) quality += 8;

  return {
    name,
    address:address || "Address not listed",
    phone:tags.phone || tags["contact:phone"] || "Phone not listed",
    distanceKm:haversineKm(lat, lon, placeLat, placeLon),
    lat:placeLat,
    lon:placeLon,
    quality
  };
}

function haversineKm(lat1, lon1, lat2, lon2){
  const r = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 +
    Math.cos(lat1*Math.PI/180) *
    Math.cos(lat2*Math.PI/180) *
    Math.sin(dLon/2)**2;
  return 2 * r * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function latLonToOSGrid(lat, lon){
  const deg = Math.PI / 180;
  const a = 6377563.396;
  const b = 6356256.909;
  const f0 = 0.9996012717;
  const lat0 = 49 * deg;
  const lon0 = -2 * deg;
  const n0 = -100000;
  const e0 = 400000;
  const e2 = 1 - (b*b)/(a*a);
  const n = (a-b)/(a+b);
  const wgsA = 6378137;
  const wgsB = 6356752.3141;
  const wgsE2 = 1 - (wgsB*wgsB)/(wgsA*wgsA);
  const phi = lat * deg;
  const lambda = lon * deg;
  const sinPhi = Math.sin(phi);
  const cosPhi = Math.cos(phi);
  const nu = wgsA / Math.sqrt(1 - wgsE2 * sinPhi * sinPhi);
  const x1 = nu * cosPhi * Math.cos(lambda);
  const y1 = nu * cosPhi * Math.sin(lambda);
  const z1 = (1 - wgsE2) * nu * sinPhi;
  const tx = -446.448;
  const ty = 125.157;
  const tz = -542.06;
  const s = 20.4894e-6;
  const rx = (-0.1502 / 3600) * deg;
  const ry = (-0.2470 / 3600) * deg;
  const rz = (-0.8421 / 3600) * deg;
  const x2 = tx + (1+s)*x1 - rz*y1 + ry*z1;
  const y2 = ty + rz*x1 + (1+s)*y1 - rx*z1;
  const z2 = tz - ry*x1 + rx*y1 + (1+s)*z1;
  const p = Math.sqrt(x2*x2 + y2*y2);
  let phi2 = Math.atan2(z2, p * (1-e2));
  let previous;

  do{
    previous = phi2;
    const nu2 = a / Math.sqrt(1 - e2 * Math.sin(phi2) * Math.sin(phi2));
    phi2 = Math.atan2(z2 + e2 * nu2 * Math.sin(phi2), p);
  }while(Math.abs(phi2 - previous) > 1e-10);

  const lambda2 = Math.atan2(y2, x2);
  const sinPhi2 = Math.sin(phi2);
  const cosPhi2 = Math.cos(phi2);
  const tanPhi2 = Math.tan(phi2);
  const nu2 = a*f0 / Math.sqrt(1 - e2*sinPhi2*sinPhi2);
  const rho = a*f0*(1-e2) / Math.pow(1 - e2*sinPhi2*sinPhi2, 1.5);
  const eta2 = nu2/rho - 1;
  const ma = (1+n+5*n*n/4+5*n*n*n/4) * (phi2-lat0);
  const mb = (3*n+3*n*n+21*n*n*n/8) * Math.sin(phi2-lat0) * Math.cos(phi2+lat0);
  const mc = (15*n*n/8+15*n*n*n/8) * Math.sin(2*(phi2-lat0)) * Math.cos(2*(phi2+lat0));
  const md = 35*n*n*n/24 * Math.sin(3*(phi2-lat0)) * Math.cos(3*(phi2+lat0));
  const m = b*f0*(ma-mb+mc-md);
  const dLon = lambda2-lon0;
  const northing = m+n0 + (nu2/2*sinPhi2*cosPhi2)*dLon**2 + (nu2/24*sinPhi2*cosPhi2**3*(5-tanPhi2**2+9*eta2))*dLon**4;
  const easting = e0 + nu2*cosPhi2*dLon + (nu2/6*cosPhi2**3*(nu2/rho-tanPhi2**2))*dLon**3;
  return formatGridRef(easting, northing);
}

function formatGridRef(easting, northing){
  if(!Number.isFinite(easting) || !Number.isFinite(northing)) return "Unavailable";
  const e100k = Math.floor(easting / 100000);
  const n100k = Math.floor(northing / 100000);
  if(e100k < 0 || e100k > 6 || n100k < 0 || n100k > 12) return "Outside OS Grid";

  let l1 = (19-n100k) - (19-n100k)%5 + Math.floor((e100k+10)/5);
  let l2 = (19-n100k)*5%25 + e100k%5;
  if(l1 > 7) l1++;
  if(l2 > 7) l2++;

  const letters = String.fromCharCode(l1+65) + String.fromCharCode(l2+65);
  const e = Math.floor((easting % 100000) / 100).toString().padStart(3,"0");
  const n = Math.floor((northing % 100000) / 100).toString().padStart(3,"0");
  return `${letters} ${e} ${n}`;
}
