// ── OS Grid Reference (WGS84 → OSGB36 → National Grid) ──────────────────────
function latLonToOSGrid(lat, lon) {
  const deg = Math.PI / 180;
  const a = 6378137, b = 6356752.3141;
  const e2 = 1 - (b*b)/(a*a);
  const phi = lat*deg, lam = lon*deg;
  const sp = Math.sin(phi), cp = Math.cos(phi);
  const nu = a / Math.sqrt(1 - e2*sp*sp);
  const x = nu*cp*Math.cos(lam), y = nu*cp*Math.sin(lam), z = nu*(1-e2)*sp;

  // Helmert WGS84 → OSGB36
  const dx=-446.448, dy=125.157, dz=-542.06;
  const rx=(-0.1502/3600)*deg, ry=(-0.247/3600)*deg, rz=(-0.8421/3600)*deg;
  const s=20.4894e-6;
  const x2=dx+x*(1+s)-y*rz+z*ry, y2=dy+x*rz+y*(1+s)-z*rx, z2=dz-x*ry+y*rx+z*(1+s);

  const aO=6377563.396, bO=6356256.91;
  const e2O=1-(bO*bO)/(aO*aO);
  const p=Math.sqrt(x2*x2+y2*y2);
  let phi2=Math.atan2(z2,p*(1-e2O)), pp;
  do { pp=phi2; const sp2=Math.sin(phi2); const nuO=aO/Math.sqrt(1-e2O*sp2*sp2); phi2=Math.atan2(z2+e2O*nuO*Math.sin(phi2),p); } while(Math.abs(phi2-pp)>1e-12);
  const lam2=Math.atan2(y2,x2);
  const sp3=Math.sin(phi2), cp3=Math.cos(phi2), tp3=Math.tan(phi2);
  const nuO2=aO/Math.sqrt(1-e2O*sp3*sp3);

  const phi0=49*deg, lam0=-2*deg, N0=-100000, E0=400000, F0=0.9996012717;
  const n=(aO-bO)/(aO+bO);
  const rhoG=aO*F0*(1-e2O)/Math.pow(1-e2O*sp3*sp3,1.5);
  const nuG=aO*F0/Math.sqrt(1-e2O*sp3*sp3);
  const eta2=nuG/rhoG-1;
  const Ma=(1+n+(5/4)*n*n+(5/4)*n*n*n)*(phi2-phi0);
  const Mb=(3*n+3*n*n+(21/8)*n*n*n)*Math.sin(phi2-phi0)*Math.cos(phi2+phi0);
  const Mc=((15/8)*n*n+(15/8)*n*n*n)*Math.sin(2*(phi2-phi0))*Math.cos(2*(phi2+phi0));
  const Md=(35/24)*n*n*n*Math.sin(3*(phi2-phi0))*Math.cos(3*(phi2+phi0));
  const M=bO*F0*(Ma-Mb+Mc-Md);
  const I=M+N0;
  const II=(nuG/2)*sp3*cp3;
  const III=(nuG/24)*sp3*Math.pow(cp3,3)*(5-tp3*tp3+9*eta2);
  const IIIA=(nuG/720)*sp3*Math.pow(cp3,5)*(61-58*tp3*tp3+Math.pow(tp3,4));
  const IV=nuG*cp3;
  const V=(nuG/6)*Math.pow(cp3,3)*(nuG/rhoG-tp3*tp3);
  const VI=(nuG/120)*Math.pow(cp3,5)*(5-18*tp3*tp3+Math.pow(tp3,4)+14*eta2-58*tp3*tp3*eta2);
  const dL=lam2-lam0;
  const N=I+II*dL*dL+III*Math.pow(dL,4)+IIIA*Math.pow(dL,6);
  const E=E0+IV*dL+V*Math.pow(dL,3)+VI*Math.pow(dL,5);

  const letters=[
    ["SV","SW","SX","SY","SZ","TV","TW"],
    ["SQ","SR","SS","ST","SU","TQ","TR"],
    ["SL","SM","SN","SO","SP","TL","TM"],
    ["SF","SG","SH","SJ","SK","TF","TG"],
    ["SA","SB","SC","SD","SE","TA","TB"],
    ["NV","NW","NX","NY","NZ","OV","OW"],
    ["NQ","NR","NS","NT","NU","OQ","OR"],
    ["NL","NM","NN","NO","NP","OL","OM"],
    ["NF","NG","NH","NJ","NK","OF","OG"],
    ["NA","NB","NC","ND","NE","OA","OB"],
    ["HV","HW","HX","HY","HZ","JV","JW"],
    ["HQ","HR","HS","HT","HU","JQ","JR"],
    ["HL","HM","HN","HO","HP","JL","JM"],
  ];
  const eIdx=Math.floor(E/100000)-1;
  const nIdx=Math.floor(N/100000);
  let ll="??";
  if(nIdx>=0&&nIdx<letters.length&&eIdx>=0&&eIdx<letters[0].length) ll=letters[letters.length-1-nIdx][eIdx];
  const eR=String(Math.floor(E%100000/100)).padStart(3,"0");
  const nR=String(Math.floor(N%100000/100)).padStart(3,"0");
  return `${ll} ${eR} ${nR}`;
}

// ── Haversine distance (km) ──────────────────────────────────────────────────
function haversine(lat1,lon1,lat2,lon2){
  const R=6371, d2r=Math.PI/180;
  const dLat=(lat2-lat1)*d2r, dLon=(lon2-lon1)*d2r;
  const a=Math.sin(dLat/2)**2+Math.cos(lat1*d2r)*Math.cos(lat2*d2r)*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

// ── Nearest A&E via Overpass ─────────────────────────────────────────────────
async function fetchAE(lat,lon){
  const q=`[out:json][timeout:25];(node["amenity"="hospital"]["emergency"="yes"](around:60000,${lat},${lon});way["amenity"="hospital"]["emergency"="yes"](around:60000,${lat},${lon});node["emergency"="yes"]["amenity"="hospital"](around:60000,${lat},${lon}););out center;`;
  const r=await fetch(`https://overpass-api.de/api/interpreter?data=${encodeURIComponent(q)}`);
  const d=await r.json();
  if(!d.elements||!d.elements.length) return null;
  let best=null, minD=Infinity;
  for(const el of d.elements){
    const eLat=el.lat??el.center?.lat, eLon=el.lon??el.center?.lon;
    if(!eLat||!eLon) continue;
    const dist=haversine(lat,lon,eLat,eLon);
    if(dist<minD){minD=dist;best={...el,eLat,eLon,dist};}
  }
  if(!best) return null;
  return {
    name: best.tags?.name||"Unknown Hospital",
    address: [best.tags?.["addr:street"],best.tags?.["addr:city"]].filter(Boolean).join(", ")||"",
    dist: best.dist.toFixed(1),
    lat: best.eLat, lon: best.eLon
  };
}

// ── What3Words ───────────────────────────────────────────────────────────────
async function fetchW3W(lat,lon,key){
  const r=await fetch(`https://api.what3words.com/v3/convert-to-3wa?coordinates=${lat},${lon}&language=en&format=json&key=${key}`);
  if(!r.ok) return null;
  const d=await r.json();
  return d?.words?`///${d.words}`:null;
}

}

    setTimeout(()=>{b.textContent='Copy'; b.classList.remove('copied');},2000);
  });
}

  </div>`;
}
