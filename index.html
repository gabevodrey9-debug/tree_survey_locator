  if(manualMapLinks.length === before) return;
  persistManualMapLinks();
  redrawSurveyLinesOnly();
  setSurveyMapStatus("Manual pole link removed.");
}

function blockAutoMapLink(autoLinkId){
  if(!blockedAutoMapLinks.includes(autoLinkId)){
    blockedAutoMapLinks.push(autoLinkId);
    persistBlockedAutoMapLinks();
  }
  redrawSurveyLinesOnly();
  setSurveyMapStatus("Automatic pole link hidden. Use Link to draw the correct connection.");
}

function persistManualMapLinks(){
  try{
    localStorage.setItem("treeSurveyManualMapLinks", JSON.stringify(manualMapLinks));
  }catch{
    setSurveyMapStatus("Link changed, but this browser could not save it locally.");
  }
}

function persistBlockedAutoMapLinks(){
  try{
    localStorage.setItem("treeSurveyBlockedAutoMapLinks", JSON.stringify(blockedAutoMapLinks));
  }catch{
    setSurveyMapStatus("Auto link hidden, but this browser could not save it locally.");
  }
}

function mapLinkKey(a, b){
  return [a, b].map(String).sort().join("|");
}

function createId(prefix){
  return `${prefix}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}`;
}

function setMapTool(tool, force=false){
  if(!force && ["pole","tree","group","link","unlink","route","label","delete"].includes(tool) && mapTool === tool){
    tool = "pan";
  }
  mapTool = tool;
  if(tool !== "link" && tool !== "unlink") pendingLinkPoleId = null;
  updateMapMovementForTool();
  updateRouteControls();
  for(const id of ["pan","pole","tree","group","link","unlink","route","label","delete"]){
    const button = document.getElementById(`tool-${id}`);
    if(button){
      const active = id === tool;
      button.classList.toggle("active", active);
      button.setAttribute("aria-pressed", String(active));
    }
  }
  const messages = {
    pan:"Pan and zoom the locked map. Tap a mark to select it.",
    pole:"Tap where the missing pole should go.",
    tree:"Tap once to place a single tree circle.",
    group:"Draw around the group. The app will tidy it into the closest shape.",
    link:"Tap one pole, then tap the pole it should link to.",
    unlink:"Tap one pole, then tap the pole it should unlink from.",
    route:"Draw the access route. Lift your finger to save it.",
    label:"Tap the map, then type a label.",
    delete:"Tap a drawn mark, manual link, or pole to remove it."
  };
  setSurveyMapStatus(messages[tool] || "Map tool selected.");
}

function updateMapMovementForTool(){
  syncMapMovementState();
}

function syncMapMovementState(){
  if(!surveyMap) return;
  if(mapLocked && (mapTool === "group" || mapTool === "route" || selectedDrawing)){
    disableSurveyMapMovement();
  }else{
    enableSurveyMapMovement();
  }
}

function handleSurveyMapClick(event){
  if(handleCanvasLineClick(event.containerPoint)) return;

  if(mapTool === "pan" && selectedDrawing){
    selectDrawing(null);
    setSurveyMapStatus("Mark deselected.");
    return;
  }
  if(mapTool === "pole"){
    addMapPole(event.latlng);
    return;
  }
  applySurveyMapTool(event.latlng);
}

function isPointMapTool(){
  return ["pole","tree","label"].includes(mapTool);
}

function isLeafletControlTarget(target){
  return Boolean(target?.closest?.(".leaflet-control"));
}

function latLngFromPointerEvent(event){
  if(surveyMap?.mouseEventToLatLng){
    return surveyMap.mouseEventToLatLng(event);
  }
  const point = containerPointFromPointerEvent(event);
  return surveyMap.containerPointToLatLng(point);
}

function containerPointFromPointerEvent(event){
  if(surveyMap?.mouseEventToContainerPoint){
    return surveyMap.mouseEventToContainerPoint(event);
  }
  const rect = surveyMap.getContainer().getBoundingClientRect();
  return L.point(event.clientX - rect.left, event.clientY - rect.top);
}

function latLngFromClientPoint(point){
  if(!surveyMap || !point) return null;
  if(surveyMap.mouseEventToLatLng){
    return surveyMap.mouseEventToLatLng({ clientX:point.x, clientY:point.y });
  }
  const rect = surveyMap.getContainer().getBoundingClientRect();
  return surveyMap.containerPointToLatLng(L.point(point.x - rect.left, point.y - rect.top));
}

function applySurveyMapTool(latlng){
  if(!mapLocked && mapTool !== "delete") return;
  if(mapTool === "pole") addMapPole(latlng);
  else if(mapTool === "tree") addSurveyCircleShape("tree", [latlng]);
  else if(mapTool === "group") return;
  else if(mapTool === "label") addSurveyTextLabel(latlng);
}

function addSurveyShapeFromStroke(kind, points, wasDrawn=false){
  if(!points.length || !surveyDrawingLayer) return;
  const shapeType = wasDrawn ? closestStrokeShape(points) : "circle";
  if(shapeType === "rectangle") addSurveyRectangleShape(kind, points);
  else addSurveyCircleShape(kind, points);
}

function addAccessRouteFromStroke(points, wasDrawn=false){
  if(!surveyDrawingLayer || points.length < 2 || !wasDrawn){
    setSurveyMapStatus("Draw the access route, then lift to save it.");
    return;
  }
  createAccessRoute(simplifyRoutePoints(points));
  saveMapDrawings();
  setSurveyMapStatus("Access route drawn and saved.");
}

function simplifyRoutePoints(points){
  if(points.length <= 2) return points;
  const simplified = [points[0]];
  let last = surveyMap.latLngToContainerPoint(points[0]);
  for(let i = 1; i < points.length - 1; i++){
    const current = surveyMap.latLngToContainerPoint(points[i]);
    if(current.distanceTo(last) >= 8){
      simplified.push(points[i]);
      last = current;
    }
  }
  simplified.push(points[points.length - 1]);
  return simplified;
}

function drawingShapeStyle(selected=false){
  return {
    color:selected ? "#d99a18" : "#5fbd65",
    opacity:1,
    weight:selected ? 7 : 5,
    fillOpacity:selected ? 0.08 : 0.01
  };
}

function addSurveyCircleShape(kind, points){
  const center = averageLatLng(points);
  const radius = Math.max(24, Math.min(96, maxPointDistancePx(center, points) || 29));
  const text = nextDrawingLabel(kind);
  const shape = L.circleMarker(center, {
    radius,
    ...drawingShapeStyle(false),
    fill:true,
    fillColor:"#5fbd65",
    className:"survey-drawing-shape"
  });
  addNumberedDrawing(shape, center, text, "circle", {
    radius,
    baseRadius:radius,
    radiusUnits:"px",
    baseZoom:currentSurveyZoom()
  });
}

function addSurveyRectangleShape(kind, points){
  const rect = orientedStrokeRectangle(points);
  const text = nextDrawingLabel(kind);
  const shape = L.polygon(rect.corners, {
    ...drawingShapeStyle(false),
    fill:true,
    fillColor:"rgba(95,189,101,.01)",
    className:"survey-drawing-shape"
  });
  addNumberedDrawing(shape, rect.center, text, "rectangle");
}

function nextDrawingLabel(kind){
  recalculateDrawCounters();
  const prefix = kind === "group" ? "G" : "T";
  const key = kind === "group" ? "group" : "tree";
  drawCounters[key] += 1;
  return `${prefix}${drawCounters[key]}`;
}

function recalculateDrawCounters(){
  const next = { tree:0, group:0 };
  for(const item of mapDrawingStack){
    const text = String(item?.text || "").trim().toUpperCase();
    const match = text.match(/^([TG])(\d+)$/);
    if(!match) continue;
    const key = match[1] === "G" ? "group" : "tree";
    next[key] = Math.max(next[key], Number(match[2]));
  }
  drawCounters = next;
}

function addNumberedDrawing(shape, labelPosition, text, type="shape", meta={}){
  const drawing = createDrawingItem(shape, labelPosition, text, type, meta);
  setMapTool("pan");
  selectDrawing(drawing);
  saveMapDrawings();
  setSurveyMapStatus(`${text} added and saved on this device. One finger moves it. Two fingers resize and rotate it.`);
}

function createDrawingItem(shape, labelPosition, text, type="shape", meta={}){
  const label = L.marker(labelPosition, {
    draggable:false,
    icon:drawingLabelIcon(text, drawingZoomScale(meta.baseZoom)),
    zIndexOffset:2000
  });
  const group = L.layerGroup([shape, label]).addTo(surveyDrawingLayer);
  const drawing = {
    type,
    shape,
    label,
    group,
    text,
    center:labelPosition,
    ...meta
  };
  registerInteractiveDrawing(drawing);
  attachDrawingLabelDomEvents(drawing);
  mapDrawingStack.push(drawing);
  applyDrawingZoomScale(drawing);
  drawSurveyDrawingCanvas();
  return drawing;
}

function drawingLabelIcon(text, scale=1){
  const safeScale = Number.isFinite(scale) ? Math.max(0.65, Math.min(1.75, scale)) : 1;
  return L.divIcon({
    className:"",
    html:`<div class="draw-shape-label" style="--draw-label-scale:${safeScale.toFixed(3)}">${escapeHtml(text)}</div>`,
    iconSize:[54,34],
    iconAnchor:[27,17]
  });
}

function currentSurveyZoom(){
  const zoom = surveyMap?.getZoom?.();
  return Number.isFinite(zoom) ? zoom : 16;
}

function drawingZoomScale(baseZoom=currentSurveyZoom()){
  const zoom = currentSurveyZoom();
  const origin = Number.isFinite(Number(baseZoom)) ? Number(baseZoom) : zoom;
  return Math.max(0.65, Math.min(1.75, Math.pow(2, (zoom - origin) * 0.5)));
}

function scheduleSurveyDrawingScaleRefresh(){
  if(surveyDrawingScaleFrame) return;
  surveyDrawingScaleFrame = window.requestAnimationFrame(() => {
    surveyDrawingScaleFrame = null;
    updateAllDrawingZoomScales();
  });
}

function updateAllDrawingZoomScales(){
  for(const drawing of mapDrawingStack){
    if(drawing?.group && drawing.label){
      applyDrawingZoomScale(drawing);
    }
  }
}

function applyDrawingZoomScale(drawing){
  if(!drawing?.label) return;
  if(!Number.isFinite(Number(drawing.baseZoom))) drawing.baseZoom = currentSurveyZoom();
  const scale = drawingZoomScale(drawing.baseZoom);
  drawing.label.setIcon(drawingLabelIcon(drawing.text || "", scale));
  attachDrawingLabelDomEvents(drawing);
  if(drawing.type === "circle" && drawing.shape?.setRadius){
    if(!Number.isFinite(Number(drawing.baseRadius))) drawing.baseRadius = drawing.shape.getRadius();
    drawing.shape.setRadius(Math.max(12, Math.min(180, drawing.baseRadius * scale)));
  }
}

function averageLatLng(points){
  const total = points.reduce((sum, point) => ({
    lat:sum.lat + point.lat,
    lng:sum.lng + point.lng
  }), { lat:0, lng:0 });
  return L.latLng(total.lat / points.length, total.lng / points.length);
}

function maxPointDistanceM(center, points){
  return points.reduce((max, point) => Math.max(max, haversineKm(center.lat, center.lng, point.lat, point.lng) * 1000), 0);
}

function maxPointDistancePx(center, points){
  if(!surveyMap || !points.length) return 0;
  const centerPoint = surveyMap.latLngToContainerPoint(center);
  return points.reduce((max, point) => {
    const nextPoint = surveyMap.latLngToContainerPoint(point);
    return Math.max(max, centerPoint.distanceTo(nextPoint));
  }, 0);
}

function closestStrokeShape(points){
  if(!surveyMap || points.length < 4) return "circle";

  const pixelPoints = points.map((point) => surveyMap.latLngToContainerPoint(point));
  const rect = orientedStrokeMetrics(pixelPoints);
  const ratio = Math.max(rect.width, rect.height) / Math.max(1, Math.min(rect.width, rect.height));
  const distances = pixelPoints.map((point) => Math.hypot(point.x - rect.center.x, point.y - rect.center.y));
  const radius = distances.reduce((sum, value) => sum + value, 0) / distances.length || 1;
  const circleError = distances.reduce((sum, value) => sum + Math.abs(value - radius), 0) / distances.length / radius;
  const rectScale = Math.max(1, Math.min(rect.width, rect.height));
  const rectError = pixelPoints.reduce((sum, point) => {
    const dx = point.x - rect.center.x;
    const dy = point.y - rect.center.y;
    const along = dx * rect.axis.x + dy * rect.axis.y;
    const across = dx * rect.perp.x + dy * rect.perp.y;
    const edgeDistance = Math.min(
      Math.abs(along - rect.minAlong),
      Math.abs(along - rect.maxAlong),
      Math.abs(across - rect.minAcross),
      Math.abs(across - rect.maxAcross)
    );
    return sum + edgeDistance;
  }, 0) / pixelPoints.length / rectScale;

  if(ratio > 1.35) return "rectangle";
  return rectError < circleError * 0.78 ? "rectangle" : "circle";
}

function orientedStrokeRectangle(points){
  if(!surveyMap || points.length < 2){
    const center = points[0] || L.latLng(0, 0);
    return {
      center,
      corners:[center, center, center, center]
    };
  }

  const pixelPoints = trimStrokePixelOutliers(points.map((point) => surveyMap.latLngToContainerPoint(point)));
  const metrics = orientedStrokeMetrics(pixelPoints);
  const pad = Math.max(1.5, Math.min(5, Math.min(metrics.width, metrics.height) * 0.045));
  const minAlong = metrics.minAlong - pad;
  const maxAlong = metrics.maxAlong + pad;
  const minAcross = metrics.minAcross - pad;
  const maxAcross = metrics.maxAcross + pad;
  const cornerPixels = [
    pointFromAxes(metrics, minAlong, minAcross),
    pointFromAxes(metrics, maxAlong, minAcross),
    pointFromAxes(metrics, maxAlong, maxAcross),
    pointFromAxes(metrics, minAlong, maxAcross)
  ];

  return {
    center:surveyMap.containerPointToLatLng(L.point(metrics.center.x, metrics.center.y)),
    corners:cornerPixels.map((point) => surveyMap.containerPointToLatLng(L.point(point.x, point.y)))
  };
}

function trimStrokePixelOutliers(pixelPoints){
  if(pixelPoints.length < 12) return pixelPoints;
  const start = Math.max(0, Math.floor(pixelPoints.length * 0.04));
  const end = Math.min(pixelPoints.length, Math.ceil(pixelPoints.length * 0.96));
  return pixelPoints.slice(start, end);
}

function orientedStrokeMetrics(pixelPoints){
  const center = {
    x:pixelPoints.reduce((sum, point) => sum + point.x, 0) / pixelPoints.length,
    y:pixelPoints.reduce((sum, point) => sum + point.y, 0) / pixelPoints.length
  };
  let xx = 0;
  let yy = 0;
  let xy = 0;

  for(const point of pixelPoints){
    const dx = point.x - center.x;
    const dy = point.y - center.y;
    xx += dx * dx;
    yy += dy * dy;
    xy += dx * dy;
  }

  const angle = 0.5 * Math.atan2(2 * xy, xx - yy);
  const axis = { x:Math.cos(angle), y:Math.sin(angle) };
  const perp = { x:-Math.sin(angle), y:Math.cos(angle) };
  const projections = pixelPoints.map((point) => {
    const dx = point.x - center.x;
    const dy = point.y - center.y;
    return {
      along:dx * axis.x + dy * axis.y,
      across:dx * perp.x + dy * perp.y
    };
  });
  let minAlong = Math.min(...projections.map((point) => point.along));
  let maxAlong = Math.max(...projections.map((point) => point.along));
  let minAcross = Math.min(...projections.map((point) => point.across));
  let maxAcross = Math.max(...projections.map((point) => point.across));

  if(maxAlong - minAlong < 12){
    const mid = (maxAlong + minAlong) / 2;
    minAlong = mid - 6;
    maxAlong = mid + 6;
  }
  if(maxAcross - minAcross < 12){
    const mid = (maxAcross + minAcross) / 2;
    minAcross = mid - 6;
    maxAcross = mid + 6;
  }

  return {
    center,
    axis,
    perp,
    minAlong,
    maxAlong,
    minAcross,
    maxAcross,
    width:maxAlong - minAlong,
    height:maxAcross - minAcross
  };
}

function pointFromAxes(metrics, along, across){
  return {
    x:metrics.center.x + metrics.axis.x * along + metrics.perp.x * across,
    y:metrics.center.y + metrics.axis.y * along + metrics.perp.y * across
  };
}

function strokeBounds(points){
  if(points.length < 2){
    const center = points[0];
    const offset = 0.00006;
    return L.latLngBounds(
      [center.lat - offset, center.lng - offset],
      [center.lat + offset, center.lng + offset]
    );
  }
  return L.latLngBounds(points).pad(0.08);
}

function registerInteractiveDrawing(drawing){
  let lastTapAt = 0;
  let renamedAt = 0;
  const handleRenameTap = (event) => {
    const now = Date.now();
    if(now - lastTapAt < 360){
      L.DomEvent.stop(event);
      renameDrawingItem(drawing);
      renamedAt = now;
      lastTapAt = 0;
      return true;
    }
    lastTapAt = now;
    return false;
  };

  for(const layer of [drawing.shape, drawing.label]){
    layer.on("click", (event) => {
      L.DomEvent.stop(event);
      if(handleRenameTap(event)) return;
      if(mapTool === "delete"){
        removeDrawingItem(drawing);
        return;
      }
      selectDrawing(drawing);
    });
    layer.on("dblclick", (event) => {
      L.DomEvent.stop(event);
      if(Date.now() - renamedAt < 500) return;
      renameDrawingItem(drawing);
      renamedAt = Date.now();
    });
  }

  drawing.label.on("dragstart", () => {
    selectDrawing(drawing);
  });

  drawing.label.on("dragend", () => {
    moveDrawingTo(drawing, drawing.label.getLatLng());
    selectDrawing(drawing);
    saveMapDrawings();
  });
}

function attachDrawingLabelDomEvents(drawing){
  const icon = drawing?.label?._icon;
  if(!icon || icon.dataset.renameReady === "true") return;
  icon.dataset.renameReady = "true";

  let lastTapAt = 0;
  const handleTap = (event) => {
    event.preventDefault();
    event.stopPropagation();
    event.stopImmediatePropagation?.();

    const now = Date.now();
    if(now - lastTapAt < 460){
      lastTapAt = 0;
      renameDrawingItem(drawing);
      return;
    }
    lastTapAt = now;
    selectDrawing(drawing);
  };

  icon.addEventListener("click", handleTap);
  icon.addEventListener("dblclick", (event) => {
    event.preventDefault();
    event.stopPropagation();
    event.stopImmediatePropagation?.();
    lastTapAt = 0;
    renameDrawingItem(drawing);
  });
}

function requestTextValue({ title, label, value="", transform=(text) => text, onSave }){
  const existing = document.querySelector(".text-prompt-backdrop");
  existing?.remove();

  const backdrop = document.createElement("div");
  backdrop.className = "text-prompt-backdrop";
  backdrop.setAttribute("role", "presentation");

  const dialog = document.createElement("form");
  dialog.className = "text-prompt-dialog";
  dialog.setAttribute("role", "dialog");
  dialog.setAttribute("aria-modal", "true");
  dialog.setAttribute("aria-labelledby", "textPromptTitle");

  dialog.innerHTML = `
    <h2 id="textPromptTitle">${escapeHtml(title)}</h2>
    <label for="textPromptInput">${escapeHtml(label)}</label>
    <input id="textPromptInput" type="text" autocomplete="off" value="${escapeHtml(value)}">
    <div class="text-prompt-actions">
      <button class="secondary" type="button" data-action="cancel">Cancel</button>
      <button class="primary" type="submit">Save</button>
    </div>
  `;

  const close = () => backdrop.remove();
  dialog.addEventListener("submit", (event) => {
    event.preventDefault();
    const input = dialog.querySelector("#textPromptInput");
    const next = transform(input.value).trim();
    if(!next) return;
    close();
    onSave(next);
  });
  dialog.querySelector('[data-action="cancel"]').addEventListener("click", close);
  backdrop.addEventListener("click", (event) => {
    if(event.target === backdrop) close();
  });
  dialog.addEventListener("keydown", (event) => {
    if(event.key === "Escape") close();
  });

  backdrop.appendChild(dialog);
  document.body.appendChild(backdrop);
  const input = dialog.querySelector("#textPromptInput");
  input.focus();
  input.select();
}

function requestChoiceValue({ title, message, choices=[], onChoose, onCancel }){
  const existing = document.querySelector(".text-prompt-backdrop");
  existing?.remove();

  const backdrop = document.createElement("div");
  backdrop.className = "text-prompt-backdrop";
  backdrop.setAttribute("role", "presentation");

  const dialog = document.createElement("div");
  dialog.className = "text-prompt-dialog";
  dialog.setAttribute("role", "dialog");
  dialog.setAttribute("aria-modal", "true");
  dialog.setAttribute("aria-labelledby", "choicePromptTitle");

  dialog.innerHTML = `
    <h2 id="choicePromptTitle">${escapeHtml(title)}</h2>
    <label>${escapeHtml(message)}</label>
    <div class="choice-prompt-options">
      ${choices.map((choice, index) => `
        <button class="choice-prompt-option" type="button" data-choice-index="${index}">
          <strong>${escapeHtml(choice.label)}</strong>
          <span>${escapeHtml(choice.detail || "")}</span>
        </button>
      `).join("")}
    </div>
    <div class="text-prompt-actions">
      <button class="secondary" type="button" data-action="cancel">Cancel</button>
    </div>
  `;

  const close = () => backdrop.remove();
  dialog.querySelectorAll("[data-choice-index]").forEach((button) => {
    button.addEventListener("click", () => {
      const choice = choices[Number(button.dataset.choiceIndex)];
      close();
      if(choice) onChoose?.(choice.value);
    });
  });
  dialog.querySelector('[data-action="cancel"]').addEventListener("click", () => {
    close();
    onCancel?.();
  });
  backdrop.addEventListener("click", (event) => {
    if(event.target === backdrop){
      close();
      onCancel?.();
    }
  });
  dialog.addEventListener("keydown", (event) => {
    if(event.key === "Escape"){
      close();
      onCancel?.();
    }
  });

  backdrop.appendChild(dialog);
  document.body.appendChild(backdrop);
  dialog.querySelector(".choice-prompt-option")?.focus();
}

function renameDrawingItem(drawing){
  if(!drawing) return;
  const current = drawing.text || "";
  requestTextValue({
    title:"Rename mark",
    label:"Tree or group label",
    value:current,
    transform:(text) => text.toUpperCase(),
    onSave:(next) => {
      if(!next || next === current) return;
      drawing.text = next;
      applyDrawingZoomScale(drawing);
      attachDrawingLabelDomEvents(drawing);
      recalculateDrawCounters();
      saveMapDrawings();
      selectDrawing(drawing);
      setSurveyMapStatus(`Renamed to ${next} and saved on this device.`);
    }
  });
}

function renameSelectedDrawing(){
  if(!selectedDrawing){
    setSurveyMapStatus("Tap a tree or group first, then press Rename.");
    return;
  }
  renameDrawingItem(selectedDrawing);
}

function selectDrawing(drawing){
  if(selectedDrawing?.shape?.setStyle){
    selectedDrawing.shape.setStyle(drawingShapeStyle(false));
    selectedDrawing.label?.setZIndexOffset?.(2000);
  }

  selectedDrawing = drawing || null;

  if(selectedDrawing?.shape?.setStyle){
    selectedDrawing.shape.setStyle(drawingShapeStyle(true));
    selectedDrawing.shape.bringToFront?.();
    selectedDrawing.label.setZIndexOffset?.(2500);
    setSurveyMapStatus(`${selectedDrawing.text} selected. Press Rename, or double tap the mark.`);
  }
  if(!selectedDrawing){
    for(const item of mapDrawingStack){
      item?.label?.setZIndexOffset?.(2000);
    }
  }
  drawSurveyDrawingCanvas();
  updateSelectedDrawingControls();
  syncMapMovementState();
}

function updateSelectedDrawingControls(){
  const renameButton = document.getElementById("renameDrawingBtn");
  if(renameButton) renameButton.disabled = !selectedDrawing;
}

function removeDrawingItem(item){
  if(!item || !surveyDrawingLayer) return;
  if(item.group){
    surveyDrawingLayer.removeLayer(item.group);
  }else{
    surveyDrawingLayer.removeLayer(item);
  }
  mapDrawingStack = mapDrawingStack.filter((layer) => layer !== item);
  if(selectedDrawing === item) selectedDrawing = null;
  if(item === activeRoute){
    activeRoute = null;
    activeRoutePoints = [];
  }
  recalculateDrawCounters();
  saveMapDrawings();
  drawSurveyDrawingCanvas();
  updateSelectedDrawingControls();
  updateRouteControls();
  syncMapMovementState();
  if(mapTool === "delete") setMapTool("pan", true);
  setSurveyMapStatus("Drawing removed and saved on this device.");
}

function moveDrawingTo(drawing, newCenter){
  const oldCenter = drawing.center || drawing.label.getLatLng();
  const dLat = newCenter.lat - oldCenter.lat;
  const dLng = newCenter.lng - oldCenter.lng;

  if(drawing.type === "circle"){
    drawing.shape.setLatLng(newCenter);
  }else if(drawing.shape.getLatLngs){
    const corners = getPolygonCorners(drawing).map((point) => L.latLng(point.lat + dLat, point.lng + dLng));
    drawing.shape.setLatLngs(corners);
  }

  drawing.center = newCenter;
  drawing.label.setLatLng(newCenter);
  drawSurveyDrawingCanvas();
}

function pointerEventPoint(event){
  return { x:event.clientX, y:event.clientY };
}

function gestureInfo(points){
  if(!points.length) return null;
  const center = {
    x:points.reduce((sum, point) => sum + point.x, 0) / points.length,
    y:points.reduce((sum, point) => sum + point.y, 0) / points.length
  };

  if(points.length < 2){
    return { count:1, center, distance:0, angle:0 };
  }

  const first = points[0];
  const second = points[1];
  return {
    count:points.length,
    center,
    distance:Math.hypot(second.x - first.x, second.y - first.y),
    angle:Math.atan2(second.y - first.y, second.x - first.x)
  };
}

function isDrawingDomTarget(target){
  return Boolean(
    target?.closest?.(".survey-drawing-shape, .draw-shape-label")
  );
}

function findDrawingFromEventTarget(target){
  if(!target) return null;
  return mapDrawingStack.find((item) => {
    if(!item?.group) return false;
    const shapeNode = item.shape?._path;
    const labelNode = item.label?._icon;
    return (shapeNode && (target === shapeNode || shapeNode.contains?.(target))) ||
      (labelNode && (target === labelNode || labelNode.contains?.(target)));
  }) || null;
}

function findDrawingAtPointer(event){
  if(!surveyMap) return null;
  const point = containerPointFromPointerEvent(event);
  const items = [...mapDrawingStack].reverse();

  for(const item of items){
    if(!item?.group || !item.label) continue;
    const center = item.label.getLatLng();
    const centerPoint = surveyMap.latLngToContainerPoint(center);
    if(point.distanceTo(centerPoint) <= 42) return item;

    if(item.type === "circle" && item.shape?.getRadius){
      const edge = surveyMap.latLngToContainerPoint(offsetLatLngEast(center, item.shape.getRadius()));
      const radiusPx = item.radiusUnits === "px" ? Math.max(18, item.shape.getRadius()) : Math.max(18, centerPoint.distanceTo(edge));
      if(point.distanceTo(centerPoint) <= radiusPx + 18) return item;
    }else if(item.shape?.getLatLngs){
      const corners = getPolygonCorners(item).map((latlng) => surveyMap.latLngToContainerPoint(latlng));
      if(isPointInPolygonPixels(point, corners) || isPointNearPolygonEdge(point, corners, 18)) return item;
    }
  }

  return null;
}

function offsetLatLngEast(latlng, meters){
  const lngOffset = meters / (111320 * Math.max(0.2, Math.cos(latlng.lat * Math.PI / 180)));
  return L.latLng(latlng.lat, latlng.lng + lngOffset);
}

function isPointInPolygonPixels(point, polygon){
  let inside = false;
  for(let i = 0, j = polygon.length - 1; i < polygon.length; j = i++){
    const xi = polygon[i].x;
    const yi = polygon[i].y;
    const xj = polygon[j].x;
    const yj = polygon[j].y;
    const intersects = ((yi > point.y) !== (yj > point.y)) &&
      (point.x < (xj - xi) * (point.y - yi) / ((yj - yi) || 0.000001) + xi);
    if(intersects) inside = !inside;
  }
  return inside;
}

function isPointNearPolygonEdge(point, polygon, tolerance){
  for(let i = 0; i < polygon.length; i++){
    const a = polygon[i];
    const b = polygon[(i + 1) % polygon.length];
    if(pointToSegmentDistance(point, a, b) <= tolerance) return true;
  }
  return false;
}

function moveSelectedDrawingByPixels(dx, dy){
  if(!selectedDrawing || !surveyMap) return;
  const center = selectedDrawing.label.getLatLng();
  const point = surveyMap.latLngToContainerPoint(center);
  const nextCenter = surveyMap.containerPointToLatLng(L.point(point.x + dx, point.y + dy));
  moveDrawingTo(selectedDrawing, nextCenter);
}

function moveSelectedDrawingByLatLngDelta(dLat, dLng){
  if(!selectedDrawing || !Number.isFinite(dLat) || !Number.isFinite(dLng)) return;
  const center = selectedDrawing.label.getLatLng();
  moveDrawingTo(selectedDrawing, L.latLng(center.lat + dLat, center.lng + dLng));
}

function resizeSelectedDrawing(factor){
  if(!selectedDrawing){
    setSurveyMapStatus("Tap a tree/group mark first, then resize it.");
    return;
  }

  resizeDrawing(selectedDrawing, factor);
  saveMapDrawings();
  setSurveyMapStatus(`${selectedDrawing.text} resized.`);
}

function rotateSelectedDrawing(degrees){
  if(!selectedDrawing){
    setSurveyMapStatus("Tap a tree/group mark first, then rotate it.");
    return;
  }

  rotateDrawing(selectedDrawing, degrees);
  saveMapDrawings();
  setSurveyMapStatus(`${selectedDrawing.text} rotated.`);
}

function resizeDrawing(drawing, factor){
  if(!drawing || !Number.isFinite(factor) || factor <= 0) return;
  if(drawing.type === "circle"){
    const current = drawing.shape.getRadius();
    const nextRadius = Math.max(12, current * factor);
    drawing.shape.setRadius(nextRadius);
    const scale = drawingZoomScale(drawing.baseZoom);
    drawing.baseRadius = Math.max(12, nextRadius / Math.max(0.1, scale));
    drawSurveyDrawingCanvas();
  }else{
    transformDrawingPolygon(drawing, (point, center) => ({
      x:center.x + (point.x - center.x) * factor,
      y:center.y + (point.y - center.y) * factor
    }));
  }
}

function rotateDrawing(drawing, degrees){
  if(!drawing || !Number.isFinite(degrees)) return;
  if(drawing.type === "circle"){
    setSurveyMapStatus("Circles do not need rotating.");
    return;
  }

  const radians = degrees * Math.PI / 180;
  const cos = Math.cos(radians);
  const sin = Math.sin(radians);
  transformDrawingPolygon(drawing, (point, center) => {
    const dx = point.x - center.x;
    const dy = point.y - center.y;
    return {
      x:center.x + dx * cos - dy * sin,
      y:center.y + dx * sin + dy * cos
    };
  });
}

function transformSelectedPolygon(transformer){
  transformDrawingPolygon(selectedDrawing, transformer);
}

function transformDrawingPolygon(drawing, transformer){
  if(!drawing || !surveyMap || !drawing.shape.getLatLngs) return;
  const center = drawing.label.getLatLng();
  const centerPoint = surveyMap.latLngToContainerPoint(center);
  const nextCorners = getPolygonCorners(drawing).map((latlng) => {
    const point = surveyMap.latLngToContainerPoint(latlng);
    const next = transformer(point, centerPoint);
    return surveyMap.containerPointToLatLng(L.point(next.x, next.y));
  });
  drawing.shape.setLatLngs(nextCorners);
  drawing.center = center;
  drawSurveyDrawingCanvas();
}

function getPolygonCorners(drawing){
  const latLngs = drawing.shape.getLatLngs();
  return Array.isArray(latLngs[0]) ? latLngs[0] : latLngs;
}

function compactLatLng(latlng){
  return {
    lat:Number(latlng.lat.toFixed(7)),
    lng:Number(latlng.lng.toFixed(7))
  };
}

function mapDrawingKeyForSpan(span=currentReport?.nearestSpan){
  if(!span) return "general";
  const parts = [
    span.mapPoleId,
    span.externalReference,
    span.toPole,
    span.span,
    span.gridRef,
    span.primaryNo,
    span.circuitName
  ].filter(Boolean);
  const raw = parts.join("|") || poleDisplayName(span) || "general";
  return compactSearchText(raw).slice(0, 120) || "general";
}

function mapDrawingStorageKey(key=activeMapDrawingKey || "general"){
  return `treeSurveyMapDrawings:${key}`;
}

function switchMapDrawingSpan(span){
  const nextKey = mapDrawingKeyForSpan(span);
  if(activeMapDrawingKey === nextKey) return;
  if(activeMapDrawingKey){
    saveMapDrawings();
  }
  activeMapDrawingKey = nextKey;
  clearRenderedMapDrawings();
  restoreMapDrawings();
}

function clearRenderedMapDrawings(){
  if(activeStrokePreview && surveyDrawingLayer){
    surveyDrawingLayer.removeLayer(activeStrokePreview);
    activeStrokePreview = null;
  }
  if(surveyDrawingLayer) surveyDrawingLayer.clearLayers();
  clearSurveyDrawingCanvas();
  mapDrawingStack = [];
  selectedDrawing = null;
  activeRoute = null;
  activeRoutePoints = [];
  drawCounters = { tree:0, group:0 };
  updateSelectedDrawingControls();
  syncMapMovementState();
}

function clearAllMapDrawingStorage(){
  localStorage.removeItem("treeSurveyMapDrawings");
  const keysToRemove = [];
  for(let i = 0; i < localStorage.length; i++){
    const key = localStorage.key(i);
    if(key && key.startsWith("treeSurveyMapDrawings:")){
      keysToRemove.push(key);
    }
  }
  keysToRemove.forEach((key) => localStorage.removeItem(key));
}

function saveMapDrawings(){
  if(restoringMapDrawings) return;
  try{
    const records = [];
    for(const item of mapDrawingStack){
      if(item?.group && item.shape && item.label){
        const center = item.label.getLatLng();
        if(item.type === "circle"){
          records.push({
            kind:"drawing",
            type:"circle",
            text:item.text,
            center:compactLatLng(center),
            radius:Math.round((item.baseRadius || item.shape.getRadius()) * 100) / 100,
            radiusUnits:item.radiusUnits || "px",
            baseZoom:Number.isFinite(Number(item.baseZoom)) ? Number(item.baseZoom) : currentSurveyZoom()
          });
        }else if(item.shape.getLatLngs){
          records.push({
            kind:"drawing",
            type:"rectangle",
            text:item.text,
            center:compactLatLng(center),
            corners:getPolygonCorners(item).map(compactLatLng),
            baseZoom:Number.isFinite(Number(item.baseZoom)) ? Number(item.baseZoom) : currentSurveyZoom()
          });
        }
      }else if(item?.itemType === "route" && item.getLatLngs){
        const points = item.getLatLngs().map(compactLatLng);
        if(points.length) records.push({ kind:"route", points });
      }else if(item?.itemType === "label" && item.getLatLng){
        records.push({
          kind:"label",
          text:item.labelText || "Label",
          position:compactLatLng(item.getLatLng())
        });
      }
    }

    if(records.length){
      localStorage.setItem(mapDrawingStorageKey(), JSON.stringify(records));
    }else{
      localStorage.removeItem(mapDrawingStorageKey());
    }
  }catch{
    setSurveyMapStatus("Map markings changed, but this browser could not save them locally.");
  }
}

function restoreMapDrawings(){
  if(!surveyDrawingLayer || !window.L) return;
  try{
    if(!activeMapDrawingKey) activeMapDrawingKey = mapDrawingKeyForSpan();
    const stored = localStorage.getItem(mapDrawingStorageKey()) ||
      (activeMapDrawingKey === "general" ? localStorage.getItem("treeSurveyMapDrawings") : "");
    if(!stored) return;
    const records = JSON.parse(stored);
    if(!Array.isArray(records) || mapDrawingStack.length) return;

    restoringMapDrawings = true;
    for(const record of records){
      if(record.kind === "drawing" && record.type === "circle" && record.center){
        const center = L.latLng(record.center.lat, record.center.lng);
        const savedRadius = Number(record.radius);
        const radius = record.radiusUnits === "px" && Number.isFinite(savedRadius)
          ? Math.max(18, Math.min(120, savedRadius))
          : 29;
        const baseZoom = Number.isFinite(Number(record.baseZoom)) ? Number(record.baseZoom) : currentSurveyZoom();
        const shape = L.circleMarker(center, {
          radius,
          ...drawingShapeStyle(false),
          fill:true,
          fillColor:"#5fbd65",
          className:"survey-drawing-shape"
        });
        createDrawingItem(shape, center, record.text || "T1", "circle", { radius, baseRadius:radius, radiusUnits:"px", baseZoom });
      }else if(record.kind === "drawing" && record.corners?.length){
        const corners = record.corners.map((point) => L.latLng(point.lat, point.lng));
        const center = record.center ? L.latLng(record.center.lat, record.center.lng) : L.latLngBounds(corners).getCenter();
        const baseZoom = Number.isFinite(Number(record.baseZoom)) ? Number(record.baseZoom) : currentSurveyZoom();
        const shape = L.polygon(corners, {
          ...drawingShapeStyle(false),
          fill:true,
          fillColor:"#5fbd65",
          className:"survey-drawing-shape"
        });
        createDrawingItem(shape, center, record.text || "G1", "rectangle", { baseZoom });
      }else if(record.kind === "route" && record.points?.length){
        createAccessRoute(record.points.map((point) => L.latLng(point.lat, point.lng)));
      }else if(record.kind === "label" && record.position){
        createTextLabel(L.latLng(record.position.lat, record.position.lng), record.text || "Label");
      }
    }
    recalculateDrawCounters();
    drawSurveyDrawingCanvas();
    setSurveyMapStatus(`${mapDrawingStack.length} saved map mark${mapDrawingStack.length === 1 ? "" : "s"} restored on this device.`);
  }catch{
    localStorage.removeItem(mapDrawingStorageKey());
    setSurveyMapStatus("Saved map markings could not be read, so they were reset.");
  }finally{
    restoringMapDrawings = false;
  }
}

function createAccessRoute(points){
  const route = L.polyline(points, {
    color:"#f4c430",
    weight:5,
    opacity:0.95
  }).addTo(surveyDrawingLayer);
  route.itemType = "route";
  route.on("click", (event) => {
    if(mapTool !== "delete") return;
    L.DomEvent.stop(event);
    removeDrawingItem(route);
    if(activeRoute === route){
      activeRoute = null;
      activeRoutePoints = [];
    }
    updateRouteControls();
    setSurveyMapStatus("Access route removed.");
  });
  mapDrawingStack.push(route);
  return route;
}

function addSurveyTextLabel(latlng){
  requestTextValue({
    title:"Add label",
    label:"Map label",
    value:"",
    onSave:(text) => {
      createTextLabel(latlng, text);
      saveMapDrawings();
      setMapTool("pan", true);
      setSurveyMapStatus(`Label "${text}" added and saved.`);
    }
  });
}

function updateRouteControls(){
}

function createTextLabel(latlng, text){
  const marker = L.marker(latlng, {
    draggable:true,
    icon:L.divIcon({
      className:"",
      html:`<div class="text-label">${escapeHtml(text)}</div>`,
      iconSize:[120,26],
      iconAnchor:[0,13]
    })
  }).addTo(surveyDrawingLayer);
  marker.itemType = "label";
  marker.labelText = text;
  marker.on("click", (event) => {
    if(mapTool !== "delete") return;
    L.DomEvent.stop(event);
    removeDrawingItem(marker);
    setSurveyMapStatus("Label removed.");
  });
  marker.on("dragend", () => saveMapDrawings());
  mapDrawingStack.push(marker);
  return marker;
}

function recordMapUndoAction(action){
  mapUndoStack.push({
    ...action,
    at:Date.now()
  });
  if(mapUndoStack.length > 30) mapUndoStack.shift();
}

function undoLastPoleMove(action){
  const spans = Array.isArray(window.SPAN_DATA) ? window.SPAN_DATA : [];
  const span = spans.find((item) => item.mapPoleId === action.mapPoleId);
  if(!span){
    setSurveyMapStatus("That pole is no longer in the map data, so it could not be restored.");
    return true;
  }

  span.latitude = action.spanLat ?? action.lat;
  span.longitude = action.spanLon ?? action.lon;
  if(action.coordinateSource === undefined){
    delete span.coordinateSource;
  }else{
    span.coordinateSource = action.coordinateSource;
  }

  persistSpanData();
  renderSurveyMap(false);
  setSurveyMapStatus(`${action.label || "Pole"} moved back.`);
  return true;
}

function undoMapDrawing(){
  const action = mapUndoStack.pop();
  if(action?.type === "pole-move"){
    undoLastPoleMove(action);
    return;
  }

  if(activeRoute && activeRoutePoints.length){
    activeRoutePoints.pop();
    activeRoute.setLatLngs(activeRoutePoints);
    if(!activeRoutePoints.length){
      surveyDrawingLayer.removeLayer(activeRoute);
      mapDrawingStack = mapDrawingStack.filter((layer) => layer !== activeRoute);
      activeRoute = null;
    }
    saveMapDrawings();
    updateRouteControls();
    setSurveyMapStatus("Last route point undone.");
    return;
  }

  const layer = mapDrawingStack.pop();
  if(!layer){
    setSurveyMapStatus("Nothing to undo.");
    return;
  }
  if(layer?.group && surveyDrawingLayer){
    surveyDrawingLayer.removeLayer(layer.group);
    if(selectedDrawing === layer) selectedDrawing = null;
  }else if(layer && surveyDrawingLayer){
    surveyDrawingLayer.removeLayer(layer);
    if(layer === activeRoute){
      activeRoute = null;
      activeRoutePoints = [];
    }
  }
  recalculateDrawCounters();
  saveMapDrawings();
  drawSurveyDrawingCanvas();
  updateSelectedDrawingControls();
  updateRouteControls();
  syncMapMovementState();
  setSurveyMapStatus("Last mark undone.");
}

function clearMapDrawings(showMessage=true){
  if(activeStrokePreview && surveyDrawingLayer){
    surveyDrawingLayer.removeLayer(activeStrokePreview);
    activeStrokePreview = null;
  }
  if(surveyDrawingLayer) surveyDrawingLayer.clearLayers();
  clearSurveyDrawingCanvas();
  mapDrawingStack = [];
  selectedDrawing = null;
  updateSelectedDrawingControls();
  syncMapMovementState();
  activeRoute = null;
  activeRoutePoints = [];
  updateRouteControls();
  drawCounters = { tree:0, group:0 };
  saveMapDrawings();
  if(showMessage) setSurveyMapStatus("Map markings cleared.");
}

function loadStoredSpanData(){
  try{
    const stored = localStorage.getItem("treeSurveySpanData");
    if(!stored){
      updateSpanDataStatus();
      return;
    }

    const rows = JSON.parse(stored);
    window.SPAN_DATA = Array.isArray(rows) ? rows.map(repairSpanPosition).filter((span) => isUsableCoordinate(span.latitude, span.longitude)) : [];
    updateSpanDataStatus();
  }catch{
    window.SPAN_DATA = [];
    updateSpanDataStatus("Saved span data could not be read. Re-import the spreadsheet.");
  }
}

async function loadBundledSpanData(){
  if(Array.isArray(window.SPAN_DATA) && window.SPAN_DATA.length) return;
  try{
    const response = await fetch("span-data-current.js", { cache:"no-store" });
    if(!response.ok) return;
    const text = await response.text();
    const match = text.match(/window\.SPAN_DATA\s*=\s*(\[[\s\S]*?\]);?\s*$/);
    if(!match) return;
    const rows = JSON.parse(match[1]);
    const imported = Array.isArray(rows)
      ? rows.map(repairSpanPosition).filter((span) => isUsableCoordinate(span.latitude, span.longitude))
      : [];
    if(!imported.length) return;
    window.SPAN_DATA = imported;
    updateSpanDataStatus(`${imported.length} bundled spans loaded for this device.`);
    if(surveyMap) renderSurveyMap(true);
  }catch{
    // Bundled span data is optional; uploaded/local data remains the normal path.
  }
}

function loadStoredManualMapLinks(){
  try{
    const stored = localStorage.getItem("treeSurveyManualMapLinks");
    if(!stored) return;
    const links = JSON.parse(stored);
    manualMapLinks = Array.isArray(links)
      ? links.filter((link) => link && link.id && link.a && link.b)
      : [];
  }catch{
    manualMapLinks = [];
  }
}

function loadStoredBlockedAutoMapLinks(){
  try{
    const stored = localStorage.getItem("treeSurveyBlockedAutoMapLinks");
    if(!stored) return;
    const links = JSON.parse(stored);
    blockedAutoMapLinks = Array.isArray(links)
      ? links.filter(Boolean).map(String)
      : [];
  }catch{
    blockedAutoMapLinks = [];
  }
}

function updateSpanDataStatus(message=""){
  const count = Array.isArray(window.SPAN_DATA) ? window.SPAN_DATA.length : 0;
  setElementStatus(spanDataStatus, message || (count
    ? `${count} spans imported.`
    : "No span spreadsheet imported on this device."), message ? "success" : "");
  setElementStatus(spanSearchStatus, count
    ? "Search your imported LV/HV span data."
    : "Import a spreadsheet before searching spans.", count ? "" : "error");
  if(surveyMapStatus){
    setSurveyMapStatus(count
      ? `${count} span rows ready. Open the map to plot them automatically.`
      : "Import a span spreadsheet, then open the map.");
  }
}

function spanDataQualitySummary(spans){
  const rows = Array.isArray(spans) ? spans : [];
  if(!rows.length) return "";
  const missingPrimary = rows.filter((span) => !primarySubValue(span)).length;
  const missingFeeder = rows.filter((span) => !(span.hvFeeder || span.feederName)).length;
  const missingToPole = rows.filter((span) => !span.toPole).length;
  const issues = [
    missingPrimary ? `${missingPrimary} missing primary` : "",
    missingFeeder ? `${missingFeeder} missing feeder` : "",
    missingToPole ? `${missingToPole} missing to-pole` : ""
  ].filter(Boolean);
  return issues.length ? ` Data check: ${issues.join(", ")}.` : " Data check: key fields look complete.";
}

async function importSpanFiles(){
  const files = [...spanFileInput.files];

  if(!files.length){
    setElementStatus(spanDataStatus, "Choose one or more CSV, TSV, TXT, XLS, XLSX or ODS files first.", "error");
    return;
  }

  try{
    const imported = [];
    let totalRows = 0;

    for(const file of files){
      const rows = await readSpanFile(file);
      totalRows += rows.length;
      imported.push(...normaliseImportedSpans(rows));
    }

    if(!imported.length){
      setElementStatus(spanDataStatus, "No usable span rows found. Check the file has a grid reference or usable latitude/longitude.", "error");
      return;
    }

    window.SPAN_DATA = imported;
    localStorage.setItem("treeSurveySpanData", JSON.stringify(imported));
    currentSpanMatches = [];
    spanSearchResults.innerHTML = "";
    const skipped = Math.max(0, totalRows - imported.length);
    updateSpanDataStatus(`${imported.length} spans imported${skipped ? `, ${skipped} rows skipped because they could not be plotted` : ""}.`);
    if(surveyMap) renderSurveyMap(true);
    setElementStatus(spanDataStatus, `${spanDataStatus.textContent}${spanDataQualitySummary(imported)}`, skipped ? "" : "success");
  }catch(error){
    setElementStatus(spanDataStatus, error.message || "Could not import that spreadsheet.", "error");
  }
}

function clearSpanData(){
  const count = Array.isArray(window.SPAN_DATA) ? window.SPAN_DATA.length : 0;
  if(count || mapDrawingStack.length || manualMapLinks.length){
    const ok = window.confirm("Clear imported spans, map links and map drawings from this device?");
    if(!ok) return;
  }
  localStorage.removeItem("treeSurveySpanData");
  localStorage.removeItem("treeSurveyManualMapLinks");
  localStorage.removeItem("treeSurveyBlockedAutoMapLinks");
  clearAllMapDrawingStorage();
  window.SPAN_DATA = [];
  manualMapLinks = [];
  blockedAutoMapLinks = [];
  pendingLinkPoleId = null;
  activeMapDrawingKey = "";
  currentSpanMatches = [];
  spanSearchResults.innerHTML = "";
  clearMapDrawings(false);
  if(surveyPoleLayer) surveyPoleLayer.clearLayers();
  if(surveyLineLayer) surveyLineLayer.clearLayers();
  surveyLineShapes = [];
  clearSurveyLineCanvas();
  surveyPoleBounds = null;
  surveyPolePoints = [];
  forcedMapPoleId = null;
  surveyMapRendered = false;
  unlockSurveyFrame(false);
  updateSpanDataStatus("Span data cleared from this device.");
}

async function loadBundledAEData(){
  try{
    const response = await fetch("ae-data.csv", { cache:"no-store" });
    if(!response.ok) return;

    const rows = parseCsvRows(await response.text());
    window.AE_DATA = rows.map(normaliseAERow).filter(Boolean);
  }catch{
    window.AE_DATA = [];
  }
}

function normaliseAERow(row){
  const hospital = {
    name:getRowValue(row, ["Name", "Hospital", "Hospital Name", "A&E Name", "AE Name"]),
    address:getRowValue(row, ["Address", "Full Address"]),
    phone:getRowValue(row, ["Phone", "Telephone", "Telephone Number"]),
    mapsLink:getRowValue(row, ["Maps Link", "Google Maps", "Map Link"]),
    latitude:parseCoordinateNumber(getRowValue(row, ["Latitude", "Lat", "latitude", "lat"])),
    longitude:parseCoordinateNumber(getRowValue(row, ["Longitude", "Lon", "Lng", "longitude", "lon", "lng"]))
  };

  if(!hospital.name || !isUsableCoordinate(hospital.latitude, hospital.longitude)) return null;
  return hospital;
}

async function readSpanFile(file){
  const extension = file.name.split(".").pop().toLowerCase();

  if(["csv","tsv","txt"].includes(extension)){
    return parseDelimitedRows(await file.text(), extension);
  }

  if(["xlsx","xls","ods"].includes(extension)){
    if(!window.XLSX) throw new Error("Spreadsheet reader is still loading. Try again in a few seconds.");

    const data = await file.arrayBuffer();
    const workbook = XLSX.read(data, { type:"array" });
    return workbook.SheetNames.flatMap((sheetName) => {
      const sheet = workbook.Sheets[sheetName];
      const rows = XLSX.utils.sheet_to_json(sheet, { header:1, defval:"", blankrows:false });
      return tableRowsToObjects(rows);
    });
  }

  throw new Error("Use a CSV, TSV, TXT, XLSX, XLS, or ODS file.");
}

function parseCsvRows(text){
  return parseDelimitedRows(text, "csv");
}

function parseDelimitedRows(text, extension="csv"){
  const delimiter = extension === "tsv" ? "\t" : detectDelimiter(text);
  const rows = [];
  let row = [];
  let field = "";
  let quoted = false;

  for(let i = 0; i < text.length; i++){
    const char = text[i];
    const next = text[i + 1];

    if(quoted){
      if(char === '"' && next === '"'){
        field += '"';
        i++;
      }else if(char === '"'){
        quoted = false;
      }else{
        field += char;
      }
    }else if(char === '"'){
      quoted = true;
    }else if(char === delimiter){
      row.push(field);
      field = "";
    }else if(char === "\n"){
      row.push(field);
      rows.push(row);
      row = [];
      field = "";
    }else if(char !== "\r"){
      field += char;
    }
  }

  if(field || row.length){
    row.push(field);
    rows.push(row);
  }

  return tableRowsToObjects(rows);
}

function detectDelimiter(text){
  const sample = String(text || "").split(/\r?\n/).slice(0, 8).join("\n");
  const options = [",", "\t", ";"];
  return options
    .map((delimiter) => ({
      delimiter,
      count:(sample.match(new RegExp(delimiter === "\t" ? "\\t" : `\\${delimiter}`, "g")) || []).length
    }))
    .sort((a, b) => b.count - a.count)[0]?.delimiter || ",";
}

function tableRowsToObjects(rows){
  const cleanRows = (Array.isArray(rows) ? rows : [])
    .map((row) => Array.isArray(row) ? row.map((value) => String(value ?? "").trim()) : [])
    .filter((row) => row.some(Boolean));
  if(!cleanRows.length) return [];

  const headerIndex = detectHeaderRowIndex(cleanRows);
  const headers = makeUniqueHeaders(cleanRows[headerIndex] || []);
  return cleanRows
    .slice(headerIndex + 1)
    .filter((values) => values.some((value) => String(value).trim()))
    .map((values) => Object.fromEntries(headers.map((header, index) => [header, values[index] || ""])));
}

function detectHeaderRowIndex(rows){
  let bestIndex = 0;
  let bestScore = -Infinity;
  const maxRows = Math.min(rows.length, 12);

  for(let index = 0; index < maxRows; index++){
    const row = rows[index] || [];
    const nextRows = rows.slice(index + 1, Math.min(rows.length, index + 8));
    const nonEmpty = row.filter(Boolean).length;
    const score = row.reduce((sum, header, columnIndex) => {
      const samples = nextRows.map((sampleRow) => sampleRow[columnIndex] || "").filter(Boolean);
      return sum + scorePossibleHeader(header, samples);
    }, nonEmpty >= 3 ? 15 : 0);
    if(score > bestScore){
      bestScore = score;
      bestIndex = index;
    }
  }

  return bestIndex;
}

function scorePossibleHeader(header, samples=[]){
  const normalised = normaliseHeader(header);
  if(!normalised) return 0;
  let score = 0;
  const headerWords = [
    "span","pole","grid","reference","ngr","latitude","longitude","easting","northing",
    "primary","feeder","dist","distribution","circuit","contract","voltage","sub",
    "network","asset","line"
  ];
  if(headerWords.some((word) => normalised.includes(word))) score += 40;
  if(/[a-z]/i.test(header) && !/^[A-Z]{2}\d{6,12}$/i.test(compactSearchText(header))) score += 12;
  if(samples.some((value) => scoreSpanColumn("gridRef", header, value) >= 80)) score += 25;
  if(samples.some((value) => scoreSpanColumn("toPole", header, value) >= 80 || scoreSpanColumn("span", header, value) >= 80)) score += 18;
  return score;
}

function makeUniqueHeaders(headers){
  const seen = new Map();
  return headers.map((header, index) => {
    const base = String(header || `Column ${index + 1}`).trim() || `Column ${index + 1}`;
    const key = normaliseHeader(base) || `column${index + 1}`;
    const count = (seen.get(key) || 0) + 1;
    seen.set(key, count);
    return count === 1 ? base : `${base} ${count}`;
  });
}

function normaliseImportedSpans(rows){
  const cleanRows = (Array.isArray(rows) ? rows : []).filter((row) => row && Object.keys(row).length);
  const columnMap = inferSpanColumnMap(cleanRows);
  return cleanRows.map((row) => normaliseImportedSpan(row, columnMap)).filter(Boolean);
}

function normaliseImportedSpan(row, columnMap=null){
  const toPole = getSpanRowValue(row, "toPole", ["ToPole", "To Pole", "toPole"], columnMap);
  const networkNumber = getSpanRowValue(row, "networkNumber", ["Network Number", "Network No", "NetworkNumber", "networkNumber"], columnMap);
  const easting = parseCoordinateNumber(getSpanRowValue(row, "easting", ["Easting", "Eastings", "X", "OS Easting"], columnMap));
  const northing = parseCoordinateNumber(getSpanRowValue(row, "northing", ["Northing", "Northings", "Y", "OS Northing"], columnMap));

  const span = {
    primaryNo:getSpanRowValue(row, "primaryNo", ["Primary No", "PrimaryNo", "primaryNo", "Network Number", "Network No", "NetworkNumber"], columnMap),
    primaryName:getSpanRowValue(row, "primaryName", ["Primary Name", "PrimaryName", "primaryName", "Primary Sub", "Primary Substation"], columnMap),
    hvFeeder:getSpanRowValue(row, "hvFeeder", ["HV Feeder", "HVFeeder", "hvFeeder", "Feeder No", "Feeder Number"], columnMap),
    feederName:getSpanRowValue(row, "feederName", ["Feeder Name", "FeederName", "feederName"], columnMap),
    distNo:getSpanRowValue(row, "distNo", ["Dist No", "DistNo", "distNo", "LV Sub No", "LV Sub Number"], columnMap),
    circuitName:getSpanRowValue(row, "circuitName", ["circuitName", "Circuit Name", "CircuitName", "Contract", "LV Sub Name"], columnMap),
    voltage:getSpanRowValue(row, "voltage", ["V", "Voltage", "voltage", "Network Voltage"], columnMap),
    span:getSpanRowValue(row, "span", ["Span", "span", "spanId", "Line No", "Line Number"], columnMap) || toPole,
    toPole,
    externalReference:getSpanRowValue(row, "externalReference", ["ExternalReference", "External Reference", "externalReference", "Reference", "Ref"], columnMap),
    networkNumber,
    gridRef:getSpanRowValue(row, "gridRef", ["Grid Ref", "GridRef", "gridRef", "Grid Reference", "GridReference", "NGR", "OS Grid", "Site Grid Ref"], columnMap),
    latitude:parseCoordinateNumber(getSpanRowValue(row, "latitude", ["latitude", "Latitude", "lat"], columnMap)),
    longitude:parseCoordinateNumber(getSpanRowValue(row, "longitude", ["longitude", "Longitude", "lon", "lng"], columnMap)),
    easting,
    northing
  };

  if((!span.gridRef || span.gridRef === "Unavailable") && Number.isFinite(easting) && Number.isFinite(northing)){
    span.gridRef = formatGridRef(easting, northing);
  }
  if(!isUsableCoordinate(span.latitude, span.longitude) && Number.isFinite(easting) && Number.isFinite(northing)){
    const position = eastNorthToLatLon(easting, northing);
    span.latitude = position.lat;
    span.longitude = position.lon;
    span.coordinateSource = "eastNorth";
  }

  if(!span.span && !span.toPole && !span.gridRef) return null;
  const repaired = repairSpanPosition(span);
  if(!isUsableCoordinate(repaired.latitude, repaired.longitude)) return null;
  return repaired;
}

function inferSpanColumnMap(rows){
  const fields = [
    "gridRef","latitude","longitude","easting","northing","voltage","toPole","span",
    "primaryNo","primaryName","hvFeeder","feederName","distNo","circuitName",
    "externalReference","networkNumber"
  ];
  const keys = [...new Set(rows.flatMap((row) => Object.keys(row || {})))];
  const map = {};
  const used = new Set();

  for(const field of fields){
    const candidates = keys
      .filter((key) => !used.has(key))
      .map((key) => ({
        key,
        score:scoreSpanColumnAcrossRows(field, key, rows)
      }))
      .filter((candidate) => candidate.score >= 55)
      .sort((a, b) => b.score - a.score);
    if(candidates[0]){
      map[field] = candidates[0].key;
      if(!["span","externalReference"].includes(field)) used.add(candidates[0].key);
    }
  }

  return map;
}

function scoreSpanColumnAcrossRows(field, key, rows){
  const values = rows.map((row) => row?.[key]).filter((value) => String(value ?? "").trim()).slice(0, 40);
  const headerScore = scoreSpanColumn(field, key, "");
  if(!values.length) return headerScore;
  const valueScores = values.map((value) => scoreSpanColumn(field, key, value));
  const average = valueScores.reduce((sum, score) => sum + score, 0) / valueScores.length;
  const best = Math.max(...valueScores);
  return headerScore + Math.min(70, average * 0.45) + Math.min(45, best * 0.25);
}

function getSpanRowValue(row, field, names, columnMap=null){
  const mappedKey = columnMap?.[field];
  if(mappedKey && String(row[mappedKey] ?? "").trim()) return String(row[mappedKey]).trim();

  const exact = getRowValue(row, names);
  if(exact) return exact;

  const candidates = Object.keys(row)
    .map((key) => ({
      key,
      value:String(row[key] ?? "").trim(),
      score:scoreSpanColumn(field, key, row[key])
    }))
    .filter((candidate) => candidate.value && candidate.score >= 45)
    .sort((a, b) => b.score - a.score);

  return candidates[0]?.value || "";
}

function scoreSpanColumn(field, key, value){
  const header = normaliseHeader(key);
  const headerText = normaliseSearchText(key);
  const text = String(value ?? "").trim();
  const compact = compactSearchText(text);
  let score = 0;

  const hasAny = (items) => items.some((item) => header.includes(item) || headerText.includes(item));
  const hasAll = (items) => items.every((item) => header.includes(item) || headerText.includes(item));

  if(field === "gridRef"){
    if(hasAny(["gridref","gridreference","ngr","osgrid","sitegrid","osref","mapref","grid"])) score += 90;
    if(/^[A-Z]{2}\s*\d{3,6}\s*\d{3,6}$/i.test(text) || /^[A-Z]{2}\d{6,12}$/i.test(compact)) score += 80;
  }else if(field === "latitude"){
    if(hasAny(["latitude","lat"])) score += 90;
    const number = parseCoordinateNumber(text);
    if(number >= 49 && number <= 61) score += 45;
  }else if(field === "longitude"){
    if(hasAny(["longitude","long","lng","lon"])) score += 90;
    const number = parseCoordinateNumber(text);
    if(number >= -9 && number <= 2) score += 45;
  }else if(field === "easting"){
    if(hasAny(["easting","eastings","oseasting"]) || header === "x") score += 90;
    const number = parseCoordinateNumber(text);
    if(number >= 0 && number <= 700000) score += 45;
  }else if(field === "northing"){
    if(hasAny(["northing","northings","osnorthing"]) || header === "y") score += 90;
    const number = parseCoordinateNumber(text);
    if(number >= 0 && number <= 1300000) score += 45;
  }else if(field === "voltage"){
    if(hasAny(["voltage","volt","kv","networkvoltage"]) || header === "v") score += 85;
    if(/\b(LV|HV|11\s*kV|33\s*kV|66\s*kV|132\s*kV)\b/i.test(text)) score += 60;
  }else if(field === "toPole"){
    if(hasAny(["topole","poleto","poleid","poleno","polenumber","structure","asset","support"])) score += 90;
    if(hasAll(["to","pole"])) score += 95;
    if(header === "pole") score += 70;
    if(/^[A-Z]{2,6}\s*\d+[A-Z]?$/i.test(text) || /^[A-Z0-9]+\/\d+$/i.test(text)) score += 45;
  }else if(field === "span"){
    if(hasAny(["span","spanid","section","lineno","linenumber","lineid","circuitsection"])) score += 90;
    if(/^[A-Z0-9-]+\/?\d*[A-Z]?$/i.test(text) && /\d/.test(text)) score += 40;
  }else if(field === "primaryNo"){
    if(hasAll(["primary","no"]) || hasAll(["primary","number"]) || hasAny(["primaryno","primarynumber","networknumber","networkno","primarysubno"])) score += 90;
    if(/^\d{2,6}(\/\d{1,6})?$/.test(text)) score += 35;
  }else if(field === "primaryName"){
    if(hasAll(["primary","name"]) || hasAll(["primary","sub"]) || hasAny(["primaryname","substationname","primarysubname"])) score += 90;
    if(/[A-Za-z]{3,}/.test(text) && !/\b(LV|HV|kV)\b/i.test(text)) score += 25;
  }else if(field === "hvFeeder"){
    if(hasAll(["hv","feeder"]) || hasAll(["11kv","feeder"]) || hasAny(["hvfeeder","feederno","feedernumber"])) score += 95;
    if(/\b(HV|11\s*kV|33\s*kV)\b/i.test(text)) score += 30;
  }else if(field === "feederName"){
    if(hasAll(["feeder","name"]) || hasAny(["feedername"])) score += 90;
  }else if(field === "distNo"){
    if(hasAny(["distno","distributionno","distributionsubno","lvsubno","lvsubnumber"]) || hasAll(["dist","no"]) || hasAll(["sub","no"])) score += 90;
    if(/^\d{2,6}$/.test(text)) score += 25;
  }else if(field === "circuitName"){
    if(hasAny(["circuitname","contract","lvsubname","lvsubstationname"]) || hasAll(["circuit","name"]) || hasAll(["lv","name"])) score += 90;
  }else if(field === "externalReference"){
    if(hasAny(["externalreference","externalref","reference","ref","id"])) score += 85;
  }else if(field === "networkNumber"){
    if(hasAny(["networknumber","networkno","assetnumber","assetno"])) score += 90;
  }

  return score;
}

function getRowValue(row, names){
  const keys = Object.keys(row);
  const wanted = names.map((name) => normaliseHeader(name));
  const match = keys.find((key) => wanted.includes(normaliseHeader(key)));
  return match ? String(row[match]).trim() : "";
}

function normaliseHeader(value){
  return String(value).toLowerCase().replace(/[^a-z0-9]+/g, "");
}

function updateW3W(){
  if(!currentReport) return;
  const input = document.getElementById("w3wInput");
  currentReport.w3w = input ? input.value.trim() : "";
}

function saveW3WKey(){
  const input = document.getElementById("w3wKeyInput");
  const key = input ? input.value.trim() : "";
  if(!key){
    localStorage.removeItem("treeSurveyW3WKey");
    setW3WStatus("API key removed from this device.");
    return;
  }
  localStorage.setItem("treeSurveyW3WKey", key);
  setW3WStatus("API key saved on this device.");
}

function getW3WKey(){
  const input = document.getElementById("w3wKeyInput");
  return (input && input.value.trim()) || localStorage.getItem("treeSurveyW3WKey") || "";
}

function setW3WStatus(message){
  const status = document.getElementById("w3wStatus");
  if(status) status.textContent = message;
}

function setW3WValue(value){
  const valueEl = document.getElementById("w3wValue");
  if(valueEl) valueEl.textContent = value || "No w3w yet";
  if(currentReport) currentReport.w3w = value || "";
}

async function convertMarkerToW3W(){
  if(!w3wMarkerPosition){
    setW3WStatus("No marker position available yet.");
    return;
  }

  const key = getW3WKey();
  if(!key){
    setW3WStatus("Paste your what3words API key first.");
    return;
  }

  saveW3WKey();
  setW3WStatus("Converting marker position...");

  const { lat, lng } = w3wMarkerPosition;
  const url = `https://api.what3words.com/v3/convert-to-3wa?coordinates=${encodeURIComponent(`${lat},${lng}`)}&language=en&format=json&key=${encodeURIComponent(key)}`;

  try{
    const response = await fetch(url);
    const data = await response.json();

    if(!response.ok || data.error){
      const message = data?.error?.message || "what3words did not return a result.";
      throw new Error(message);
    }

    const words = data.words ? `///${data.words}` : "";
    if(!words) throw new Error("No what3words address returned.");

    setW3WValue(words);
    setW3WStatus(`Marker converted near ${data.nearestPlace || "selected position"}.`);
  }catch(error){
    setW3WStatus(error.message || "Could not convert marker position.");
  }
}

function copyCurrentW3W(){
  const words = currentReport?.w3w || document.getElementById("w3wValue")?.textContent || "";
  if(!words || words === "No w3w yet"){
    setW3WStatus("Convert the marker before copying.");
    return;
  }
  copyText(encodeURIComponent(words));
}

function resetW3WMarker(){
  if(!currentReport) return;
  setW3WMarker(currentReport.lat, currentReport.lon, true);
  setW3WValue("");
  setW3WStatus("Marker reset to the grid reference location.");
}

function searchSpan(event){
  event.preventDefault();
  const query = spanSearchInput.value.trim();

  if(!Array.isArray(window.SPAN_DATA) || !window.SPAN_DATA.length){
    setElementStatus(spanSearchStatus, "Import a span spreadsheet before searching.", "error");
    spanSearchResults.innerHTML = "";
    return;
  }

  if(!query){
    setElementStatus(spanSearchStatus, "Enter a span, pole, feeder, circuit, primary, or grid reference.", "error");
    spanSearchResults.innerHTML = "";
    return;
  }

  const matches = findSpanMatches(query, 5);
  currentSpanMatches = matches;

  if(!matches.length){
    setElementStatus(spanSearchStatus, `No matches found for "${query}".`, "error");
    currentSpanMatches = [];
    spanSearchResults.innerHTML = "";
    return;
  }

  setElementStatus(spanSearchStatus, `${matches.length} best match${matches.length === 1 ? "" : "es"} for "${query}".`);
  spanSearchResults.innerHTML = matches.map((span, index) => renderSpanSearchResult(span, index)).join("");
}

function findSpanMatches(query, limit=5){
  const terms = normaliseSearchText(query).split(" ").filter(Boolean);
  const spans = Array.isArray(window.SPAN_DATA) ? window.SPAN_DATA : [];
  if(!terms.length || !spans.length) return [];

  return spans
    .map((span) => ({ ...span, score: scoreSpanMatch(span, terms) }))
    .filter((span) => span.score > 0)
    .sort((a, b) => b.score - a.score || String(a.span).localeCompare(String(b.span)))
    .slice(0, limit);
}

function scoreSpanMatch(span, terms){
  const weightedFields = [
    [span.span, 90],
    [span.toPole, 70],
    [span.externalReference, 70],
    [span.gridRef, 60],
    [formatSpreadsheetGridRef(span.gridRef || ""), 75],
    [span.hvFeeder, 50],
    [span.circuitName, 45],
    [span.distNo, 40],
    [span.primaryNo, 35],
    [span.primaryName, 30],
    [span.feederName, 25],
    [span.voltage, 15]
  ];

  let score = 0;
  const voltage = normaliseSearchText(span.voltage || "");
  const compactSpan = compactSearchText(span.span || "");
  const compactExternal = compactSearchText(span.externalReference || "");
  const spanBaseDigits = String(span.span || "").split("/")[0].replace(/\D/g, "");

  for(const term of terms){
    let termScore = 0;
    const compactTerm = compactSearchText(term);

    if(voltage.startsWith("lv") && lvTailMatches(spanBaseDigits, compactTerm)){
      termScore = Math.max(termScore, 260);
    }

    if(voltage.startsWith("hv") && compactTerm.length >= 2 && compactSpan.startsWith(compactTerm)){
      termScore = Math.max(termScore, compactTerm.length >= 4 ? 260 : 210);
    }

    if(compactTerm && (compactSpan === compactTerm || compactExternal === compactTerm)){
      termScore = Math.max(termScore, 300);
    }

    for(const [value, weight] of weightedFields){
      const text = normaliseSearchText(value || "");
      const compactText = compactSearchText(value || "");
      if(!text) continue;
      if(text === term) termScore = Math.max(termScore, weight * 3);
      else if(compactText === compactTerm) termScore = Math.max(termScore, weight * 3);
      else if(text.startsWith(term)) termScore = Math.max(termScore, weight * 2);
      else if(compactText.startsWith(compactTerm)) termScore = Math.max(termScore, weight * 2);
      else if(text.includes(term)) termScore = Math.max(termScore, weight);
      else if(compactText.includes(compactTerm)) termScore = Math.max(termScore, weight);
    }
    if(termScore === 0) return 0;
    score += termScore;
  }

  return score;
}

function normaliseSearchText(value){
  return String(value)
    .toLowerCase()
    .replace(/[^a-z0-9]+/g, " ")
    .trim();
}

function compactSearchText(value){
  return String(value)
    .toLowerCase()
    .replace(/[^a-z0-9]+/g, "");
}

function lvTailMatches(spanBaseDigits, term){
  if(!spanBaseDigits || !/^\d{1,4}$/.test(term)) return false;
  const tail = spanBaseDigits.slice(-4);
  return stripLeadingZeroes(tail) === stripLeadingZeroes(term) || tail === term.padStart(4, "0");
}

function stripLeadingZeroes(value){
  return String(value).replace(/^0+/, "") || "0";
}

function renderSpanSearchResult(span, index){
  const isLv = normaliseSearchText(span.voltage || "").startsWith("lv");
  const voltage = voltageLabel(span.voltage);
  const mainValue = isLv && span.toPole
    ? `LV To Pole ${span.toPole}`
    : `${voltage || "Unknown"} ${span.span || "Unknown span"}`;
  const detail = isLv
    ? `${voltage || "LV"} span ${span.span || "Unknown span"}`
    : "";

  return `
    <article class="card span-match-card" id="span-search-${index}" role="button" tabindex="0" onclick="useSpanFromSearch(${index})" onkeydown="handleSpanCardKey(event, ${index})">
      <h2>Span match</h2>
      <div class="value">${escapeHtml(mainValue)}</div>
      ${detail ? `<div class="detail">${escapeHtml(detail)}</div>` : ""}
      <div class="asset-line"><strong>Primary:</strong> ${escapeHtml(primarySubValue(span) || "Not listed")}</div>
      <div class="asset-line"><strong>HV feeder:</strong> ${escapeHtml(span.hvFeeder || "Not listed")}</div>
      <div class="asset-line"><strong>Dist/circuit:</strong> ${escapeHtml([span.distNo, span.circuitName].filter(Boolean).join(" / ") || "Not listed")}</div>
      <div class="asset-line"><strong>To pole:</strong> ${escapeHtml(span.toPole || "Not listed")}</div>
      <div class="detail">Tap to select this span.</div>
    </article>
  `;
}

function handleSpanCardKey(event, index){
  if(event.key !== "Enter" && event.key !== " ") return;
  event.preventDefault();
  useSpanFromSearch(index);
}

function useSpanFromSearch(index){
  const span = currentSpanMatches[index];
  if(!span) return;
  fillFromSpanRecord(span);
}

function useSpanFromLocate(index){
  const span = currentLocateMatches[index];
  if(!span) return;
  fillFromSpanRecord(span);
}

function fillFromSpanRecord(span){
  const position = getSpanMapPosition(span);

  if(!position){
    setElementStatus(spanSearchStatus, "That span has no usable map position. Add latitude/longitude or grid ref.", "error");
    return;
  }

  const selectedSpan = { ...span, latitude:position.lat, longitude:position.lon };
  const gridRef = span.gridRef ? formatSpreadsheetGridRef(span.gridRef) : latLonToOSGrid(position.lat, position.lon);

  renderLocationCards({
    lat: position.lat,
    lon: position.lon,
    accuracy: "",
    gridRef,
    gridDetail: "Six-figure grid reference from the selected span.",
    nearestSpan: selectedSpan,
    spanTitle: Number.isFinite(span.distanceM) && span.distanceM > 0 ? "Selected nearby span" : "Selected span from search",
    sourceNote: "Filled from your uploaded span spreadsheet."
  });

  setElementStatus(spanSearchStatus, `Filled from ${voltageLabel(span.voltage) || "span"} ${span.span || ""}.`, "success");
  spanSearchInput.value = "";
  currentSpanMatches = [];
  spanSearchResults.innerHTML = "";
  resultsEl.scrollIntoView({ behavior:"smooth", block:"start" });
}

function locate(){
  if(!navigator.geolocation){
    resultsEl.innerHTML = card("error","Error","Location is not supported by this browser.","Use a modern mobile browser over HTTPS.");
    return;
  }

  setBusy(true,"Locating...");
  resultsEl.innerHTML = "";

  navigator.geolocation.getCurrentPosition(showLocation, showError, {
    enableHighAccuracy:true,
    timeout:12000,
    maximumAge:0
  });
}

async function showLocation(pos){
  const lat = pos.coords.latitude;
  const lon = pos.coords.longitude;
  const accuracy = Math.round(pos.coords.accuracy);
  const nearestSpans = findNearestSpans(lat, lon, 5);
  currentLocateMatches = nearestSpans;

  setBusy(false, nearestSpans.length ? "Choose span" : "No span data");
  renderNearestSpanChoices(nearestSpans, accuracy);
}

function renderNearestSpanChoices(spans, accuracy){
  if(!Array.isArray(window.SPAN_DATA) || !window.SPAN_DATA.length){
    resultsEl.innerHTML = card(
      "nearest-spans",
      "Nearest spans",
      "No span data imported",
      "Import your span spreadsheet, then press locate again."
    );
    return;
  }

  if(!spans.length){
    resultsEl.innerHTML = card(
      "nearest-spans",
      "Nearest spans",
      "No nearby spans found",
      "The imported rows need latitude and longitude before locate can rank them."

    return;
  }

  resultsEl.innerHTML = `
    <article class="card" id="nearest-spans">
      <h2>Nearest spans</h2>
      <div class="value">Choose the span</div>
      <div class="detail">Device accuracy about ${escapeHtml(accuracy || "unknown")} m. The w3w marker will start from the span you choose.</div>

  const mainValue = isLv && span.toPole

function findNearestAE(lat, lon){
  const hospitals = Array.isArray(window.AE_DATA) ? window.AE_DATA : [];
  return hospitals
    .filter((hospital) => Number.isFinite(hospital.latitude) && Number.isFinite(hospital.longitude))
    .map((hospital) => ({
      ...hospital,
      distanceKm:haversineKm(lat, lon, hospital.latitude, hospital.longitude)
    }))
    .sort((a, b) => a.distanceKm - b.distanceKm)[0] || null;
}

function initW3WMap(lat, lon, gridRef, attempts=0){
  w3wMarkerPosition = { lat, lng:lon };

  if(!window.L){
    if(attempts > 12){
      setW3WStatus("Map could not load. Check signal, then refresh and try again.");
      return;
    }
    setW3WStatus("Map is loading. Try the marker in a few seconds.");
    setTimeout(() => initW3WMap(lat, lon, gridRef, attempts + 1), 500);
    return;
  }

  if(w3wMap){
    w3wMap.remove();
    w3wMap = null;
    w3wMarker = null;
  }

  const mapEl = document.getElementById("w3wMap");
  if(!mapEl) return;

  w3wMap = L.map(mapEl, {
    zoomControl:true,
    attributionControl:true
  }).setView([lat, lon], 17);

  const streetLayer = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom:19,
    attribution:"&copy; OpenStreetMap"
  });

  const satelliteLayer = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {
    maxZoom:19,
    attribution:"Sources: Esri, Maxar, Earthstar Geographics, and the GIS User Community"
  }).addTo(w3wMap);

  L.control.layers({
    "Satellite": satelliteLayer,
    "Street map": streetLayer
  }, null, {
    collapsed:false,
    position:"topright"
  }).addTo(w3wMap);

  w3wMarker = L.marker([lat, lon], {
    draggable:true,
    title:"Emergency access point"
  }).addTo(w3wMap);

  w3wMarker.bindPopup("Emergency access point").openPopup();

  w3wMarker.on("dragend", () => {
    const position = w3wMarker.getLatLng();
    setW3WMarker(position.lat, position.lng);
    setW3WValue("");
    setW3WStatus("Marker moved. Convert again for the access-point w3w.");
  });

  w3wMap.on("click", (event) => {
    setW3WMarker(event.latlng.lat, event.latlng.lng, true);
    setW3WValue("");
    setW3WStatus("Marker moved. Convert again for the access-point w3w.");
  });

  setTimeout(() => w3wMap.invalidateSize(), 100);
  setW3WStatus(`Marker starts at ${gridRef}. Tap or drag it to the emergency access point.`);
}

function setW3WMarker(lat, lng, pan=false){
  w3wMarkerPosition = { lat, lng };
  if(w3wMarker) w3wMarker.setLatLng([lat, lng]);
  if(w3wMap && pan) w3wMap.setView([lat, lng], w3wMap.getZoom());
}

function findNearestSpans(lat, lon, limit=5){
  const spans = Array.isArray(window.SPAN_DATA) ? window.SPAN_DATA : [];
  return spans
    .map((span) => ({ span, position:getSpanMapPosition(span) }))
    .filter((item) => item.position)
    .map((item) => ({
      ...item.span,
      latitude:item.position.lat,
      longitude:item.position.lon,
      distanceM: Math.round(haversineKm(lat, lon, item.position.lat, item.position.lon) * 1000)
    }))
    .sort((a, b) => a.distanceM - b.distanceM)
    .slice(0, limit);
}
