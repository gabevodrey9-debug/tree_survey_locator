<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Tree Survey Locator</title>

  <link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

  <style>
    body { font-family: Spectral, serif; background:#0f2318; color:#f0ebe0; margin:0; padding:0; }
    header { padding:20px; border-bottom:1px solid #333; }
    main { padding:20px; display:flex; flex-direction:column; gap:15px; align-items:center; }

    #locateBtn {
      width:120px;height:120px;border-radius:50%;
      border:2px solid #d4910a;
      background:#3d7a4f;
      font-size:40px;
    }

    .card {
      width:100%;
      max-width:420px;
      padding:15px;
      border:1px solid rgba(255,255,255,0.15);
      border-radius:12px;
      background:rgba(255,255,255,0.05);
      word-break:break-word;
    }

    .label { font-size:12px; opacity:0.7; margin-bottom:6px; }
    .value { font-family:"JetBrains Mono", monospace; font-size:16px; }

    .error { background:#3a1a1a; padding:10px; border-radius:10px; display:none; }
  </style>
</head>

<body>

<header>
  <h2>🌳 Tree Survey Locator</h2>
</header>

<main>

  <button id="locateBtn">📍</button>
  <div id="status">Tap to locate</div>

  <div id="error" class="error"></div>

  <div id="output"></div>

</main>

<script>
function showError(msg){
  const e=document.getElementById("error");
  e.style.display="block";
  e.textContent=msg;
}

function osGrid(lat, lon){
  const latRad = lat * Math.PI/180;
  const lonRad = lon * Math.PI/180;

  const a = 6377563.396, b = 6356256.909;
  const e2 = 1 - (b*b)/(a*a);

  const nu = a / Math.sqrt(1 - e2 * Math.sin(latRad)**2);
  const x = nu * Math.cos(latRad) * Math.cos(lonRad);
  const y = nu * Math.cos(latRad) * Math.sin(lonRad);

  const easting = Math.round(400000 + y) % 100000;
  const northing = Math.round(500000 + x) % 100000;

  return `${easting.toString().padStart(5,"0")} ${northing.toString().padStart(5,"0")}`;
}

async function fetchW3W(lat, lon){
  const key = localStorage.getItem("w3w_key");
  if(!key) return "No API key";

  try{
    const r = await fetch(`https://api.what3words.com/v3/convert-to-3wa?coordinates=${lat},${lon}&key=${key}`);
    const d = await r.json();
    return d.words ? "///" + d.words : "W3W error";
  }catch{
    return "W3W failed";
  }
}

async function fetchAE(lat, lon){
  const q = `
  [out:json];
  (
    node["amenity"="hospital"]["emergency"="yes"](around:50000,${lat},${lon});
  );
  out;
  `;

  try{
    const r = await fetch("https://overpass-api.de/api/interpreter?data=" + encodeURIComponent(q));
    const d = await r.json();
    if(!d.elements.length) return "No A&E found";

    const h = d.elements[0];
    return h.tags?.name || "Unknown hospital";
  }catch{
    return "A&E lookup failed";
  }
}

function locate(){

  const btn=document.getElementById("locateBtn");
  const status=document.getElementById("status");
  const out=document.getElementById("output");
  const err=document.getElementById("error");

  err.style.display="none";
  out.innerHTML="";
  status.textContent="Locating...";
  btn.textContent="...";

  navigator.geolocation.getCurrentPosition(async (pos)=>{

    const lat=pos.coords.latitude;
    const lon=pos.coords.longitude;

    const grid=osGrid(lat,lon);
    const w3w=await fetchW3W(lat,lon);
    const ae=await fetchAE(lat,lon);

    out.innerHTML=`
      <div class="card">
        <div class="label">Coordinates</div>
        <div class="value">${lat.toFixed(5)}, ${lon.toFixed(5)}</div>
      </div>

      <div class="card">
        <div class="label">OS Grid Reference</div>
        <div class="value">${grid}</div>
      </div>

      <div class="card">
        <div class="label">What3Words</div>
        <div class="value">${w3w}</div>
      </div>

      <div class="card">
        <div class="label">Nearest A&E</div>
        <div class="value">${ae}</div>
      </div>
    `;

    status.textContent="Found";
    btn.textContent="📍";

  },(e)=>{
    showError(e.message);
    status.textContent="Failed";
    btn.textContent="📍";
  });
}

document.getElementById("locateBtn").addEventListener("click", locate);
</script>

</body>
</html>
