<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tree Survey">
  <title>Tree Survey Locator</title>

  <link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

  <style>
    /* --- your CSS unchanged --- */
    :root {
      --forest: #0f2318;
      --forest2: #1a3a28;
      --leaf: #3d7a4f;
      --leaf-light: #5aaa70;
      --amber: #d4910a;
      --amber-light: #f0b030;
      --red: #b03020;
      --cream: #f0ebe0;
      --muted: #7a9a85;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: var(--forest);
      font-family: 'Spectral', serif;
      color: var(--cream);
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 30px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    #locateBtn {
      width:130px;height:130px;border-radius:50%;
      border:2px solid var(--amber);
      background:var(--leaf);
      font-size:44px;
    }

    .card { margin-top:20px; padding:15px; border:1px solid rgba(255,255,255,0.1); border-radius:12px; }

    .error-box {
      display:none;
      background:rgba(176,48,32,0.2);
      padding:12px;
      margin-top:10px;
      border-radius:10px;
    }
  </style>
</head>

<body>

<header>
  <h1>🌳 Tree Survey Locator</h1>
</header>

<main style="padding:20px">

  <button id="locateBtn" onclick="locate()">📍</button>
  <div id="locateLabel">Tap to locate</div>

  <div id="errorBox" class="error-box"></div>

  <div id="cards"></div>

</main>

<script>
function showError(msg){
  const err=document.getElementById('errorBox');
  err.style.display='block';
  err.textContent=msg;

  const btn=document.getElementById('locateBtn');
  btn.textContent='📍';
}

function locate(){
  const btn=document.getElementById('locateBtn');
  const lbl=document.getElementById('locateLabel');
  const err=document.getElementById('errorBox');
  const cards=document.getElementById('cards');

  err.style.display='none';
  cards.innerHTML='';

  btn.textContent='...';
  lbl.textContent='Locating...';

  if(!navigator.geolocation){
    showError("Geolocation not supported");
    return;
  }

  navigator.geolocation.getCurrentPosition(
    (pos)=>{
      const lat=pos.coords.latitude;
      const lon=pos.coords.longitude;

      cards.innerHTML=`
        <div class="card">
          📍 Lat: ${lat.toFixed(5)}<br>
          📍 Lon: ${lon.toFixed(5)}
        </div>
      `;

      btn.textContent='📍';
      lbl.textContent='Tap to locate';
    },
    (err)=>{
      showError(err.message || "Location failed");
      btn.textContent='📍';
      lbl.textContent='Tap to locate';
    }
  );
}
</script>

</body>
</html>
